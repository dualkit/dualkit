<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>عنوان التوصيل</title>
<style>body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:17px;line-height:1.8;margin:0;padding:24px}
input,select,button,textarea{font:inherit;padding-block:12px;padding-inline:16px;inline-size:100%;box-sizing:border-box}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.row button{inline-size:auto}</style></head>
<body>
<h1>عنوان التوصيل</h1>
<label>المبنى أو الفيلا <input type="text"></label>
<label>الشارع <input type="text"></label>
<label>المنطقة <input type="text"></label>
<label>رقم مكاني <input type="text" inputmode="numeric" dir="ltr"></label>
<label>الإمارة <select><option>أبوظبي</option><option selected>دبي</option><option>الشارقة</option><option>عجمان</option><option>أم القيوين</option><option>رأس الخيمة</option><option>الفجيرة</option></select></label>
<label>رقم الجوال <input type="tel" dir="ltr" placeholder="050 123 4567"></label>
<button>حفظ العنوان</button>
</body></html>
