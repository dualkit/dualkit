name: Bench
on:
  schedule:
    # The 1st starts the month; the 2nd and 3rd finish any builds a deadline left (a rerun with nothing new commits nothing).
    - cron: '17 4 1-3 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to run, YYYY-MM (default: this month, UTC)'
        required: false
      model:
        description: 'Only this model id from packages/bench/models.json'
        required: false
permissions:
  contents: write
concurrency:
  group: bench
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @dualkit/rules
      - run: npx playwright@1.55.0 install --with-deps chromium
      - name: Set the bot identity
        run: |
          git config user.name 'dualkit-bench[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run the bench
        timeout-minutes: 165
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTH: ${{ inputs.month }}
          MODEL: ${{ inputs.model }}
        run: |
          args=()
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          # Push progress every 15 minutes so the live page can follow the run. These commits touch only
          # bench/runs/, which Vercel skips (only apps/site and packages/format trigger a deploy), so the
          # site does not redeploy each time.
          ( while sleep 900; do
              git add -A -- bench/runs 2>/dev/null
              git diff --cached --quiet || git commit -qm "chore(bench): progress for ${MONTH:-$(date -u +%Y-%m)}"
              git pull --rebase --autostash -q && git push -q || true
            done ) &
          pusher=$!
          set +e
          npm run bench -w @dualkit/bench -- --no-summary "${args[@]}"
          status=$?
          kill "$pusher" 2>/dev/null
          exit $status
      - name: Build the summary
        if: always()
        timeout-minutes: 20
        env:
          MONTH: ${{ inputs.month }}
        run: |
          args=()
          [ -n "$MONTH" ] && args+=(--month "$MONTH")
          npm run bench -w @dualkit/bench -- --summary-only "${args[@]}"
      - name: Commit the results
        if: always()
        run: |
          paths=()
          for p in bench apps/site/content/bench apps/site/public/bench; do
            if [ -e "$p" ]; then paths+=("$p"); fi
          done
          if [ ${#paths[@]} -gt 0 ]; then git add -A -- "${paths[@]}"; fi
          git diff --cached --quiet || git commit -m "chore(bench): results for ${MONTH:-$(date -u +%Y-%m)}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then pushed=1; break; fi
            sleep 5
          done
          [ "$pushed" -eq 1 ] || exit 1
        env:
          MONTH: ${{ inputs.month }}
