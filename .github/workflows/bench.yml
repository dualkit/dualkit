name: Bench
on:
  schedule:
    # The 1st starts the month; the 2nd and 3rd finish any builds a deadline left (a rerun with nothing new commits nothing).
    - cron: '17 4 1-3 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to run, YYYY-MM (default: this month, UTC)'
        required: false
      model:
        description: 'Only this model id from packages/bench/models.json'
        required: false
      summary:
        description: 'Build the site summary and commit it (off: commit only bench/; scheduled runs always build it)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bench
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @dualkit/rules
      - run: npx playwright@1.55.0 install --with-deps chromium
      - name: Set the bot identity
        run: |
          git config user.name 'dualkit-bench[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Run the bench
        timeout-minutes: 345
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTH: ${{ inputs.month }}
          MODEL: ${{ inputs.model }}
        run: |
          # Resolve the month once (the input, or this month in UTC) so a run that crosses midnight at a month end
          # still summarises and commits the month it ran. Later steps read BENCH_MONTH from GITHUB_ENV.
          month_args=()
          [ -n "$MONTH" ] && month_args+=(--month "$MONTH")
          BENCH_MONTH=$(npm run -s bench -w @dualkit/bench -- --print-month "${month_args[@]}") || exit 1
          echo "BENCH_MONTH=$BENCH_MONTH" >> "$GITHUB_ENV"
          args=(--month "$BENCH_MONTH")
          [ -n "$MODEL" ] && args+=(--model "$MODEL")
          # Push progress every 15 minutes so the live page can follow the run. Each push is a snapshot commit on top of HEAD
          # (a small diff of bench/runs) force-pushed to the bench-progress branch, so main never gets progress commits
          # and HEAD never moves; the commit step at the end lands everything on main. bench-progress touches only
          # bench/runs, which Vercel skips (only apps/site and packages/format trigger a deploy).
          ( set +e
            while sleep 900; do
              git add -A -- bench/runs 2>/dev/null
              tree=$(git write-tree)
              commit=$(git commit-tree "$tree" -p HEAD -m "bench progress $BENCH_MONTH")
              git push -q -f origin "$commit:refs/heads/bench-progress" || true
              git reset -q
            done ) &
          pusher=$!
          set +e
          npm run bench -w @dualkit/bench -- --no-summary "${args[@]}"
          status=$?
          pkill -P "$pusher" 2>/dev/null
          kill "$pusher" 2>/dev/null
          wait "$pusher" 2>/dev/null
          git add -A -- bench/runs 2>/dev/null
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p HEAD -m "bench progress $BENCH_MONTH")
          git push -q -f origin "$commit:refs/heads/bench-progress" || true
          git reset -q
          exit $status
      - name: Keep the raw runs
        # 2099 rehearsal months are gitignored and never committed, so this artifact is the only way to read them.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-runs-${{ env.BENCH_MONTH }}
          path: bench/runs/${{ env.BENCH_MONTH }}
          if-no-files-found: warn
          retention-days: 30
      - name: Build the summary
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          # Without a month the run step failed before it started; never fall back to this month.
          [ -n "$BENCH_MONTH" ] || { echo "No month was resolved, so there is no summary to build."; exit 1; }
          # A scheduled run has no inputs, so only an explicit false turns the summary off.
          [ "$SUMMARY" = false ] && { echo "Summary turned off for this run."; exit 0; }
          npm run bench -w @dualkit/bench -- --summary-only --month "$BENCH_MONTH"
      - name: Commit the results
        if: ${{ !cancelled() }}
        env:
          SUMMARY: ${{ inputs.summary }}
        run: |
          [ -n "$BENCH_MONTH" ] || { echo "No month was resolved, so there is nothing to commit."; exit 1; }
          if [ "$SUMMARY" = false ]; then sources=(bench); else sources=(bench apps/site/content/bench apps/site/public/bench); fi
          paths=()
          for p in "${sources[@]}"; do
            if [ -e "$p" ]; then paths+=("$p"); fi
          done
          if [ ${#paths[@]} -gt 0 ]; then git add -A -- "${paths[@]}"; fi
          git diff --cached --quiet || git commit -m "chore(bench): results for ${BENCH_MONTH}"
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then pushed=1; break; fi
            sleep 5
          done
          [ "$pushed" -eq 1 ] || exit 1
