name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @dualkit/format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @dualkit/skills-tooling && git diff --exit-code cursor/rules
      - run: npm run build
