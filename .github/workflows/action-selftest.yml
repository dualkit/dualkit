name: Action self-test
on:
  pull_request:
    paths: [action/**, packages/cli/**, packages/rules/**, packages/lint/**]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dualkit/rules && npm run build -w @dualkit/lint && npm run build -w dualkit
      - id: dk
        uses: ./action
        with:
          url: packages/cli/test/fixtures/page.html
          command: node packages/cli/dist/cli.js
      - run: test "${{ steps.dk.outputs.score }}" -lt 100
  selftest-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @dualkit/rules && npm run build -w @dualkit/lint && npm run build -w dualkit
      - id: dk
        uses: ./action
        with:
          mode: lint
          paths: action/selftest/lint
          command: node packages/cli/dist/cli.js
      # The sample holds one physical-css note, so the step above passing proves fail-on error does not trip on it.
      # It lives outside any fixtures folder because lint skips the physical rules in fixtures, examples and demos.
      - run: test "${{ steps.dk.outputs.findings }}" -gt 0
