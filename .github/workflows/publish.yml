name: Publish a package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        type: choice
        options: [format, starter, rules, lint, cli] # publish lint before cli, which depends on it
        default: format
        required: true
      tag:
        description: npm dist-tag for this release
        default: beta
        required: true
permissions:
  contents: read
  id-token: write # npm provenance: proves the package was built from this repo
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - name: Starter outputs must match the token file
        if: inputs.package == 'starter'
        run: npm run build -w @dualkit/starter && git diff --exit-code packages/starter/generated
      - name: Resolve the workspace
        id: ws
        run: |
          if [ "${{ inputs.package }}" = cli ]; then echo "name=dualkit" >> "$GITHUB_OUTPUT"; else echo "name=@dualkit/${{ inputs.package }}" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare rules, lint and CLI (their tests need built packages, and the CLI needs Chromium)
        if: inputs.package == 'rules' || inputs.package == 'lint' || inputs.package == 'cli'
        run: |
          npm run build -w @dualkit/format
          npm run build -w @dualkit/rules
          if [ "${{ inputs.package }}" != rules ]; then npm run build -w @dualkit/lint; fi
          if [ "${{ inputs.package }}" != lint ]; then npx playwright@1.55.0 install --with-deps chromium; fi
      - run: npm publish -w ${{ steps.ws.outputs.name }} --provenance --access public --tag ${{ inputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Point latest at this version while it is the only one
        run: |
          VERSION=$(node -p "require('./packages/${{ inputs.package }}/package.json').version")
          npm dist-tag add "${{ steps.ws.outputs.name }}@$VERSION" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
