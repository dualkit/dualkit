<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملخص الدفع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-bg: #f6f8fa;
      --color-surface: #ffffff;
      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-border: #e2e8f0;
      --color-primary: #005b41;
      --color-primary-hover: #004532;
      --color-primary-light: #e6f4ea;
      --color-focus: #00875a;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      
      /* Type scale tokens */
      --type-caption-size: 14px;
      --type-label-size: 14px;
      --type-body-size: 16px;
      --type-title-size: 18px;
      --type-display-size: 32px;
    }

    /* Arabic typography rules */
    :lang(ar) {
      font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #e5e7eb;
      color: var(--color-text);
      font-size: var(--type-body-size);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .phone-canvas {
      width: 100%;
      max-width: 400px;
      background: var(--color-surface);
      border-radius: 28px;
      box-shadow: 0 16px 36px -8px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(15, 23, 42, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 780px;
    }

    /* Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--color-border);
    }

    .header-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-full);
      background: #f1f5f9;
      border: none;
      color: var(--color-text);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .header-btn:hover {
      background-color: #e2e8f0;
    }

    .header-title {
      font-size: var(--type-title-size);
      font-weight: 600;
      color: var(--color-text);
    }

    .header-placeholder {
      width: 40px;
    }

    /* Directional icons mirroring */
    .icon-directional:dir(rtl) {
      transform: scaleX(-1);
    }

    .main-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
    }

    /* Hero Amount Section */
    .amount-card {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 22px 18px;
      text-align: center;
    }

    .amount-label {
      font-size: var(--type-label-size);
      font-weight: 500;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }

    .amount-value {
      font-size: var(--type-display-size);
      font-weight: 700;
      color: var(--color-text);
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border-radius: var(--radius-full);
      font-size: var(--type-caption-size);
      font-weight: 600;
    }

    /* Card Panels */
    .info-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
    }

    .card-row:not(:last-child) {
      border-bottom: 1px solid var(--color-border);
    }

    .row-title {
      font-size: var(--type-label-size);
      color: var(--color-text-muted);
      font-weight: 500;
    }

    .row-value {
      font-size: var(--type-label-size);
      color: var(--color-text);
      font-weight: 600;
      text-align: end;
      font-variant-numeric: tabular-nums;
    }

    .calendar-dates {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .items-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #f8fafc;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .items-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background-color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      flex-shrink: 0;
    }

    .items-text {
      font-size: var(--type-label-size);
      color: var(--color-text);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Form Field */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-label {
      font-size: var(--type-label-size);
      font-weight: 600;
      color: var(--color-text);
    }

    /* Phone Input Container */
    .phone-input-wrapper {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .phone-input-wrapper:focus-within {
      border-color: var(--color-focus);
      box-shadow: 0 0 0 3px rgba(0, 135, 90, 0.15);
    }

    /* Fixed +971 chip placed at the logical start */
    .phone-prefix-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f1f5f9;
      padding: 0 12px;
      border-inline-end: 1px solid var(--color-border);
      font-weight: 600;
      font-size: var(--type-label-size);
      color: var(--color-text);
      user-select: none;
    }

    .flag-uae {
      display: inline-block;
      width: 18px;
      height: 12px;
      border-radius: 2px;
      background: linear-gradient(to bottom, #00732f 33.3%, #ffffff 33.3%, #ffffff 66.6%, #000000 66.6%);
      position: relative;
    }

    .flag-uae::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: #ff0000;
      border-radius: 2px 0 0 2px;
    }

    .phone-input {
      flex: 1;
      border: none;
      padding: 12px 14px;
      font-size: var(--type-body-size);
      font-family: inherit;
      color: var(--color-text);
      outline: none;
      background: transparent;
      font-variant-numeric: tabular-nums;
    }

    .phone-input::placeholder {
      color: #94a3b8;
    }

    .field-hint {
      font-size: var(--type-caption-size);
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    /* Action Footer */
    .app-footer {
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid var(--color-border);
      background-color: var(--color-surface);
    }

    .btn-pay {
      width: 100%;
      background-color: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 16px 20px;
      font-size: var(--type-body-size);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .btn-pay:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-pay:active {
      transform: scale(0.99);
    }

    .security-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--color-text-muted);
      font-size: var(--type-caption-size);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="phone-canvas" role="region" aria-label="شاشة ملخص الدفع">
    <!-- Header -->
    <header class="app-header">
      <button class="header-btn" type="button" aria-label="الرجوع إلى الصفحة السابقة">
        <!-- Directional chevron: mirrored in RTL -->
        <svg class="icon-directional" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <h1 class="header-title">ملخص الدفع</h1>

      <div class="header-placeholder" aria-hidden="true"></div>
    </header>

    <div class="main-content">
      <!-- Amount Card -->
      <section class="amount-card" aria-labelledby="amount-heading">
        <p id="amount-heading" class="amount-label">المبلغ المستحق</p>
        <div>
          <!-- Formatted Arabic currency amount with no dir="ltr" on the د.إ abbreviation -->
          <span class="amount-value"><bdi>1,234.50 د.إ</bdi></span>
        </div>
        <span class="badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          شامل ضريبة القيمة المضافة
        </span>
      </section>

      <!-- Details List -->
      <section class="info-card" aria-label="تفاصيل الاستحقاق">
        <div class="card-row">
          <span class="row-title">تاريخ الاستحقاق</span>
          <div class="row-value calendar-dates">
            <span id="gregorian-date">3 نوفمبر 2026 م</span>
            <span id="hijri-date" style="color: var(--color-text-muted);">23 جمادى الأولى 1448 هـ</span>
          </div>
        </div>
      </section>

      <!-- Pluralized items statement -->
      <section class="items-banner" aria-label="عدد عناصر الطلب">
        <div class="items-icon-wrap" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <!-- 3 items: Arabic 'few' plural rule -->
        <p class="items-text" id="order-items-line">لديك 3 عناصر في هذا الطلب</p>
      </section>

      <!-- Phone Number Field -->
      <section class="field-group">
        <label for="receipt-phone" class="field-label">رقم الهاتف لتأكيد الإيصال عبر الرسائل النصية</label>
        
        <!-- dir="ltr" input wrapper ensures +971 stays logically at the phone start -->
        <div class="phone-input-wrapper" dir="ltr">
          <div class="phone-prefix-chip" aria-hidden="true">
            <span class="flag-uae"></span>
            <span>+971</span>
          </div>
          <input
            id="receipt-phone"
            name="receiptPhone"
            type="tel"
            inputmode="tel"
            dir="ltr"
            autocomplete="tel-national"
            class="phone-input"
            placeholder="50 123 4567"
            aria-describedby="phone-hint"
          >
        </div>

        <!-- Phone hint containing isolated LTR phone number example -->
        <p id="phone-hint" class="field-hint">
          مثال <bdi dir="ltr">050 123 4567</bdi>
        </p>
      </section>
    </div>

    <!-- Action Button -->
    <footer class="app-footer">
      <!-- Neutral verbal noun 'الدفع الآن' -->
      <button class="btn-pay" type="button" id="pay-button">
        <span>الدفع الآن</span>
        <svg class="icon-directional" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div class="security-notice">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>عملية دفع مشفرة وآمنة بالكامل</span>
      </div>
    </footer>
  </main>

  <script>
    // 1. Plural rules calculation for Arabic with pinned Western digits (UAE convention)
    (function initPlural() {
      const count = 3;
      const pluralForms = {
        zero: 'لا توجد عناصر في هذا الطلب',
        one: 'لديك عنصر واحد في هذا الطلب',
        two: 'لديك عنصران في هذا الطلب',
        few: 'لديك {count} عناصر في هذا الطلب',
        many: 'لديك {count} عنصرًا في هذا الطلب',
        other: 'لديك {count} عنصر في هذا الطلب',
      };

      const pr = new Intl.PluralRules('ar');
      const rule = pr.select(count);
      const digitsFormatter = new Intl.NumberFormat('ar-AE-u-nu-latn');
      const line = pluralForms[rule].replace('{count}', digitsFormatter.format(count));

      const container = document.getElementById('order-items-line');
      if (container) {
        container.textContent = line;
      }
    })();

    // 2. Computed Umm al-Qura Hijri date with explicit 'Asia/Dubai' timeZone
    (function initDates() {
      const targetDate = new Date('2026-11-03T12:00:00Z');

      try {
        const hijriFormatter = new Intl.DateTimeFormat('ar-AE-u-ca-islamic-umalqura-nu-latn', {
          timeZone: 'Asia/Dubai',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
        
        const hijriText = hijriFormatter.format(targetDate) + ' هـ';
        const hijriEl = document.getElementById('hijri-date');
        if (hijriEl) {
          hijriEl.textContent = hijriText;
        }
      } catch (err) {
        // Fallback default already safely present in HTML
      }
    })();

    // 3. Normalize Arabic-Indic and Persian digits typed by the user to Western digits
    const phoneInput = document.getElementById('receipt-phone');
    if (phoneInput) {
      phoneInput.addEventListener('input', function (e) {
        const value = e.target.value;
        const normalized = value
          .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660)
          .replace(/[\u06f0-\u06f9]/g, d => d.charCodeAt(0) - 0x06f0);
        if (value !== normalized) {
          e.target.value = normalized;
        }
      });
    }

    // 4. Interactive Pay button feedback
    const payBtn = document.getElementById('pay-button');
    if (payBtn) {
      payBtn.addEventListener('click', function() {
        const originalText = this.innerHTML;
        this.innerHTML = '<span>جارٍ معالجة الدفع...</span>';
        this.style.pointerEvents = 'none';
        setTimeout(() => {
          this.innerHTML = originalText;
          this.style.pointerEvents = 'auto';
          alert('تم استلام طلب الدفع بنجاح.');
        }, 1200);
      });
    }
  </script>
</body>
</html>
