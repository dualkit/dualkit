<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>رمز التحقق لمرة واحدة</title>
  
  <!-- Font Pairing: IBM Plex Sans Arabic + IBM Plex Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Dualkit Arabic Typography Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-arabic: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-latin: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      
      /* Colors: Saudi Fintech Premium Emerald & Slate */
      --color-bg: #0b1319;
      --color-surface: #14202b;
      --color-surface-elevated: #1b2a38;
      --color-border: #243747;
      --color-border-focus: #00a86b;
      --color-primary: #00a86b;
      --color-primary-hover: #00bd78;
      --color-primary-active: #00935d;
      --color-text-main: #f5f8fa;
      --color-text-muted: #8e9fae;
      --color-text-disabled: #4e6070;
      --color-badge-bg: rgba(0, 168, 107, 0.12);
      --color-badge-border: rgba(0, 168, 107, 0.25);
      --color-error: #ff4d4f;

      /* Type Sizes: Floor is strictly 14px for Arabic UI elements */
      --type-label-size: 14px;
      --type-caption-size: 14px;
      --type-body-size: 16px;
      --type-title-size: 24px;
    }

    :lang(ar) {
      font-family: var(--font-arabic);
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.65;
    }

    body {
      background-color: #070c10;
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: var(--type-body-size);
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }

    /* Directional Icon Mirroring: Chevrons & Nav */
    .icon-directional:dir(rtl) {
      transform: scaleX(-1);
    }

    /* Device Mockup Shell (Phone Viewport) */
    .phone-container {
      width: 100%;
      max-width: 400px;
      background-color: var(--color-bg);
      border-radius: 40px;
      border: 1px solid #1e2c38;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      min-height: 740px;
      overflow: hidden;
      position: relative;
    }

    /* Phone Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-block: 14px 8px;
      padding-inline: 24px;
      color: var(--color-text-main);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-family: var(--font-latin);
    }

    .status-bar .notch {
      width: 96px;
      height: 22px;
      background-color: #000;
      border-radius: 20px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 20px;
      padding-block: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .header-btn {
      background: none;
      border: none;
      color: var(--color-text-main);
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface);
      transition: background-color 0.2s ease;
    }

    .header-btn:hover {
      background-color: var(--color-surface-elevated);
    }

    .bank-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bank-brand-logo {
      width: 26px;
      height: 26px;
      background: linear-gradient(135deg, #00bd78, #006842);
      border-radius: 6px;
      display: grid;
      place-items: center;
    }

    .bank-brand-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-text-main);
    }

    /* Main Content */
    .screen-content {
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Shield / Security Badge */
    .security-badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--color-badge-bg);
      border: 1px solid var(--color-badge-border);
      color: var(--color-primary);
      padding-block: 6px;
      padding-inline: 12px;
      border-radius: 24px;
      font-size: var(--type-label-size);
      font-weight: 600;
      margin-block-end: 20px;
    }

    /* Titles */
    .title {
      font-size: var(--type-title-size);
      font-weight: 700;
      color: var(--color-text-main);
      margin-block-end: 10px;
      line-height: 1.4;
      text-align: start;
    }

    .description {
      font-size: var(--type-body-size);
      color: var(--color-text-muted);
      margin-block-end: 32px;
      text-align: start;
      line-height: 1.7;
    }

    /* Phone Number and Code runs MUST be isolated */
    .phone-number {
      color: var(--color-text-main);
      font-weight: 600;
      font-family: var(--font-latin);
      padding-inline: 2px;
    }

    /* OTP Boxes Container: Fixed-format code runs LTR */
    .otp-wrapper {
      margin-block-end: 28px;
    }

    .otp-inputs {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      direction: ltr; /* Keeps OTP digit sequence in strict reading order */
    }

    .otp-box {
      width: 48px;
      height: 56px;
      background-color: var(--color-surface);
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      color: var(--color-text-main);
      font-family: var(--font-latin);
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
      outline: none;
      transition: all 0.2s ease;
      caret-color: var(--color-primary);
    }

    .otp-box:focus {
      border-color: var(--color-border-focus);
      background-color: var(--color-surface-elevated);
      box-shadow: 0 0 0 3px rgba(0, 168, 107, 0.2);
    }

    .otp-box.filled {
      border-color: #355067;
    }

    /* Countdown & Resend Section */
    .resend-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: var(--type-label-size);
      color: var(--color-text-muted);
      margin-block-end: 28px;
      min-height: 28px;
    }

    .countdown-timer {
      font-family: var(--font-latin);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .resend-button {
      background: none;
      border: none;
      color: var(--color-primary);
      font-family: var(--font-arabic);
      font-size: var(--type-label-size);
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      display: none;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .resend-button:hover {
      color: var(--color-primary-hover);
    }

    /* Advisory Notice Card */
    .security-notice {
      background-color: rgba(20, 32, 43, 0.6);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-block-end: auto;
    }

    .security-notice-icon {
      flex-shrink: 0;
      color: #9cb1c4;
      margin-block-start: 2px;
    }

    .security-notice-text {
      font-size: var(--type-caption-size);
      color: var(--color-text-muted);
      line-height: 1.6;
    }

    /* Actions Footer */
    .screen-footer {
      padding-block-start: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-verify {
      width: 100%;
      height: 52px;
      background-color: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-family: var(--font-arabic);
      font-size: var(--type-body-size);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 168, 107, 0.3);
    }

    .btn-verify:hover:not(:disabled) {
      background-color: var(--color-primary-hover);
      box-shadow: 0 6px 18px rgba(0, 168, 107, 0.4);
    }

    .btn-verify:active:not(:disabled) {
      background-color: var(--color-primary-active);
      transform: translateY(1px);
    }

    .btn-verify:disabled {
      background-color: var(--color-surface-elevated);
      color: var(--color-text-disabled);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Home indicator */
    .home-indicator {
      width: 130px;
      height: 5px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin-inline: auto;
      margin-block: 16px 8px;
    }

    /* Subtle animation on wrong code / shake if needed */
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <main class="phone-container" role="main" aria-label="شاشة التحقق من الهوية المصرفية">
    
    <!-- Phone Status Header -->
    <header class="status-bar" aria-hidden="true">
      <span class="time">9:41</span>
      <div class="notch"></div>
      <div class="status-icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M1 9h2v3H1V9zm4-3h2v6H5V6zm4-3h2v9H9V3zm4-3h2v12h-2V0z"/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
          <path d="M7.5 2C9.8 2 11.9 2.9 13.5 4.4L14.9 3C13 1.1 10.4 0 7.5 0S2 1.1.1 3l1.4 1.4C3.1 2.9 5.2 2 7.5 2zm0 4c1.3 0 2.5.5 3.5 1.4L12.4 6C11.1 4.8 9.4 4 7.5 4S3.9 4.8 2.6 6l1.4 1.4C5 6.5 6.2 6 7.5 6zm0 4a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 22 11" fill="currentColor">
          <rect x="0.5" y="0.5" width="18" height="10" rx="3" stroke="currentColor" fill="none"/>
          <rect x="2" y="2" width="13" height="7" rx="1.5"/>
          <path d="M20 3.5v4c.8-.5 1-1.3 1-2s-.2-1.5-1-2z"/>
        </svg>
      </div>
    </header>

    <!-- App Top Navigation Bar -->
    <nav class="app-header" aria-label="التنقل العلوي">
      <button type="button" class="header-btn" aria-label="رجوع">
        <!-- Directional chevron mirrored in RTL via .icon-directional -->
        <svg class="icon-directional" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="bank-brand">
        <div class="bank-brand-logo" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="bank-brand-title">مصرف الرياض</span>
      </div>

      <!-- Balance spacer to center the brand -->
      <div style="width: 40px;" aria-hidden="true"></div>
    </nav>

    <!-- Screen Body -->
    <section class="screen-content">
      
      <!-- Security Badge -->
      <div class="security-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
        <span>التحقق الثنائي الآمن</span>
      </div>

      <!-- Title & Isolated Phone String -->
      <h1 class="title">أدخل رمز التحقق</h1>
      <p class="description">
        أرسلنا رمزًا مكوّنًا من 6 أرقام إلى رقم الجوال
        <bdi dir="ltr" class="phone-number">+966 55 123 4567</bdi>
      </p>

      <!-- 6-digit OTP Inputs (dir="ltr" on boxes ensures standard left-to-right digit sequence) -->
      <div class="otp-wrapper">
        <fieldset style="border:none; padding:0; margin:0;">
          <legend class="sr-only" style="position:absolute; width:1px; height:1px; overflow:hidden;">رمز التحقق المكوّن من ستة أرقام</legend>
          <div class="otp-inputs" id="otpContainer">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" autocomplete="one-time-code" aria-label="الرقم الأول" autofocus>
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الثاني">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الثالث">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الرابع">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الخامس">
            <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم السادس">
          </div>
        </fieldset>
      </div>

      <!-- Countdown / Resend Section with Isolated Time Format -->
      <div class="resend-section">
        <div id="countdownBox">
          <span>إعادة الإرسال بعد</span>
          <bdi dir="ltr" class="countdown-timer" id="countdown">0:45</bdi>
        </div>
        <button type="button" class="resend-button" id="resendBtn">إعادة إرسال الرمز</button>
      </div>

      <!-- Security Guidance Notice -->
      <div class="security-notice">
        <svg class="security-notice-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <p class="security-notice-text">
          لحماية حسابك، لا تشارك هذا الرمز مع أي شخص، بما في ذلك موظفي المصرف.
        </p>
      </div>

      <!-- Footer Action -->
      <footer class="screen-footer">
        <button type="button" class="btn-verify" id="verifyBtn" disabled>
          <span>تأكيد</span>
          <svg class="icon-directional" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </footer>

    </section>

    <!-- Phone Bottom Home Indicator -->
    <div class="home-indicator" aria-hidden="true"></div>

  </main>

  <script>
    // Normalise typed or pasted Arabic-Indic / Eastern digits to Western Latin digits
    function toWesternDigits(str) {
      if (!str) return '';
      return str
        .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632)
        .replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
    }

    const boxes = Array.from(document.querySelectorAll('.otp-box'));
    const verifyBtn = document.getElementById('verifyBtn');
    const countdownEl = document.getElementById('countdown');
    const countdownBox = document.getElementById('countdownBox');
    const resendBtn = document.getElementById('resendBtn');

    function checkCompletion() {
      const isComplete = boxes.every(box => box.value.trim().length === 1);
      verifyBtn.disabled = !isComplete;
    }

    // Input management: auto-advance, backspace navigation, digit filtering
    boxes.forEach((box, index) => {
      box.addEventListener('input', (e) => {
        const normalized = toWesternDigits(box.value).replace(/\D/g, '');
        box.value = normalized ? normalized.slice(-1) : '';

        if (box.value) {
          box.classList.add('filled');
          if (index < boxes.length - 1) {
            boxes[index + 1].focus();
          }
        } else {
          box.classList.remove('filled');
        }
        checkCompletion();
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && index > 0) {
          boxes[index - 1].focus();
          boxes[index - 1].value = '';
          boxes[index - 1].classList.remove('filled');
          checkCompletion();
        }
      });

      // Handle pasting whole OTP (support Western & Arabic-Indic digits)
      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const clipboard = (e.clipboardData || window.clipboardData).getData('text');
        const digits = toWesternDigits(clipboard).replace(/\D/g, '');

        if (!digits) return;

        let cur = index;
        for (let i = 0; i < digits.length && cur < boxes.length; i++) {
          boxes[cur].value = digits[i];
          boxes[cur].classList.add('filled');
          cur++;
        }

        if (cur < boxes.length) {
          boxes[cur].focus();
        } else {
          boxes[boxes.length - 1].focus();
        }
        checkCompletion();
      });
    });

    // 45-Second Countdown Timer Implementation
    let timeLeft = 45;
    let timerInterval = null;

    function startTimer() {
      timeLeft = 45;
      countdownBox.style.display = 'inline-block';
      resendBtn.style.display = 'none';
      updateTimerDisplay();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          countdownBox.style.display = 'none';
          resendBtn.style.display = 'inline-block';
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      countdownEl.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
    }

    resendBtn.addEventListener('click', () => {
      // Clear inputs
      boxes.forEach(b => {
        b.value = '';
        b.classList.remove('filled');
      });
      boxes[0].focus();
      checkCompletion();
      startTimer();
    });

    verifyBtn.addEventListener('click', () => {
      const enteredCode = boxes.map(b => b.value).join('');
      verifyBtn.textContent = 'جاري التحقق...';
      verifyBtn.disabled = true;

      setTimeout(() => {
        alert('تم تأكيد رمز التحقق بنجاح: ' + enteredCode);
        verifyBtn.innerHTML = `<span>تأكيد</span>
          <svg class="icon-directional" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>`;
        verifyBtn.disabled = false;
      }, 800);
    });

    // Start timer on load
    startTimer();
  </script>
</body>
</html>
