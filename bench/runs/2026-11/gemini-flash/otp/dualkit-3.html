<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رمز التحقق | البنك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-arabic: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      --color-primary: #006C35; /* Saudi formal green */
      --color-primary-dark: #005429;
      --color-primary-light: #EBF7F0;
      --color-text-main: #131921;
      --color-text-muted: #5A6472;
      --color-border: #D1D8E0;
      --color-border-focus: #006C35;
      --color-bg-page: #F4F6F8;
      --color-bg-card: #FFFFFF;
      --color-error: #BA1A1A;

      /* Type scale tokens */
      --type-body-size: 16px;
      --type-label-size: 14px;
      --type-caption-size: 14px;
    }

    :lang(ar) {
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-arabic);
      font-size: var(--type-body-size);
      background-color: var(--color-bg-page);
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Tabular figures for codes, timers, and phone numbers */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Mobile device frame */
    .phone-container {
      width: 100%;
      max-width: 400px;
      min-height: 720px;
      background-color: var(--color-bg-card);
      border-radius: 36px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top device status simulation */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-block-start: 14px;
      padding-block-end: 8px;
      padding-inline: 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .status-bar-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* App bar header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 12px;
      padding-inline: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: 1px solid #E2E6EC;
      background: #FFFFFF;
      color: var(--color-text-main);
      cursor: pointer;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .back-btn:hover {
      background-color: #F8F9FA;
    }

    /* Directional back icon mirroring in RTL */
    .icon-back:dir(rtl) {
      transform: scaleX(-1);
    }

    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-block: 6px;
      padding-inline: 12px;
      border-radius: 20px;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      font-size: var(--type-caption-size);
      font-weight: 600;
    }

    /* Screen content */
    .content {
      padding-inline: 24px;
      padding-block-start: 24px;
      padding-block-end: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .shield-icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-block-end: 20px;
    }

    h1.title {
      font-size: 24px;
      font-weight: 700;
      color: var(--color-text-main);
      line-height: 1.4;
      margin-block-end: 10px;
    }

    .subtitle {
      font-size: var(--type-body-size);
      color: var(--color-text-muted);
      line-height: 1.6;
      margin-block-end: 32px;
    }

    .phone-highlight {
      font-weight: 600;
      color: var(--color-text-main);
    }

    /* 6-box OTP code container */
    .otp-wrapper {
      margin-block-end: 28px;
    }

    .otp-label {
      display: block;
      font-size: var(--type-label-size);
      font-weight: 600;
      color: var(--color-text-main);
      margin-block-end: 12px;
    }

    /* OTP inputs stay in LTR so 1st box is left, 6th is right */
    .otp-inputs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      direction: ltr;
    }

    .otp-box {
      width: 100%;
      height: 56px;
      border: 1.5px solid var(--color-border);
      border-radius: 14px;
      background-color: #FFFFFF;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--color-text-main);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s, background-color 0.18s;
      caret-color: var(--color-primary);
    }

    .otp-box:focus {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px rgba(0, 108, 53, 0.15);
      background-color: #FAFCFA;
    }

    .otp-box.filled {
      border-color: #8CA696;
      background-color: #F8FAF8;
    }

    /* Resend countdown section */
    .resend-section {
      text-align: center;
      margin-block-end: 24px;
    }

    .countdown-text {
      font-size: var(--type-body-size);
      color: var(--color-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .timer-highlight {
      color: var(--color-primary);
      font-weight: 600;
    }

    .resend-btn {
      background: none;
      border: none;
      font-family: inherit;
      font-size: var(--type-body-size);
      font-weight: 600;
      color: var(--color-primary);
      cursor: pointer;
      padding-block: 4px;
      padding-inline: 8px;
      border-radius: 8px;
      display: none;
      transition: background-color 0.2s;
    }

    .resend-btn:hover {
      background-color: var(--color-primary-light);
    }

    /* Primary Action */
    .action-container {
      margin-block-start: auto;
      padding-block-start: 16px;
    }

    .btn-verify {
      width: 100%;
      height: 54px;
      background-color: var(--color-primary);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(0, 108, 53, 0.28);
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-verify:hover {
      background-color: var(--color-primary-dark);
    }

    .btn-verify:active {
      transform: scale(0.99);
    }

    .btn-verify:disabled {
      background-color: #CCD3DC;
      color: #7A8494;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Assistance link */
    .help-link-wrapper {
      text-align: center;
      margin-block-start: 16px;
    }

    .help-link {
      font-size: var(--type-caption-size);
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color 0.18s;
    }

    .help-link:hover {
      color: var(--color-primary);
    }

    /* Home indicator */
    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #000000;
      border-radius: 3px;
      margin-inline: auto;
      margin-block-start: 12px;
      margin-block-end: 8px;
      opacity: 0.18;
    }
  </style>
</head>
<body>

  <main class="phone-container">
    <!-- Top System Bar -->
    <header class="status-bar" aria-hidden="true">
      <span class="tabular-nums" dir="ltr">09:41</span>
      <div class="status-bar-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor">
          <path d="M1 9.5h2v-2H1v2zm4 0h2v-4H5v4zm4 0h2v-6H9v6zm4 0h2v-8h-2v8zm4 0h2v-10h-2v10z"/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
          <path d="M7.5 2C4.8 2 2.4 3.2 0.7 5.1L0 4.3C2 2.1 4.6 0.8 7.5 0.8s5.5 1.3 7.5 3.5l-0.7 0.8C12.6 3.2 10.2 2 7.5 2zm0 3.2c-1.9 0-3.6 0.8-4.8 2.2l-0.7-0.8c1.4-1.6 3.4-2.6 5.5-2.6s4.1 1 5.5 2.6l-0.7 0.8C11.1 6 9.4 5.2 7.5 5.2zm0 3.2c-1 0-1.8 0.4-2.4 1.1L4.4 8.7C5.2 7.8 6.3 7.2 7.5 7.2s2.3 0.6 3.1 1.5l-0.7 0.8c-0.6-0.7-1.4-1.1-2.4-1.1z"/>
        </svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="currentColor">
          <rect x="0.5" y="0.5" width="20" height="11" rx="3.5" fill="none" stroke="currentColor"/>
          <rect x="2" y="2" width="15" height="8" rx="2"/>
          <path d="M22 4v4c0.8 0 1.5-0.7 1.5-1.5v-1c0-0.8-0.7-1.5-1.5-1.5z"/>
        </svg>
      </div>
    </header>

    <!-- App Navigation Header -->
    <nav class="app-header" aria-label="شريط التنقل العلوي">
      <button type="button" class="back-btn" aria-label="الرجوع إلى الصفحة السابقة">
        <svg class="icon-back" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <div class="security-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>اتصال آمن ومشفّر</span>
      </div>
    </nav>

    <!-- Main OTP Section -->
    <section class="content">
      <div class="shield-icon-wrapper" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1 class="title">إدخال رمز التحقق</h1>

      <p class="subtitle">
        تم إرسال رمز مكوّن من 6 أرقام إلى الرقم
        <bdi dir="ltr" class="phone-highlight tabular-nums">+966 55 123 4567</bdi>
      </p>

      <form id="otpForm" onsubmit="event.preventDefault(); handleVerify();">
        <div class="otp-wrapper">
          <label class="otp-label" for="otp-0">رمز التحقق لمرة واحدة</label>
          <!-- Digits container strictly isolated in LTR -->
          <div class="otp-inputs" id="otpGroup">
            <input
              type="text"
              id="otp-0"
              class="otp-box tabular-nums"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="1"
              pattern="[0-9]*"
              aria-label="الرقم الأول من رمز التحقق"
              autofocus
            >
            <input
              type="text"
              id="otp-1"
              class="otp-box tabular-nums"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]*"
              aria-label="الرقم الثاني من رمز التحقق"
            >
            <input
              type="text"
              id="otp-2"
              class="otp-box tabular-nums"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]*"
              aria-label="الرقم الثالث من رمز التحقق"
            >
            <input
              type="text"
              id="otp-3"
              class="otp-box tabular-nums"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]*"
              aria-label="الرقم الرابع من رمز التحقق"
            >
            <input
              type="text"
              id="otp-4"
              class="otp-box tabular-nums"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]*"
              aria-label="الرقم الخامس من رمز التحقق"
            >
            <input
              type="text"
              id="otp-5"
              class="otp-box tabular-nums"
              inputmode="numeric"
              maxlength="1"
              pattern="[0-9]*"
              aria-label="الرقم السادس من رمز التحقق"
            >
          </div>
        </div>

        <!-- Resend Countdown -->
        <div class="resend-section">
          <p id="countdownMessage" class="countdown-text">
            <span>إعادة الإرسال خلال</span>
            <bdi id="timerDisplay" dir="ltr" class="timer-highlight tabular-nums">0:45</bdi>
          </p>
          <button type="button" id="resendBtn" class="resend-btn" onclick="restartCountdown()">
            إعادة إرسال الرمز
          </button>
        </div>

        <!-- Action Button -->
        <div class="action-container">
          <button type="submit" id="verifyBtn" class="btn-verify" disabled>
            <span>التحقق</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </button>

          <div class="help-link-wrapper">
            <a href="#" class="help-link">لم تستلم الرمز أو تغيّر رقم هاتفك؟</a>
          </div>
        </div>
      </form>
    </section>

    <!-- Bottom Home Indicator -->
    <div class="home-indicator" aria-hidden="true"></div>
  </main>

  <script>
    // Normalise eastern Arabic & Persian digits to Western digits
    function toWesternDigits(str) {
      return str
        .replace(/[٠۰]/g, '0')
        .replace(/[١۱]/g, '1')
        .replace(/[٢۲]/g, '2')
        .replace(/[٣۳]/g, '3')
        .replace(/[٤۴]/g, '4')
        .replace(/[٥۵]/g, '5')
        .replace(/[٦۶]/g, '6')
        .replace(/[٧۷]/g, '7')
        .replace(/[٨۸]/g, '8')
        .replace(/[٩۹]/g, '9');
    }

    const inputs = Array.from(document.querySelectorAll('.otp-box'));
    const verifyBtn = document.getElementById('verifyBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const countdownMessage = document.getElementById('countdownMessage');
    const resendBtn = document.getElementById('resendBtn');

    function checkCompletion() {
      const allFilled = inputs.every(input => input.value.trim().length === 1);
      verifyBtn.disabled = !allFilled;
    }

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        let val = toWesternDigits(e.target.value).replace(/\D/g, '');
        if (val.length > 0) {
          input.value = val[val.length - 1]; // take the last valid digit
          input.classList.add('filled');
          if (index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        } else {
          input.value = '';
          input.classList.remove('filled');
        }
        checkCompletion();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (!input.value && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
            inputs[index - 1].classList.remove('filled');
            checkCompletion();
          } else {
            input.classList.remove('filled');
          }
        } else if (e.key === 'ArrowLeft' && index > 0) {
          inputs[index - 1].focus();
        } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      // Handle pasting whole 6-digit code
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const clipboardData = (e.clipboardData || window.clipboardData).getData('text');
        const normalised = toWesternDigits(clipboardData).replace(/\D/g, '');
        if (normalised.length > 0) {
          const chars = normalised.slice(0, 6).split('');
          chars.forEach((char, i) => {
            if (inputs[i]) {
              inputs[i].value = char;
              inputs[i].classList.add('filled');
            }
          });
          const focusIndex = Math.min(chars.length, inputs.length - 1);
          inputs[focusIndex].focus();
          checkCompletion();
        }
      });
    });

    // Countdown Timer (0:45)
    let totalSeconds = 45;
    let timerInterval = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function startTimer() {
      clearInterval(timerInterval);
      countdownMessage.style.display = 'inline-flex';
      resendBtn.style.display = 'none';
      timerDisplay.textContent = formatTime(totalSeconds);

      timerInterval = setInterval(() => {
        totalSeconds--;
        if (totalSeconds >= 0) {
          timerDisplay.textContent = formatTime(totalSeconds);
        } else {
          clearInterval(timerInterval);
          countdownMessage.style.display = 'none';
          resendBtn.style.display = 'inline-block';
        }
      }, 1000);
    }

    function restartCountdown() {
      totalSeconds = 45;
      inputs.forEach(input => {
        input.value = '';
        input.classList.remove('filled');
      });
      inputs[0].focus();
      checkCompletion();
      startTimer();
    }

    function handleVerify() {
      const code = inputs.map(inp => inp.value).join('');
      if (code.length === 6) {
        verifyBtn.disabled = true;
        verifyBtn.innerHTML = `<span>جارٍ التحقق...</span>`;
        setTimeout(() => {
          alert('تم التحقق بنجاح من الرمز: ' + code);
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = `<span>التحقق</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>`;
        }, 800);
      }
    }

    startTimer();
  </script>
</body>
</html>
