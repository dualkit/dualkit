<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Summary</title>
<style>
body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; direction: rtl; }
.header { display: flex; align-items: center; padding: 10px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
.back { background: none; border: none; font-size: 24px; margin-left: 10px; cursor: pointer; }
.title { flex: 1; text-align: center; font-size: 20px; }
.content { padding: 20px; }
.amount { font-size: 24px; margin: 15px 0; text-align: center; }
.due { margin: 15px 0; text-align: center; }
.items { margin: 15px 0; text-align: center; }
.field { margin: 20px 0; }
label { display: block; margin-bottom: 5px; }
input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
.button { width: 100%; padding: 15px; background: #007AFF; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<header class="header">
<button class="back">←</button>
<h1 class="title">ملخص الدفع</h1>
</header>
<div class="content">
<div class="amount">1,234.50 AED</div>
<div class="due">التاريخ المستحق: 3 نوفمبر 2026 (3 جمادى الأولى 1448 هـ)</div>
<div class="items">لديك 3 عناصر في هذا الطلب</div>
<div class="field">
<label for="phone">رقم الهاتف</label>
<input type="tel" id="phone" placeholder="050 123 4567">
</div>
<button class="button">ادفع الآن</button>
</div>
</body>
</html>
