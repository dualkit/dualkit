<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدعم</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .chat-container {
    width: 100%;
    max-width: 375px;
    height: 667px;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    border: 1px solid #ccc;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .message {
    margin-bottom: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    max-width: 80%;
    position: relative;
  }
  .customer {
    background-color: #e0f7e0;
    align-self: flex-end;
    margin-left: auto;
  }
  .agent {
    background-color: #e3f2fd;
    align-self: flex-start;
    margin-right: auto;
  }
  .sender {
    font-weight: bold;
    margin-bottom: 4px;
  }
  .time {
    font-size: 0.7em;
    color: #888;
    margin-top: 4px;
  }
  .input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ccc;
  }
  .input-area input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
  }
  .input-area button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    background-color: #007bff;
    color: white;
    border-radius: 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="chat-container">
    <div class="messages">
      <div class="message customer">
        <div class="sender">أنت</div>
        <div>مرحباً، أود معرفة عن خطة 5G</div>
        <div class="time">10:15</div>
      </div>
      <div class="message agent">
        <div class="sender">Sara</div>
        <div>أهلاً بك، نعم خطة 5G تقدم سرعة عالية</div>
        <div class="time">10:16</div>
      </div>
      <div class="message customer">
        <div class="sender">أنت</div>
        <div>هل يمكن نقل اشتراكي إلى eSIM؟</div>
        <div class="time">10:17</div>
      </div>
      <div class="message agent">
        <div class="sender">Sara</div>
        <div>بالطبع، يمكن نقل اشتراكي إلى eSIM بسهولة</div>
        <div class="time">10:18</div>
      </div>
      <div class="message customer">
        <div class="sender">أنت</div>
        <div>طلب TX-48213 لا يظهر في حسابي</div>
        <div class="time">10:19</div>
      </div>
      <div class="message agent">
        <div class="sender">Sara</div>
        <div>سأقوم بتحليل طلب TX-48213 وسأعود لك قريباً</div>
        <div class="time">10:20</div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" placeholder="اكتب رسالتك...">
      <button>أرسل</button>
    </div>
  </div>
</body>
</html>
