<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 375px;
      background: #fff;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      font-size: 20px;
    }
    .field {
      position: relative;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }
    .info {
      display: flex;
      flex-direction: column;
    }
    .line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .label {
      font-weight: bold;
    }
    .value {
      text-align: left;
    }
    .edit {
      position: absolute;
      top: 12px;
      left: 12px;
      background: none;
      border: none;
      color: #007AFF;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>الملف الشخصي</h1>

    <div class="field">
      <div class="info">
        <div class="line">
          <span class="label">الاسم:</span>
          <span class="value">Layla Al Mansouri</span>
        </div>
        <div class="line">
          <span class="label">البريد الإلكتروني:</span>
          <span class="value">layla@example.com</span>
        </div>
      </div>
      <button class="edit">تعديل</button>
    </div>

    <div class="field">
      <div class="line">
        <span class="label">رقم الهاتف:</span>
        <span class="value">+971 50 123 4567</span>
      </div>
      <button class="edit">تعديل</button>
    </div>

    <div class="field">
      <div class="line">
        <span class="label">رقم IBAN:</span>
        <span class="value">AE07 0331 2345 6789 0123 456</span>
      </div>
      <button class="edit">تعديل</button>
    </div>
  </div>
</body>
</html>
