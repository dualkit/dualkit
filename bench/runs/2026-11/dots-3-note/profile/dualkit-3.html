<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي</title>
<style>
  :lang(ar) {
    --type-label-size: 14px;
    --type-caption-size: 14px;
    --type-body-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    font-style: normal;
    line-height: 1.7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #e8eaed;
    color: #1a1a1a;
    font-size: var(--type-body-size);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .phone-frame {
    max-width: 390px;
    margin: 24px auto;
    background: #fff;
    min-height: 900px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    position: relative;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #0d47a1 0%, #1565c0 50%, #1976d2 100%);
    color: #fff;
    padding: 52px 20px 28px;
    position: relative;
  }

  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .header-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .hero {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .avatar-hero {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    border: 3px solid rgba(255,255,255,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }

  .hero-text h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .hero-text p {
    font-size: 15px;
    opacity: 0.88;
  }

  /* ── Content ── */
  .content {
    padding: 0 20px;
    margin-top: -20px;
  }

  /* ── Profile card ── */
  .profile-card {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .avatar-sm {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0d47a1, #1976d2);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .profile-card .info h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .profile-card .info p {
    font-size: 14px;
    color: #757575;
  }

  .edit-card-btn {
    margin-inline-start: auto;
    background: #e3f2fd;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 12px;
    color: #1565c0;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .edit-card-btn:hover { background: #bbdefb; }

  /* ── Sections ── */
  .section { margin-bottom: 24px; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: #8e8e8e;
    margin-bottom: 10px;
    padding-inline-start: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .detail-card {
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  .detail-row {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    gap: 14px;
    border-bottom: 1px solid #f5f5f5;
  }

  .detail-row:last-child { border-bottom: none; }

  .detail-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #e3f2fd;
    color: #1565c0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .detail-body { flex: 1; min-width: 0; }

  .detail-label {
    font-size: 12px;
    color: #9e9e9e;
    margin-bottom: 3px;
  }

  .detail-value {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    word-break: break-all;
  }

  .edit-row-btn {
    background: none;
    border: none;
    color: #1565c0;
    font-size: 18px;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .edit-row-btn:hover { background: #e3f2fd; }

  /* ── Logout ── */
  .logout-wrap {
    padding: 0 20px;
    margin-top: 8px;
  }

  .logout-btn {
    width: 100%;
    background: #fff;
    border: 1px solid #ffebee;
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 600;
    color: #d32f2f;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }

  .logout-btn:hover { background: #fef2f2; }

  /* ── Bottom spacer ── */
  .spacer { height: 88px; }

  /* ── Bottom nav ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid #e8eaed;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 16px;
    max-width: 390px;
    margin: 0 auto;
  }

  .bottom-nav a {
    text-decoration: none;
    color: #9e9e9e;
    font-size: 11px;
    font-weight: 500;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    transition: color 0.2s;
  }

  .bottom-nav a svg {
    width: 22px;
    height: 22px;
    stroke-width: 1.8;
  }

  .bottom-nav a.active {
    color: #1565c0;
  }
</style>
</head>
<body>
  <div class="phone-frame">

    <!-- ═══ Header ═══ -->
    <div class="header">
      <div class="header-bar">
        <button class="icon-btn" aria-label="ال preceding">←</button>
        <span class="header-title">الملف الشخصي</span>
        <button class="icon-btn" aria-label="الإعدادات">⚙</button>
      </div>

      <div class="hero">
        <div class="avatar-hero">ل</div>
        <div class="hero-text">
          <h1>ليلا المنصوري</h1>
          <p>layla@example.com</p>
        </div>
      </div>
    </div>

    <!-- ═══ Content ═══ -->
    <div class="content">

      <!-- Profile card -->
      <div class="profile-card">
        <div class="avatar-sm">ل</div>
        <div class="info">
          <h3>ليلا المنصوري</h3>
          <p>layla@example.com</p>
        </div>
        <button class="edit-card-btn" aria-label="تعديل البياناتPersonal">✎</button>
      </div>

      <!-- Contact details -->
      <div class="section">
        <h2 class="section-title">تفاصيل الاتصال</h2>
        <div class="detail-card">

          <div class="detail-row">
            <div class="detail-icon">📞</div>
            <div class="detail-body">
              <div class="detail-label">رقم الهاتف</div>
              <div class="detail-value"><bdi dir="ltr">+971 50 123 4567</bdi></div>
            </div>
            <button class="edit-row-btn" aria-label="تعديل رقم الهاتف">✎</button>
          </div>

          <div class="detail-row">
            <div class="detail-icon">🏦</div>
            <div class="detail-body">
              <div class="detail-label">الآيبان</div>
              <div class="detail-value"><bdi dir="ltr">AE07 0331 2345 6789 0123 456</bdi></div>
            </div>
            <button class="edit-row-btn" aria-label="تعديل الآيبان">✎</button>
          </div>

          <div class="detail-row">
            <div class="detail-icon">✉️</div>
            <div class="detail-body">
              <div class="detail-label">البريد الإلكتروني</div>
              <div class="detail-value"><bdi dir="ltr">layla@example.com</bdi></div>
            </div>
            <button class="edit-row-btn" aria-label="تعديل البريد الإلكتروني">✎</button>
          </div>

        </div>
      </div>

      <!-- Logout -->
      <div class="logout-wrap">
        <button class="logout-btn">
          <span>🚪</span>
          <span>تسجيل الخروج</span>
        </button>
      </div>

    </div>

    <div class="spacer"></div>
  </div>

  <!-- ═══ Bottom Navigation ═══ -->
  <div class="bottom-nav">
    <a>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>الصفحة الرئيسية</span>
    </a>
    <a>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      <span>التحويلات</span>
    </a>
    <a>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"/>
        <path d="M2 10h20"/>
      </svg>
      <span>البطاقات</span>
    </a>
    <a class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>الملف الشخصي</span>
    </a>
  </div>
</body>
</html>
