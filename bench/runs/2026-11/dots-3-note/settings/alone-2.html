<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f5f5f5;
  margin: 0;
  padding: 0;
  color: #333;
  direction: rtl;
  text-align: right;
}
.container {
  max-width: 375px;
  margin: 0 auto;
  padding: 16px;
}
.group-title {
  font-size: 14px;
  color: #888;
  margin: 16px 0 8px;
  padding: 0 16px;
}
.list {
  list-style: none;
  margin: 0 0 16px;
  padding: 0;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
}
.item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #eee;
}
.item:last-child {
  border-bottom: none;
}
.label {
  font-size: 16px;
  color: #000;
}
.value {
  margin: 0 8px;
  color: #555;
  font-size: 14px;
}
.chevron {
  color: #ccc;
  font-size: 18px;
  margin-left: auto;
}
/* Toggle switch */
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
  margin-left: auto;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.slider {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #ccc;
  border-radius: 24px;
  transition: background 0.3s;
}
.slider::before {
  content: "";
  position: absolute;
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background: white;
  border-radius: 50%;
  transition: transform 0.3s;
}
.switch input:checked + .slider {
  background: #007AFF;
}
.switch input:checked + .slider::before {
  transform: translateX(20px);
}
/* Hover for clickable rows */
.item[role="link"]:hover,
.item[role="link"]:focus {
  background: #f9f9f9;
  outline: none;
}
</style>
</head>
<body>
<div class="container">
  <!-- Account Group -->
  <h2 class="group-title">الحساب</h2>
  <ul class="list">
    <li class="item" role="link" tabindex="0">
      <span class="label">الاسم</span>
      <span class="value">أحمد محمد</span>
      <span class="chevron">›</span>
    </li>
    <li class="item" role="link" tabindex="0">
      <span class="label">رقم الهاتف</span>
      <span class="value">+973 3600 1234</span>
      <span class="chevron">›</span>
    </li>
    <li class="item" role="link" tabindex="0">
      <span class="label">اللغة</span>
      <span class="value">العربية</span>
      <span class="chevron">›</span>
    </li>
  </ul>

  <!-- Security Group -->
  <h2 class="group-title">الأمان</h2>
  <ul class="list">
    <li class="item">
      <span class="label">Face ID</span>
      <label class="switch">
        <input type="checkbox">
        <span class="slider"></span>
      </label>
    </li>
    <li class="item">
      <span class="label"> تسجيل الدخول خطوة مزدوجة</span>
      <label class="switch">
        <input type="checkbox">
        <span class="slider"></span>
      </label>
    </li>
  </ul>

  <!-- Notifications Group -->
  <h2 class="group-title">الإشعارات</h2>
  <ul class="list">
    <li class="item">
      <span class="label">الحوالت</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </li>
    <li class="item">
      <span class="label">العرض</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </li>
    <li class="item">
      <span class="label">كشوف الحسابات</span>
      <label class="switch">
        <input type="checkbox" checked>
        <span class="slider"></span>
      </label>
    </li>
  </ul>
</div>
</body>
</html>
