<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter the code</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      direction: rtl;
      text-align: right;
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
    }
    .title {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 16px;
      color: #555;
      margin-bottom: 30px;
    }
    .code-inputs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .code-inputs input {
      width: 40px;
      height: 50px;
      font-size: 24px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .countdown {
      margin-bottom: 20px;
      font-size: 16px;
      color: #666;
    }
    button {
      padding: 12px 30px;
      font-size: 18px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #a0c7ff;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="title">أدخل الرمز</div>
  <div class="subtitle">أرسلنا رمزًا مكونًا من 6 أرقام إلى +966 55 123 4567</div>
  <div class="code-inputs">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
    <input type="text" maxlength="1">
  </div>
  <div class="countdown">إعادة الإرسال بعد 0:45</div>
  <button>التحقق</button>
</body>
</html>
