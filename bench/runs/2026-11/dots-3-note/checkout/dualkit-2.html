<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2a7f62;
      --text: #333;
      --border: #eee;
      --bg: #f8f8f8;
      --placeholder: #e0e0e0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'Noto Sans', sans-serif;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
      font-size: 16px;
    }

    :lang(ar) {
      font-family: 'Noto Sans Arabic', 'Noto Sans', sans-serif;
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }

    .phone-container {
      max-width: 375px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
      padding: 0 1rem;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      padding-block: 1rem;
      border-bottom: 1px solid var(--border);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 0.5rem;
      margin-inline-end: 1rem;
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
    }

    .icon-directional {
      transform: none;
    }

    [dir="rtl"] .icon-directional {
      transform: scaleX(-1);
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin: 0;
    }

    /* Items */
    main {
      flex: 1;
      overflow-y: auto;
      padding-block: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: #fff;
    }

    .photo-placeholder {
      width: 80px;
      height: 80px;
      background: var(--placeholder);
      border-radius: 0.5rem;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .item-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .quantity-stepper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stepper-btn {
      width: 32px;
      height: 32px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .stepper-btn:active {
      background: #f0f0f0;
    }

    .quantity {
      min-width: 24px;
      text-align: center;
      font-weight: 600;
    }

    .item-price {
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    /* Promo code */
    .promo {
      display: flex;
      gap: 0.5rem;
      padding-block: 1rem;
      border-top: 1px solid var(--border);
    }

    .promo input {
      flex: 1;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
      direction: ltr;
    }

    .promo button {
      padding: 0.75rem 1.5rem;
      background: #f0f0f0;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }

    /* Summary */
    .summary {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-block: 1rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
    }

    .summary-row.total {
      font-weight: 700;
      font-size: 1.2rem;
      border-top: 1px solid var(--border);
      padding-block: 0.5rem;
      color: var(--primary);
    }

    /* Place order */
    .place-order {
      width: 100%;
      padding: 1rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-block: 1rem 0;
    }

    .place-order:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <header>
      <button class="back-btn">
        <svg class="icon-directional" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 19L8 12L15 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>إتمام الطلب</h1>
    </header>

    <main>
      <!-- Item 1 -->
      <div class="item" data-price="5">
        <div class="photo-placeholder"></div>
        <div class="item-details">
          <div class="item-name">تفاحة طازجة</div>
          <div class="quantity-stepper">
            <button class="stepper-btn minus">-</button>
            <span class="quantity"><bdi dir="ltr">2</bdi></span>
            <button class="stepper-btn plus">+</button>
          </div>
          <div class="item-price"><bdi>10.00 د.إ</bdi></div>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="item" data-price="12">
        <div class="photo-placeholder"></div>
        <div class="item-details">
          <div class="item-name">حليب طازج</div>
          <div class="quantity-stepper">
            <button class="stepper-btn minus">-</button>
            <span class="quantity"><bdi dir="ltr">1</bdi></span>
            <button class="stepper-btn plus">+</button>
          </div>
          <div class="item-price"><bdi>12.00 د.إ</bdi></div>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="item" data-price="4">
        <div class="photo-placeholder"></div>
        <div class="item-details">
          <div class="item-name">خبز أرز</div>
          <div class="quantity-stepper">
            <button class="stepper-btn minus">-</button>
            <span class="quantity"><bdi dir="ltr">3</bdi></span>
            <button class="stepper-btn plus">+</button>
          </div>
          <div class="item-price"><bdi>12.00 د.إ</bdi></div>
        </div>
      </div>
    </main>

    <!-- Promo code -->
    <section class="promo">
      <input type="text" placeholder="أدخل رمز الخصم" dir="ltr">
      <button>تطبيق</button>
    </section>

    <!-- Summary -->
    <section class="summary">
      <div class="summary-row subtotal">
        <span>المجموع الفرعي</span>
        <span><bdi>34.00 د.إ</bdi></span>
      </div>
      <div class="summary-row delivery">
        <span>معدل التوصيل</span>
        <span><bdi>10.00 د.إ</bdi></span>
      </div>
      <div class="summary-row vat">
        <span>ضريبة القيمة المضافة (5%)</span>
        <span><bdi>2.20 د.إ</bdi></span>
      </div>
      <div class="summary-row total">
        <span>الإجمالي</span>
        <span><bdi>46.20 د.إ</bdi></span>
      </div>
    </section>

    <!-- Place order button -->
    <button class="place-order">إتمام الطلب</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const items = document.querySelectorAll('.item');
      const deliveryFee = 10;
      const vatRate = 0.05;

      function formatAED(amount) {
        const formatted = amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return `<bdi>${formatted} د.إ</bdi>`;
      }

      function updateItemPrice(item) {
        const price = parseFloat(item.dataset.price);
        const qty = parseInt(item.querySelector('.quantity bdi').textContent, 10);
        const total = price * qty;
        item.querySelector('.item-price').innerHTML = formatAED(total);
      }

      function updateSummary() {
        let subtotal = 0;
        items.forEach(item => {
          const price = parseFloat(item.dataset.price);
          const qty = parseInt(item.querySelector('.quantity bdi').textContent, 10);
          subtotal += price * qty;
        });

        const vat = (subtotal + deliveryFee) * vatRate;
        const total = subtotal + deliveryFee + vat;

        document.querySelector('.summary-row.subtotal span:last-child').innerHTML = formatAED(subtotal);
        document.querySelector('.summary-row.delivery span:last-child').innerHTML = formatAED(deliveryFee);
        document.querySelector('.summary-row.vat span:last-child').innerHTML = formatAED(vat);
        document.querySelector('.summary-row.total span:last-child').innerHTML = formatAED(total);
      }

      items.forEach(item => {
        const minusBtn = item.querySelector('.stepper-btn.minus');
        const plusBtn = item.querySelector('.stepper-btn.plus');
        const qtyBdi = item.querySelector('.quantity bdi');

        minusBtn.addEventListener('click', function() {
          let qty = parseInt(qtyBdi.textContent, 10);
          if (qty > 1) {
            qty--;
            qtyBdi.textContent = qty;
            updateItemPrice(item);
            updateSummary();
          }
        });

        plusBtn.addEventListener('click', function() {
          let qty = parseInt(qtyBdi.textContent, 10);
          qty++;
          qtyBdi.textContent = qty;
          updateItemPrice(item);
          updateSummary();
        });
      });

      // Initial calculation
      items.forEach(updateItemPrice);
      updateSummary();
    });
  </script>
</body>
</html>
