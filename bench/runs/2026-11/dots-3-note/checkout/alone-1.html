<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدفة</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .phone {
    width: 100%;
    max-width: 375px;
    background-color: #fff;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 16px;
    box-sizing: border-box;
    direction: rtl;
  }
  header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  .back-arrow {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    margin-left: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: bold;
  }
  .cart-items {
    list-style: none;
    padding: 0;
    margin: 0 0 16px 0;
  }
  .item {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    padding: 8px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    background-color: #fafafa;
  }
  .photo-placeholder {
    width: 60px;
    height: 60px;
    background-color: #ddd;
    border-radius: 8px;
    margin-left: 12px;
  }
  .details {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .name {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .stepper button {
    width: 28px;
    height: 28px;
    border: none;
    background-color: #007AFF;
    color: white;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
  }
  .stepper input {
    width: 40px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 4px;
  }
  .price {
    font-size: 14px;
    color: #555;
  }
  .promo-field {
    margin-bottom: 16px;
  }
  .promo-field input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
  }
  .summary {
    margin-bottom: 16px;
  }
  .summary .row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 16px;
  }
  .summary .total {
    font-weight: bold;
    font-size: 18px;
    border-top: 1px solid #ccc;
    padding-top: 8px;
    margin-top: 8px;
  }
  .place-order {
    width: 100%;
    padding: 12px;
    background-color: #007AFF;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="back-arrow">←</button>
    <h1>الدفة</h1>
  </header>
  <ul class="cart-items">
    <li class="item" data-price="10">
      <div class="photo-placeholder"></div>
      <div class="details">
        <span class="name">تفاحة</span>
        <div class="stepper">
          <button class="dec">-</button>
          <input type="number" value="1" min="0">
          <button class="inc">+</button>
        </div>
        <span class="price">10 AED</span>
      </div>
    </li>
    <li class="item" data-price="15">
      <div class="photo-placeholder"></div>
      <div class="details">
        <span class="name">حليب</span>
        <div class="stepper">
          <button class="dec">-</button>
          <input type="number" value="2" min="0">
          <button class="inc">+</button>
        </div>
        <span class="price">15 AED</span>
      </div>
    </li>
    <li class="item" data-price="8">
      <div class="photo-placeholder"></div>
      <div class="details">
        <span class="name">برتقال</span>
        <div class="stepper">
          <button class="dec">-</button>
          <input type="number" value="3" min="0">
          <button class="inc">+</button>
        </div>
        <span class="price">8 AED</span>
      </div>
    </li>
  </ul>
  <div class="promo-field">
    <input type="text" placeholder="كود الخصم">
  </div>
  <div class="summary">
    <div class="row">
      <span>المجموع الفرعي</span>
      <span id="subtotal">0 AED</span>
    </div>
    <div class="row">
      <span>توصيل</span>
      <span id="delivery">10 AED</span>
    </div>
    <div class="row">
      <span>ضريبة 5%</span>
      <span id="vat">0 AED</span>
    </div>
    <div class="row total">
      <span>الإجمالي</span>
      <span id="total">0 AED</span>
    </div>
  </div>
  <button class="place-order">إتمام الطلب</button>
</div>
<script>
  const items = document.querySelectorAll('.item');
  const subtotalEl = document.getElementById('subtotal');
  const deliveryEl = document.getElementById('delivery');
  const vatEl = document.getElementById('vat');
  const totalEl = document.getElementById('total');
  const deliveryFee = 10; // AED

  function updateSummary() {
    let subtotal = 0;
    items.forEach(item => {
      const price = parseFloat(item.dataset.price);
      const qty = parseInt(item.querySelector('input').value, 10) || 0;
      subtotal += price * qty;
    });
    const vat = subtotal * 0.05;
    const total = subtotal + deliveryFee + vat;
    subtotalEl.textContent = subtotal.toFixed(2) + ' AED';
    vatEl.textContent = vat.toFixed(2) + ' AED';
    totalEl.textContent = total.toFixed(2) + ' AED';
  }

  items.forEach(item => {
    const incBtn = item.querySelector('.inc');
    const decBtn = item.querySelector('.dec');
    const input = item.querySelector('input');
    incBtn.addEventListener('click', () => {
      input.value = parseInt(input.value, 10) + 1;
      updateSummary();
    });
    decBtn.addEventListener('click', () => {
      let val = parseInt(input.value, 10) - 1;
      if (val < 0) val = 0;
      input.value = val;
      updateSummary();
    });
    input.addEventListener('change', updateSummary);
  });

  // initial calculation
  updateSummary();
</script>
</body>
</html>
