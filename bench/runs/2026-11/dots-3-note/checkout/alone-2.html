<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الشراء</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background-color: #f5f5f5;
    direction: rtl;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    padding: 16px;
    min-height: 100vh;
  }
  .header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  .back-arrow {
    font-size: 24px;
    cursor: pointer;
    margin-left: 8px;
  }
  .title {
    font-size: 20px;
    font-weight: bold;
  }
  .item {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .photo {
    width: 60px;
    height: 60px;
    background-color: #ddd;
    border-radius: 8px;
    margin-left: 12px;
  }
  .item-details {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .item-name {
    font-size: 16px;
    margin-bottom: 8px;
  }
  .quantity {
    display: flex;
    align-items: center;
  }
  .qty-btn {
    width: 30px;
    height: 30px;
    background: #f0f0f0;
    border: none;
    font-size: 18px;
    cursor: pointer;
  }
  .qty-input {
    width: 40px;
    text-align: center;
    margin: 0 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .price {
    font-size: 16px;
    font-weight: bold;
    margin-left: auto;
  }
  .promo {
    margin: 16px 0;
  }
  .promo input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .summary {
    margin-top: 16px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 16px;
  }
  .total {
    font-weight: bold;
    font-size: 18px;
    margin-top: 8px;
  }
  .place-order {
    width: 100%;
    padding: 14px;
    background: #007AFF;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    margin-top: 24px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="back-arrow" onclick="history.back()">←</span>
    <div class="title">إتمام الشراء</div>
  </div>

  <!-- Items -->
  <div class="item">
    <div class="photo"></div>
    <div class="item-details">
      <div class="item-name">تفاح</div>
      <div class="quantity">
        <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
        <input type="number" class="qty-input" value="1" min="1">
        <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
      </div>
    </div>
    <div class="price">10 AED</div>
  </div>

  <div class="item">
    <div class="photo"></div>
    <div class="item-details">
      <div class="item-name">حليب</div>
      <div class="quantity">
        <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
        <input type="number" class="qty-input" value="2" min="1">
        <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
      </div>
    </div>
    <div class="price">20 AED</div>
  </div>

  <div class="item">
    <div class="photo"></div>
    <div class="item-details">
      <div class="item-name">برتقال</div>
      <div class="quantity">
        <button class="qty-btn" onclick="changeQty(this, -1)">-</button>
        <input type="number" class="qty-input" value="3" min="1">
        <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
      </div>
    </div>
    <div class="price">15 AED</div>
  </div>

  <!-- Promo code -->
  <div class="promo">
    <input type="text" placeholder="كود الخصم">
  </div>

  <!-- Summary -->
  <div class="summary">
    <div class="summary-row">
      <span>المجموع الفرعي</span>
      <span>45 AED</span>
    </div>
    <div class="summary-row">
      <span>توصيل</span>
      <span>5 AED</span>
    </div>
    <div class="summary-row">
      <span>ضريبة القيمة المضافة (5%)</span>
      <span>2.25 AED</span>
    </div>
    <div class="summary-row total">
      <span>الإجمالي</span>
      <span>52.25 AED</span>
    </div>
  </div>

  <button class="place-order">إتمام الطلب</button>
</div>

<script>
  function changeQty(btn, delta) {
    const qtyDiv = btn.parentElement;
    const input = qtyDiv.querySelector('.qty-input');
    let val = parseInt(input.value) + delta;
    if (val < 1) val = 1;
    input.value = val;
  }
</script>
</body>
</html>
