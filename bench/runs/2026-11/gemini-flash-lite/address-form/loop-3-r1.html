<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عنوان التوصيل - بقالة دبي</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            arabic: ['"IBM Plex Sans Arabic"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    /* Dualkit Arabic Type Pairing & Size Floor Rules */
    :lang(ar) {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      letter-spacing: 0 !important;
      text-transform: none;
      line-height: 1.7;
    }
    
    /* Enforce 14px floor for UI text */
    body, input, select, button, label {
      font-size: 16px;
    }
    .text-ui-floor {
      font-size: 14px;
    }

    /* Right-align Arabic placeholder hints in text inputs */
    input::placeholder {
      text-align: right;
    }
  </style>
</head>
<body class="bg-gray-100 font-arabic text-gray-900 antialiased flex justify-center items-center min-h-screen p-0 sm:py-6">

  <!-- Mobile Phone Container -->
  <div class="w-full sm:max-w-md bg-white min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-gray-200">

    <!-- App Header -->
    <header class="px-6 py-4 bg-white border-b border-gray-100 flex items-center justify-between sticky top-0 z-10">
      <button class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-700 hover:bg-gray-100 transition" aria-label="رجوع">
        <svg class="w-5 h-5 rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="text-lg font-bold text-gray-900">إضافة عنوان توصيل</h1>
      <div class="w-10"></div> <!-- Spacer for balance -->
    </header>

    <!-- Main Form Content -->
    <main class="flex-1 p-6 space-y-5 overflow-y-auto pb-10">
      <form class="space-y-4" onsubmit="event.preventDefault();">

        <!-- Emirate Picker -->
        <div class="space-y-1.5">
          <label for="emirate" class="block text-ui-floor font-medium text-gray-700">الإمارة</label>
          <div class="relative">
            <select id="emirate" name="emirate" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
              <option value="Dubai" selected>دبي</option>
              <option value="Abu Dhabi">أبوظبي</option>
              <option value="Sharjah">الشارقة</option>
              <option value="Ajman">عجمان</option>
              <option value="Ras Al Khaimah">رأس الخيمة</option>
              <option value="Umm Al Quwain">أم القيوين</option>
              <option value="Fujairah">الفجيرة</option>
            </select>
            <div class="absolute inset-y-0 start-0 flex items-center px-4 pointer-events-none text-gray-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- Area -->
        <div class="space-y-1.5">
          <label for="area" class="block text-ui-floor font-medium text-gray-700">المنطقة</label>
          <input type="text" id="area" name="area" dir="auto" placeholder="مثلاً: دبي مارينا، البرشاء 1" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" required>
        </div>

        <!-- Street -->
        <div class="space-y-1.5">
          <label for="street" class="block text-ui-floor font-medium text-gray-700">الشارع</label>
          <input type="text" id="street" name="street" dir="auto" placeholder="مثلاً: شارع الملك سلمان بن عبد العزيز" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" required>
        </div>

        <!-- Building or Villa -->
        <div class="space-y-1.5">
          <label for="building" class="block text-ui-floor font-medium text-gray-700">المبنى أو الفيلا</label>
          <input type="text" id="building" name="building" dir="auto" placeholder="مثلاً: برج الماس، شقة رقم 402" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition" required>
        </div>

        <!-- Makani Number -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <label for="makani" class="block text-ui-floor font-medium text-gray-700">رقم مكاني (اختياري)</label>
            <span class="text-sm text-gray-400">10 أرقام</span>
          </div>
          <input type="text" id="makani" name="makani" dir="ltr" inputmode="numeric" maxlength="10" placeholder="30492 92811" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition text-left tracking-wider">
          <p class="text-sm text-gray-500">رقم مكاني يسرع عملية الوصول لموقعك بدقة عالية في دبي.</p>
        </div>

        <!-- Phone Number -->
        <div class="space-y-1.5">
          <label for="phone" class="block text-ui-floor font-medium text-gray-700">رقم الهاتف للتواصل</label>
          <div class="flex items-center bg-gray-50 border border-gray-200 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 focus-within:bg-white transition" dir="ltr">
            <div class="flex items-center px-3 py-3 bg-gray-100 border-e border-gray-200 text-gray-600 text-sm font-medium gap-1 select-none">
              <span>🇦🇪</span>
              <span>+971</span>
            </div>
            <input type="tel" id="phone" name="phone" inputmode="tel" placeholder="050 123 4567" class="w-full px-4 py-3 bg-transparent focus:outline-none text-left" required>
          </div>
          <p class="text-sm text-gray-500">مثال: <bdi dir="ltr">050 123 4567</bdi></p>
        </div>

      </form>
    </main>

    <!-- Footer Action -->
    <footer class="p-4 bg-white border-t border-gray-100 mt-auto">
      <button type="submit" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 transition duration-200 active:scale-[0.98]">
        حفظ العنوان
      </button>
    </footer>

  </div>

</body>
</html>
