<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة عنوان التوصيل - بقالة دبي</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    :lang(ar) {
      letter-spacing: 0 !important;
      line-height: 1.7;
    }
    /* Enforce 14px floor for UI elements */
    .ui-text-floor {
      font-size: 0.875rem; /* 14px */
    }
    /* Right-align Arabic placeholder while placeholder is shown */
    input:placeholder-shown {
      direction: rtl;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] sm:rounded-3xl sm:shadow-2xl flex flex-col overflow-hidden border-0 sm:border border-gray-200">
    
    <!-- Top Bar -->
    <header class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-white sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button class="w-9 h-9 rounded-full bg-gray-50 flex items-center justify-center text-gray-700 hover:bg-gray-100 transition-colors" aria-label="الرجوع">
          <svg class="w-5 h-5 rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <h1 class="font-semibold text-lg text-gray-900">إضافة عنوان التوصيل</h1>
      </div>
      <span class="ui-text-floor bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-medium">دبي، الإمارات</span>
    </header>

    <!-- Form Body -->
    <form class="flex-1 p-5 space-y-4 overflow-y-auto pb-8" onsubmit="event.preventDefault();">

      <!-- Emirate Picker -->
      <div class="space-y-1.5">
        <label for="emirate" class="block ui-text-floor font-medium text-gray-700">الإمارة</label>
        <div class="relative">
          <select id="emirate" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 appearance-none focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
            <option value="Dubai" selected>دبي</option>
            <option value="Abu Dhabi">أبوظبي</option>
            <option value="Sharjah">الشارقة</option>
            <option value="Ajman">عجمان</option>
            <option value="Umm Al Quwain">أم القيوين</option>
            <option value="Ras Al Khaimah">رأس الخيمة</option>
            <option value="Fujairah">الفجيرة</option>
          </select>
          <div class="absolute inset-y-0 start-auto end-4 flex items-center pointer-events-none text-gray-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Area / Neighborhood -->
      <div class="space-y-1.5">
        <label for="area" class="block ui-text-floor font-medium text-gray-700">المنطقة / الحي</label>
        <input 
          type="text" 
          id="area" 
          dir="auto"
          placeholder="مثال: مرسى دبي، البرشاء، الخليج التجاري" 
          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
          required
        >
      </div>

      <!-- Street -->
      <div class="space-y-1.5">
        <label for="street" class="block ui-text-floor font-medium text-gray-700">الشارع</label>
        <input 
          type="text" 
          id="street" 
          dir="auto"
          placeholder="مثال: شارع الشيخ زايد، شارع الأصايل" 
          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
          required
        >
      </div>

      <!-- Building or Villa -->
      <div class="space-y-1.5">
        <label for="building" class="block ui-text-floor font-medium text-gray-700">المبنى أو الفيلا</label>
        <input 
          type="text" 
          id="building" 
          dir="auto"
          placeholder="مثال: برج الروضة، شقة رقم 402" 
          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
          required
        >
      </div>

      <!-- Makani Number -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center">
          <label for="makani" class="block ui-text-floor font-medium text-gray-700">رقم مكاني (اختياري)</label>
          <span class="ui-text-floor text-gray-400">10 أرقام</span>
        </div>
        <input 
          type="text" 
          id="makani" 
          dir="ltr"
          inputmode="numeric"
          maxlength="10"
          placeholder="30492 84920" 
          class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-start"
        >
        <p class="ui-text-floor text-gray-500 mt-1">يساعدنا رقم مكاني في الوصول إلى موقعك بدقة فائقة في دبي.</p>
      </div>

      <!-- Phone Number -->
      <div class="space-y-1.5">
        <label for="phone" class="block ui-text-floor font-medium text-gray-700">رقم الهاتف للتواصل</label>
        <div class="flex items-center bg-gray-50 border border-gray-200 rounded-xl overflow-hidden focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-all">
          <div class="bg-gray-100 px-3.5 py-3 text-gray-600 font-medium ui-text-floor border-e border-gray-200 select-none flex items-center gap-1">
            <span>🇦🇪</span>
            <bdi dir="ltr">+971</bdi>
          </div>
          <input 
            type="tel" 
            id="phone" 
            dir="ltr"
            inputmode="tel"
            placeholder="050 123 4567" 
            class="w-full bg-transparent px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none text-start"
            required
          >
        </div>
      </div>

      <!-- Submit Button Wrapper -->
      <div class="pt-4">
        <button 
          type="submit" 
          class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-4 rounded-xl shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-2 cursor-pointer"
        >
          <span>حفظ العنوان</span>
        </button>
      </div>

    </form>
  </div>

</body>
</html>
