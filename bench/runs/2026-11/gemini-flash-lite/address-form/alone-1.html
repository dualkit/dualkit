<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة عنوان التوصيل</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen m-0 p-0 sm:py-6">

    <!-- Mobile Frame Container -->
    <div class="w-full sm:max-w-md bg-white min-h-screen sm:min-h-[800px] sm:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative">
        
        <!-- Header -->
        <header class="bg-white px-5 py-4 border-b border-gray-100 flex items-center justify-between sticky top-0 z-10">
            <button class="text-gray-600 hover:text-black focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <h1 class="text-lg font-bold text-gray-800">عنوان التوصيل الجديد</h1>
            <div class="w-6"></div> <!-- Spacer for alignment -->
        </header>

        <!-- Form Body -->
        <main class="flex-1 px-5 py-6 overflow-y-auto">
            <form id="addressForm" class="space-y-4">
                
                <!-- Location Helper Banner -->
                <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3.5 flex items-center gap-3 text-emerald-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-600 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <div class="text-xs">
                        <span class="font-bold block">التوصيل السريع في دبي</span>
                        أدخل تفاصيل عنوانك بدقة ليصلك الطلب في أسرع وقت.
                    </div>
                </div>

                <!-- Emirate Picker -->
                <div>
                    <label for="emirate" class="block text-xs font-semibold text-gray-600 mb-1.5">الإمارة</label>
                    <div class="relative">
                        <select id="emirate" name="emirate" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 focus:outline-none focus:border-emerald-600 focus:bg-white appearance-none transition">
                            <option value="Dubai" selected>دبي (Dubai)</option>
                            <option value="Abu Dhabi">أبوظبي (Abu Dhabi)</option>
                            <option value="Sharjah">الشارقة (Sharjah)</option>
                            <option value="Ajman">عجمان (Ajman)</option>
                            <option value="Umm Al Quwain">أم القيوين (Umm Al Quwain)</option>
                            <option value="Ras Al Khaimah">رأس الخيمة (Ras Al Khaimah)</option>
                            <option value="Fujairah">الفجيرة (Fujairah)</option>
                        </select>
                        <div class="absolute inset-y-0 left-0 flex items-center px-4 pointer-events-none text-gray-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Area -->
                <div>
                    <label for="area" class="block text-xs font-semibold text-gray-600 mb-1.5">المنطقة / الحي</label>
                    <input type="text" id="area" placeholder="مثال: بر دبي، دبي مارينا، داون تاون" required
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition">
                </div>

                <!-- Street -->
                <div>
                    <label for="street" class="block text-xs font-semibold text-gray-600 mb-1.5">الشارع</label>
                    <input type="text" id="street" placeholder="مثال: شارع الشيخ زايد، شارع المركز المالي" required
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition">
                </div>

                <!-- Building or Villa -->
                <div>
                    <label for="building" class="block text-xs font-semibold text-gray-600 mb-1.5">رقم المبنى أو الفيلا / اسم الشقق</label>
                    <input type="text" id="building" placeholder="مثال: برج الروضة، شقة رقم 402، أو فيﻼ 12" required
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition">
                </div>

                <!-- Makani Number -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="makani" class="block text-xs font-semibold text-gray-600">رقم المكاني (اختياري)</label>
                        <span class="text-[10px] text-gray-400">10 أرقام</span>
                    </div>
                    <input type="text" id="makani" maxlength="10" placeholder="مثال: 30004 95821"
                        class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition tracking-widest">
                </div>

                <!-- Phone Number -->
                <div>
                    <label for="phone" class="block text-xs font-semibold text-gray-600 mb-1.5">رقم الهاتف للتواصل</label>
                    <div class="relative flex items-center">
                        <span class="absolute right-4 text-gray-500 font-medium text-sm">+971</span>
                        <input type="tel" id="phone" placeholder="050 123 4567" required
                            class="w-full bg-gray-50 border border-gray-200 rounded-xl pr-16 pl-4 py-3 text-gray-800 placeholder-gray-400 focus:outline-none focus:border-emerald-600 focus:bg-white transition text-left dir-ltr">
                    </div>
                    <p class="text-[11px] text-gray-400 mt-1">سيتصل بك السائق على هذا الرقم عند الوصول.</p>
                </div>

            </form>
        </main>

        <!-- Footer Button -->
        <footer class="bg-white px-5 py-4 border-t border-gray-100">
            <button type="submit" form="addressForm"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition active:scale-[0.98]">
                حفظ العنوان
            </button>
        </footer>

    </div>

</body>
</html>
