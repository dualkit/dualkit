<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادات قطر الطبية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <!-- Phone Container -->
    <div class="w-full max-w-sm bg-white h-[844px] shadow-2xl flex flex-col justify-between overflow-hidden relative rounded-none sm:rounded-3xl border border-gray-200">
        
        <!-- Header -->
        <div class="bg-teal-700 text-white px-6 pt-6 pb-4 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <button class="text-white focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
                <h1 class="text-lg font-bold">حجز موعد جديد</h1>
            </div>
            <div class="text-xs bg-teal-800 px-2.5 py-1 rounded-full font-medium">الدوحة، قطر</div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-6">

            <!-- Doctor Profile Card -->
            <div class="flex items-center gap-4 p-3 bg-teal-50 rounded-2xl border border-teal-100">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1594824813572-46da30806443?auto=format&fit=crop&q=80&w=150" alt="د. حصة آل ثاني" class="w-16 h-16 rounded-full object-cover border-2 border-teal-600">
                    <span class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 border-2 border-white rounded-full"></span>
                </div>
                <div>
                    <h2 class="font-bold text-gray-800 text-base">د. حصة آل ثاني</h2>
                    <p class="text-xs text-teal-700 font-semibold">استشاري طب الأسرة والعائلة</p>
                    <p class="text-[11px] text-gray-500 mt-0.5">مركز السد الطبي - الدوحة</p>
                </div>
            </div>

            <!-- Calendar Section -->
            <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm">
                <!-- Month Navigation -->
                <div class="flex items-center justify-between mb-4">
                    <button class="p-1.5 hover:bg-gray-100 rounded-full text-gray-600 transition">
                        <!-- Previous Month Arrow (pointing right in RTL) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    <h3 class="font-bold text-gray-800 text-base">أكتوبر ٢٠٢٣</h3>
                    <button class="p-1.5 hover:bg-gray-100 rounded-full text-gray-600 transition">
                        <!-- Next Month Arrow (pointing left in RTL) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                </div>

                <!-- Week Days Header (Starts on Saturday as requested) -->
                <div class="grid grid-cols-7 text-center text-xs font-semibold text-gray-400 mb-2">
                    <span class="text-teal-600">سبت</span>
                    <span>أحد</span>
                    <span>إثنين</span>
                    <span>ثلاثاء</span>
                    <span>أربعاء</span>
                    <span>خميس</span>
                    <span>جمعة</span>
                </div>

                <!-- Calendar Grid (October 2023 starts on Sunday, Sep 30 is Saturday) -->
                <div class="grid grid-cols-7 gap-y-2 text-center text-sm">
                    <!-- Previous Month Overflow -->
                    <span class="text-gray-300 py-1.5">٣٠</span>
                    
                    <!-- Days of October -->
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٣</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٤</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٥</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٦</span>
                    
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٧</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٨</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٩</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٠</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١١</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٢</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٣</span>

                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٤</span>
                    <!-- Today Marked -->
                    <span class="py-1.5 bg-teal-600 text-white font-bold rounded-lg shadow-md cursor-pointer">١٥</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٦</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٧</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٨</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">١٩</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٠</span>

                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢١</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٢</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٣</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٤</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٥</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٦</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٧</span>

                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٨</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٢٩</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٣٠</span>
                    <span class="py-1.5 text-gray-700 hover:bg-gray-100 rounded-lg cursor-pointer">٣١</span>
                    <span class="text-gray-300 py-1.5">١</span>
                    <span class="text-gray-300 py-1.5">٢</span>
                    <span class="text-gray-300 py-1.5">٣</span>
                </div>
            </div>

            <!-- Time Slots Section -->
            <div>
                <h3 class="font-bold text-gray-800 text-sm mb-3">الأوقات المتاحة (صباحاً)</h3>
                <div class="grid grid-cols-3 gap-2.5">
                    <button class="py-2.5 px-3 border border-teal-600 bg-teal-50 text-teal-800 rounded-xl text-xs font-bold text-center transition shadow-sm">
                        ٠٩:٠٠ ص
                    </button>
                    <button class="py-2.5 px-3 border border-gray-200 hover:border-teal-600 text-gray-700 rounded-xl text-xs font-semibold text-center transition">
                        ٠٩:٣٠ ص
                    </button>
                    <button class="py-2.5 px-3 border border-gray-200 hover:border-teal-600 text-gray-700 rounded-xl text-xs font-semibold text-center transition">
                        ١٠:٠٠ ص
                    </button>
                    <button class="py-2.5 px-3 border border-gray-200 hover:border-teal-600 text-gray-700 rounded-xl text-xs font-semibold text-center transition">
                        ١٠:٣٠ ص
                    </button>
                    <button class="py-2.5 px-3 border border-gray-200 hover:border-teal-600 text-gray-700 rounded-xl text-xs font-semibold text-center transition">
                        ١١:٠٠ ص
                    </button>
                    <button class="py-2.5 px-3 border border-gray-200 hover:border-teal-600 text-gray-700 rounded-xl text-xs font-semibold text-center transition">
                        ١١:٣٠ ص
                    </button>
                    <button class="py-2.5 px-3 border border-gray-200 hover:border-teal-600 text-gray-700 rounded-xl text-xs font-semibold text-center transition">
                        ١٢:٠٠ م
                    </button>
                </div>
            </div>

        </div>

        <!-- Footer / Confirm Button -->
        <div class="p-5 bg-white border-t border-gray-100 shadow-inner">
            <button class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                <span>تأكيد الحجز</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>

    </div>

</body>
</html>
