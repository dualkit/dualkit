<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد - عيادات الدوحة</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }
    :lang(ar) {
      letter-spacing: 0;
      line-height: 1.7;
    }
    /* Ensure Arabic font size floor (minimum 14px for UI text) */
    body {
      font-size: 16px;
      background-color: #f1f5f9;
    }
    .ui-text {
      font-size: 14px;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

  <!-- Phone Frame Container -->
  <div class="w-full max-w-sm bg-white min-h-screen sm:min-h-[844px] sm:max-h-[844px] sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
    
    <!-- Status Bar / Top Header -->
    <header class="px-5 pt-4 pb-3 bg-white border-b border-slate-100 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-2">
        <button class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition" aria-label="رجوع">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
        <h1 class="font-bold text-slate-900 text-base">حجز موعد</h1>
      </div>
      <!-- Language Switcher -->
      <button id="langToggle" class="text-sm font-semibold text-teal-700 bg-teal-50 px-2.5 py-1.5 rounded-lg hover:bg-teal-100 transition" lang="en" dir="ltr">
        English
      </button>
    </header>

    <!-- Main Scrollable Content -->
    <main class="flex-1 overflow-y-auto px-5 py-4 space-y-6 pb-28">
      
      <!-- Doctor Card -->
      <section class="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
        <div class="relative">
          <div class="w-16 h-16 rounded-2xl bg-teal-800 text-white font-bold text-xl flex items-center justify-center shadow-inner">
            د.ط
          </div>
          <span class="absolute bottom-0 end-0 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
        <div>
          <div class="text-sm text-teal-700 font-semibold mb-0.5">استشاري أمراض الباطنية</div>
          <h2 class="font-bold text-slate-900 text-base">د. طلال آل ثاني</h2>
          <p class="text-slate-500 ui-text flex items-center gap-1 mt-0.5">
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span>عيادة الوجبة، الدوحة</span>
          </p>
        </div>
      </section>

      <!-- Calendar Section -->
      <section class="bg-white rounded-2xl border border-slate-200/80 p-4 shadow-sm">
        <!-- Month Navigation -->
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-slate-800 text-base" id="monthName">مارس 2025 / March 2025</h3>
          <div class="flex items-center gap-1">
            <button id="prevMonth" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition" aria-label="الشهر السابق">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </button>
            <button id="nextMonth" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-600 hover:bg-slate-50 transition" aria-label="الشهر التالي">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Weekdays Header (Starting Saturday per Qatari/GCC standard, min 14px size floor) -->
        <div class="grid grid-cols-7 text-center text-sm font-semibold text-slate-500 mb-2">
          <span>سبت</span>
          <span>أحد</span>
          <span>إثنين</span>
          <span>ثلاثاء</span>
          <span>أربعاء</span>
          <span>خميس</span>
          <span>جمعة</span>
        </div>

        <!-- Days Grid (March 2025 example starting Saturday) -->
        <div class="grid grid-cols-7 gap-1 text-center text-sm" id="calendarDays">
          <button class="aspect-square rounded-xl flex items-center justify-center text-slate-300 cursor-not-allowed" disabled><bdi>28</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center text-slate-300 cursor-not-allowed" disabled><bdi>29</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center text-slate-300 cursor-not-allowed" disabled><bdi>30</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center text-slate-300 cursor-not-allowed" disabled><bdi>31</bdi></button>
          <!-- March Days -->
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>1</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>2</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>3</bdi></button>
          
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>4</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>5</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>6</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>7</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>8</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>9</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>10</bdi></button>
          
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>11</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>12</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>13</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>14</bdi></button>
          <!-- Today Marked -->
          <button class="aspect-square rounded-xl flex items-center justify-center bg-teal-800 text-white font-bold shadow-md shadow-teal-800/20 ring-2 ring-teal-800/20" aria-current="date"><bdi>15</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>16</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>17</bdi></button>

          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>18</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>19</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>20</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>21</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>22</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>23</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>24</bdi></button>

          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>25</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>26</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>27</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>28</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>29</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>30</bdi></button>
          <button class="aspect-square rounded-xl flex items-center justify-center hover:bg-slate-100 text-slate-700 transition font-medium"><bdi>31</bdi></button>
        </div>
      </section>

      <!-- Time Slots Section (9:00 to 12:00 every 30 minutes) -->
      <section class="space-y-3">
        <h3 class="font-bold text-slate-800 text-sm">اختر وقت الموعد</h3>
        <div class="grid grid-cols-3 gap-2.5" id="timeSlots">
          <button class="py-3 px-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:border-teal-700 hover:text-teal-800 transition text-center time-slot" data-time="09:00">
            <bdi>09:00 ص</bdi>
          </button>
          <button class="py-3 px-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:border-teal-700 hover:text-teal-800 transition text-center time-slot" data-time="09:30">
            <bdi>09:30 ص</bdi>
          </button>
          <button class="py-3 px-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:border-teal-700 hover:text-teal-800 transition text-center time-slot" data-time="10:00">
            <bdi>10:00 ص</bdi>
          </button>
          <button class="py-3 px-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:border-teal-700 hover:text-teal-800 transition text-center time-slot" data-time="10:30">
            <bdi>10:30 ص</bdi>
          </button>
          <!-- Selected Slot Example -->
          <button class="py-3 px-2 rounded-xl border-2 border-teal-800 bg-teal-50/50 text-teal-900 text-sm font-bold transition text-center time-slot shadow-sm" data-time="11:00">
            <bdi>11:00 ص</bdi>
          </button>
          <button class="py-3 px-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:border-teal-700 hover:text-teal-800 transition text-center time-slot" data-time="11:30">
            <bdi>11:30 ص</bdi>
          </button>
          <button class="py-3 px-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-medium hover:border-teal-700 hover:text-teal-800 transition text-center time-slot" data-time="12:00">
            <bdi>12:00 م</bdi>
          </button>
        </div>
      </section>

    </main>

    <!-- Sticky Bottom Action Footer -->
    <footer class="absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-100 p-4 shadow-lg">
      <div class="flex items-center justify-between mb-2 px-1">
        <span class="text-sm text-slate-500">الموعد المختار:</span>
        <span class="text-sm font-bold text-slate-800"><bdi>السبت، 15 مارس - 11:00 ص</bdi></span>
      </div>
      <button class="w-full bg-teal-800 hover:bg-teal-900 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-teal-800/25 transition flex items-center justify-center gap-2">
        <span>تأكيد الموعد</span>
      </button>
    </footer>

  </div>

  <script>
    // Interactivity for time slot selection and language toggle
    const slots = document.querySelectorAll('.time-slot');
    slots.forEach(slot => {
      slot.addEventListener('click', () => {
        slots.forEach(s => {
          s.classList.remove('border-teal-800', 'bg-teal-50/50', 'text-teal-900', 'font-bold', 'shadow-sm');
          s.classList.add('border-slate-200', 'text-slate-700', 'font-medium');
        });
        slot.classList.remove('border-slate-200', 'text-slate-700', 'font-medium');
        slot.classList.add('border-teal-800', 'bg-teal-50/50', 'text-teal-900', 'font-bold', 'shadow-sm');
      });
    });

    const langToggle = document.getElementById('langToggle');
    let isAr = true;
    langToggle.addEventListener('click', () => {
      isAr = !isAr;
      document.documentElement.lang = isAr ? 'ar' : 'en';
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      langToggle.textContent = isAr ? 'English' : 'عربي';
      langToggle.setAttribute('lang', isAr ? 'en' : 'ar');
    });
  </script>
</body>
</html>
