<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمز التحقق - المصرف السعودي</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        saudi: {
                            green: '#006C35',
                            dark: '#0A192F',
                            light: '#F4F7F6'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 font-cairo flex items-center justify-center min-h-screen m-0 p-4">

    <!-- Phone Container -->
    <div class="w-[380px] h-[780px] bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-4 border-gray-800">
        
        <!-- Phone Status Bar -->
        <div class="w-full bg-white px-6 pt-3 pb-2 flex justify-between items-center text-xs text-gray-800 font-semibold select-none">
            <span>9:41</span>
            <div class="w-20 h-4 bg-gray-900 rounded-full absolute left-1/2 -translate-x-1/2 top-2"></div>
            <div class="flex items-center space-x-1 space-x-reverse">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/></svg>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h3.53C9.3 19.61 10.6 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
            </div>
        </div>

        <!-- App Header / Back Button -->
        <div class="px-6 py-4 flex items-center justify-between">
            <button class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
            <div class="text-saudi-green font-bold text-lg tracking-wider">مصرف الإنماء</div>
            <div class="w-10"></div> <!-- Spacer -->
        </div>

        <!-- Main Content -->
        <div class="px-8 pt-6 flex-1 flex flex-col justify-between pb-8">
            
            <div>
                <!-- Icon/Illustration -->
                <div class="w-16 h-16 bg-saudi-green/10 rounded-2xl flex items-center justify-center text-saudi-green mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>

                <!-- Titles -->
                <h1 class="text-2xl font-bold text-gray-900 mb-2">أدخل الرمز</h1>
                <p class="text-gray-500 text-sm leading-relaxed mb-8">
                    تم إرسال رمز مكون من 6 أرقام إلى 
                    <span dir="ltr" class="inline-block font-semibold text-gray-800">+966 55 123 4567</span>
                </p>

                <!-- 6 Code Input Boxes -->
                <div class="flex justify-between gap-2 mb-8" dir="ltr">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-saudi-green focus:bg-white focus:outline-none transition shadow-sm" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-saudi-green focus:bg-white focus:outline-none transition shadow-sm" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-saudi-green focus:bg-white focus:outline-none transition shadow-sm" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-saudi-green focus:bg-white focus:outline-none transition shadow-sm" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-saudi-green focus:bg-white focus:outline-none transition shadow-sm" inputmode="numeric" pattern="[0-9]*">
                    <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-gray-50 border-2 border-gray-200 rounded-xl focus:border-saudi-green focus:bg-white focus:outline-none transition shadow-sm" inputmode="numeric" pattern="[0-9]*">
                </div>

                <!-- Resend Timer -->
                <div class="text-center">
                    <p class="text-sm text-gray-500">
                        لم تستلم الرمز؟ 
                        <span id="resend-text" class="text-gray-400 font-semibold cursor-not-allowed">إعادة الإرسال في <span dir="ltr">0:45</span></span>
                    </p>
                </div>
            </div>

            <!-- Verify Button -->
            <div>
                <button id="verify-btn" class="w-full bg-saudi-green text-white font-bold py-4 rounded-2xl shadow-lg shadow-saudi-green/30 hover:bg-emerald-700 active:scale-[0.98] transition">
                    تحقق
                </button>
                
                <!-- Home Indicator Bar -->
                <div class="w-32 h-1 bg-gray-300 rounded-full mx-auto mt-6"></div>
            </div>

        </div>

    </div>

    <!-- Script to handle OTP box navigation -->
    <script>
        const inputs = document.querySelectorAll('.otp-input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
