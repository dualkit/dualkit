<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملخص الدفع - Payment Summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :lang(ar) {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.7;
    }
    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-0 sm:p-4">

  <!-- Mobile Screen Container -->
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[auto] sm:rounded-3xl shadow-xl flex flex-col overflow-hidden">
    
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-slate-100 transition-colors text-slate-700" aria-label="رجوع">
        <svg class="w-6 h-6 icon-directional rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="text-lg font-semibold text-slate-900">ملخص الدفع</h1>
      <div class="w-10"></div> <!-- Spacer for balance -->
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-6 py-6 flex flex-col gap-6">
      
      <!-- Amount Due Card -->
      <div class="bg-blue-50 border border-blue-100 rounded-2xl p-6 flex flex-col items-center text-center">
        <span class="text-sm font-medium text-blue-700 mb-1">المبلغ المستحق</span>
        <div class="text-3xl font-bold text-blue-950 tracking-tight my-1">
          <bdi dir="ltr">1,234.50 AED</bdi>
        </div>
        <div class="text-sm text-blue-600 mt-1">شامل ضريبة القيمة المضافة</div>
      </div>

      <!-- Dates Section -->
      <div class="bg-slate-50 rounded-2xl p-4 flex flex-col gap-3 border border-slate-100">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500">تاريخ الاستحقاق (ميلادي)</span>
          <span class="font-medium text-slate-800">
            <bdi dir="ltr">3 November 2026</bdi>
          </span>
        </div>
        <hr class="border-slate-200/60">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-500">تاريخ الاستحقاق (هجري)</span>
          <span class="font-medium text-slate-800">
            <bdi dir="ltr">22 جمادى الآخرة 1448 هـ</bdi>
          </span>
        </div>
      </div>

      <!-- Order Summary & Items Count (Plural Form: Few for 3 items) -->
      <div class="flex items-center justify-between px-2 py-1">
        <span class="text-sm font-medium text-slate-700">تفاصيل الطلب</span>
        <span class="text-sm text-slate-600 font-medium">
          لديك <bdi>3</bdi> عناصر في هذا الطلب
        </span>
      </div>

      <!-- SMS Receipt Phone Input Section -->
      <div class="flex flex-col gap-2 mt-2">
        <label for="phone-input" class="text-sm font-medium text-slate-700">إرسال الإيصال عبر الرسائل النصية</label>
        <div class="relative flex items-center">
          <!-- Prefix badge on the start side -->
          <span class="absolute inset-s-0 ps-3.5 text-sm font-medium text-slate-500 pointer-events-none flex items-center gap-1">
            <span>🇦🇪</span>
            <bdi dir="ltr">+971</bdi>
          </span>
          <input 
            type="tel" 
            id="phone-input" 
            dir="ltr" 
            inputmode="tel" 
            autocomplete="tel" 
            placeholder="50 123 4567"
            class="w-full ps-20 pe-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 text-sm font-medium focus:outline-none focus:border-blue-600 focus:ring-1 focus:ring-blue-600 transition-all text-start"
          >
        </div>
        <p class="text-sm text-slate-500 mt-0.5">
          مثال: <bdi dir="ltr">050 123 4567</bdi>
        </p>
      </div>

    </main>

    <!-- Footer Action -->
    <footer class="p-6 border-t border-slate-100 bg-white">
      <button class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-4 rounded-xl transition-colors shadow-lg shadow-blue-600/20 text-base">
        إتمام الدفع
      </button>
    </footer>

  </div>

</body>
</html>
