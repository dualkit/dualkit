<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص الدفع</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            600: '#4f46e5',
                            700: '#4338ca',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-cairo flex justify-center items-center min-h-screen m-0">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-white h-screen sm:h-[844px] sm:rounded-[40px] sm:shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-200">
        
        <!-- Top Section -->
        <div>
            <!-- Header -->
            <header class="flex items-center justify-between px-6 pt-6 pb-4 bg-white border-b border-slate-100">
                <h1 class="text-lg font-bold text-slate-800">ملخص الدفع</h1>
                <button class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-600 hover:bg-slate-100 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </header>

            <!-- Main Content Area -->
            <main class="px-6 pt-6 space-y-6">
                
                <!-- Amount Due Card -->
                <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
                    <div class="absolute -left-6 -bottom-6 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>
                    <p class="text-slate-400 text-sm font-medium mb-1">المبلغ المستحق</p>
                    <div class="flex items-baseline gap-2">
                        <span class="text-4xl font-black tracking-tight">1,234.50</span>
                        <span class="text-indigo-400 font-semibold text-lg">د.إ</span>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-300">
                        <span>رقم الفاتورة: #INV-2026-89</span>
                        <span class="bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-semibold">جاهز للدفع</span>
                    </div>
                </div>

                <!-- Due Date & Order Info -->
                <div class="bg-slate-50 rounded-2xl p-4 space-y-3 border border-slate-100">
                    <!-- Due Date -->
                    <div class="flex items-start gap-3">
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0 mt-0.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 font-medium">تاريخ الاستحقاق</p>
                            <p class="text-sm font-bold text-slate-800">3 نوفمبر 2026</p>
                            <p class="text-xs text-slate-500 mt-0.5">22 جمادى الأولى 1448 هـ</p>
                        </div>
                    </div>

                    <div class="h-px bg-slate-200/65 w-full"></div>

                    <!-- Items Count -->
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400 font-medium">تفاصيل الطلب</p>
                            <p class="text-sm font-bold text-slate-800">لديك 3 عناصر في هذا الطلب</p>
                        </div>
                    </div>
                </div>

                <!-- Phone Number Field for SMS Receipt -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-bold text-slate-700">رقم الهاتف لاستلام الإيصال (عبر الرسائل القصيرة)</label>
                    <div class="relative flex items-center">
                        <input type="tel" placeholder="050 123 4567" dir="ltr" class="w-full bg-white border border-slate-200 rounded-2xl py-3.5 px-4 text-left font-medium text-slate-800 placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600 transition shadow-sm">
                        <div class="absolute right-3.5 flex items-center gap-1.5 pointer-events-none border-l pl-3 border-slate-200">
                            <span class="text-xs font-bold text-slate-600">+971</span>
                            <span class="text-base">🇦🇪</span>
                        </div>
                    </div>
                </div>

            </main>
        </div>

        <!-- Bottom Fixed Action -->
        <div class="p-6 bg-white border-t border-slate-100">
            <button onclick="alert('تم الانتقال إلى بوابة الدفع بنجاح')" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] transition text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-base">
                <span>ادفع الآن</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
            <p class="text-center text-[10px] text-slate-400 mt-3">معاملاتك محمية ومشفرة وفق أعلى معايير الأمان المعتمدة في دولة الإمارات</p>
        </div>

    </div>

</body>
</html>
