<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الطلب - متجر البقالة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --type-label-size: 14px;
      --type-caption-size: 14px;
      --type-body-size: 16px;
    }
    :lang(ar) {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      letter-spacing: 0 !important;
      text-transform: none;
      line-height: 1.7;
    }
    /* Enforce 14px floor for all Arabic text */
    body {
      font-size: var(--type-body-size);
      background-color: #f3f4f6;
      color: #1f2937;
    }
    .text-floor-sm {
      font-size: var(--type-label-size);
    }
    /* Directional icon helper */
    .icon-directional:dir(rtl) {
      transform: scaleX(-1);
    }
    /* Right-align Arabic hint in LTR input placeholders */
    input::placeholder {
      text-align: right;
      direction: rtl;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:py-6">

  <!-- Phone Container Simulation -->
  <main class="w-full max-w-[430px] bg-white min-h-screen sm:min-h-[844px] sm:rounded-[40px] sm:shadow-2xl flex flex-col overflow-hidden relative border border-gray-200">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between px-5 py-4 border-b border-gray-100 bg-white sticky top-0 z-10">
      <button type="button" aria-label="الرجوع" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 text-gray-700 transition-colors">
        <!-- Back arrow pointing right in RTL -->
        <svg class="w-6 h-6 icon-directional" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <h1 class="font-bold text-lg text-gray-900">إتمام الطلب</h1>
      <div class="w-10"></div> <!-- Spacer for balance -->
    </header>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-y-auto px-5 py-6 space-y-6 pb-32">

      <!-- Cart Items Section -->
      <section aria-labelledby="cart-heading" class="space-y-4">
        <h2 id="cart-heading" class="font-semibold text-gray-800 text-floor-sm">عناصر السلة (<bdi>3</bdi>)</h2>
        
        <div class="space-y-3">
          <!-- Item 1 -->
          <article class="flex items-center gap-4 p-3 rounded-2xl bg-gray-50 border border-gray-100">
            <div class="w-16 h-16 bg-emerald-50 rounded-xl flex items-center justify-center shrink-0 text-emerald-600 font-bold text-floor-sm border border-emerald-100">
              صورة
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-medium text-gray-900 text-sm truncate">حليب طازج كامل الدسم <bdi>2</bdi> لتر</h3>
              <p class="text-emerald-700 font-semibold text-sm mt-1"><bdi>12.75</bdi> د.إ</p>
            </div>
            <!-- Stepper -->
            <div class="flex items-center bg-white border border-gray-200 rounded-lg overflow-hidden shrink-0">
              <button type="button" aria-label="تقليل الكمية" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors font-bold">−</button>
              <span class="w-8 text-center text-sm font-semibold text-gray-800 tabular-nums"><bdi>1</bdi></span>
              <button type="button" aria-label="زيادة الكمية" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors font-bold">+</button>
            </div>
          </article>

          <!-- Item 2 -->
          <article class="flex items-center gap-4 p-3 rounded-2xl bg-gray-50 border border-gray-100">
            <div class="w-16 h-16 bg-emerald-50 rounded-xl flex items-center justify-center shrink-0 text-emerald-600 font-bold text-floor-sm border border-emerald-100">
              صورة
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-medium text-gray-900 text-sm truncate">خبز أبيض توست سكوير</h3>
              <p class="text-emerald-700 font-semibold text-sm mt-1"><bdi>11.50</bdi> د.إ</p>
            </div>
            <!-- Stepper -->
            <div class="flex items-center bg-white border border-gray-200 rounded-lg overflow-hidden shrink-0">
              <button type="button" aria-label="تقليل الكمية" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors font-bold">−</button>
              <span class="w-8 text-center text-sm font-semibold text-gray-800 tabular-nums"><bdi>2</bdi></span>
              <button type="button" aria-label="زيادة الكمية" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors font-bold">+</button>
            </div>
          </article>

          <!-- Item 3 -->
          <article class="flex items-center gap-4 p-3 rounded-2xl bg-gray-50 border border-gray-100">
            <div class="w-16 h-16 bg-emerald-50 rounded-xl flex items-center justify-center shrink-0 text-emerald-600 font-bold text-floor-sm border border-emerald-100">
              صورة
            </div>
            <div class="flex-1 min-w-0">
              <h3 class="font-medium text-gray-900 text-sm truncate">بيض طازج عضوي وسط <bdi>30</bdi> بيضة</h3>
              <p class="text-emerald-700 font-semibold text-sm mt-1"><bdi>18.00</bdi> د.إ</p>
            </div>
            <!-- Stepper -->
            <div class="flex items-center bg-white border border-gray-200 rounded-lg overflow-hidden shrink-0">
              <button type="button" aria-label="تقليل الكمية" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors font-bold">−</button>
              <span class="w-8 text-center text-sm font-semibold text-gray-800 tabular-nums"><bdi>1</bdi></span>
              <button type="button" aria-label="زيادة الكمية" class="w-8 h-8 flex items-center justify-center text-gray-600 hover:bg-gray-100 transition-colors font-bold">+</button>
            </div>
          </article>
        </div>
      </section>

      <!-- Promo Code Section -->
      <section aria-labelledby="promo-heading" class="space-y-2">
        <h2 id="promo-heading" class="font-semibold text-gray-800 text-floor-sm">رمز الخصم</h2>
        <div class="flex gap-2">
          <input 
            type="text" 
            dir="ltr" 
            placeholder="أدخل رمز الخصم (اختياري)" 
            class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-600 focus:bg-white transition-colors text-right"
          >
          <button type="button" class="bg-gray-900 text-white font-medium px-5 rounded-xl text-sm hover:bg-gray-800 transition-colors shrink-0">
            تطبيق
          </button>
        </div>
      </section>

      <!-- Order Summary Section -->
      <section aria-labelledby="summary-heading" class="bg-gray-50 p-4 rounded-2xl border border-gray-100 space-y-3">
        <h2 id="summary-heading" class="font-semibold text-gray-900 text-floor-sm mb-1">ملخص الطلب</h2>
        
        <div class="flex justify-between text-sm text-gray-600">
          <span>المجموع الفرعي</span>
          <span class="tabular-nums font-medium text-gray-900"><bdi>42.25</bdi> د.إ</span>
        </div>

        <div class="flex justify-between text-sm text-gray-600">
          <span>رسوم التوصيل</span>
          <span class="tabular-nums font-medium text-gray-900"><bdi>10.00</bdi> د.إ</span>
        </div>

        <div class="flex justify-between text-sm text-gray-600">
          <span>ضريبة القيمة المضافة (<bdi>5%</bdi>)</span>
          <span class="tabular-nums font-medium text-gray-900"><bdi>2.61</bdi> د.إ</span>
        </div>

        <div class="border-t border-gray-200 pt-3 flex justify-between items-center text-base font-bold text-gray-900">
          <span>المجموع الكلي</span>
          <span class="tabular-nums text-emerald-700 text-lg"><bdi>54.86</bdi> د.إ</span>
        </div>
      </section>

    </div>

    <!-- Fixed Bottom Action Bar -->
    <footer class="absolute bottom-0 inset-x-0 bg-white border-t border-gray-100 p-4 shadow-lg">
      <button type="button" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 rounded-2xl text-center text-base shadow-sm transition-colors flex items-center justify-center gap-2">
        <span>تأكيد وإتمام الطلب</span>
      </button>
    </footer>

  </main>

</body>
</html>
