<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - تطبيق الدفع</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Font: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <!-- Phone Container -->
    <div class="w-[380px] h-[812px] bg-slate-50 rounded-[48px] shadow-2xl overflow-hidden flex flex-col relative border-[10px] border-slate-800">
        
        <!-- Dynamic Island / Status Bar -->
        <div class="bg-emerald-800 text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs">
            <span class="font-semibold">٠٩:٤١</span>
            <div class="w-20 h-4 bg-slate-900 rounded-full absolute top-3 left-1/2 -translate-x-1/2"></div>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- App Header -->
        <div class="bg-emerald-800 text-white px-6 pb-6 pt-2 rounded-b-[30px] shadow-md">
            <div class="flex justify-between items-center mb-6">
                <button class="w-9 h-9 rounded-full bg-emerald-700/60 flex items-center justify-center text-white hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <h1 class="text-lg font-bold">الملف الشخصي</h1>
                <button class="w-9 h-9 rounded-full bg-emerald-700/60 flex items-center justify-center text-white hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>

            <!-- Profile Avatar & Name -->
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-amber-400 to-amber-200 text-emerald-950 font-bold text-2xl flex items-center justify-center shadow-inner border-2 border-white/20">
                        ل.م
                    </div>
                    <span class="absolute bottom-0 left-0 bg-blue-500 text-white p-1 rounded-full text-[10px] shadow" title="موثق عبر الهوية الإماراتية">
                        <i class="fa-solid fa-check"></i>
                    </span>
                </div>
                <div>
                    <h2 class="text-xl font-bold">ليلى المنصوري</h2>
                    <p class="text-emerald-200 text-xs mt-0.5">حساب شخصي • الإمارات العربية المتحدة</p>
                </div>
            </div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-5 py-6 space-y-4">
            
            <!-- Section Title -->
            <div class="text-xs font-semibold text-slate-400 px-1">معلومات الحساب الشخصي</div>

            <!-- 1. Email Card -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition hover:border-emerald-200">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">البريد الإلكتروني</span>
                        <span class="text-slate-800 font-medium text-sm dir-ltr text-right inline-block">layla@example.com</span>
                    </div>
                </div>
                <button class="text-emerald-600 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    <span>تعديل</span>
                    <i class="fa-solid fa-pen text-[10px]"></i>
                </button>
            </div>

            <!-- 2. Phone Number Card -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition hover:border-emerald-200">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fa-solid fa-phone"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">رقم الهاتف المتحرك</span>
                        <span class="text-slate-800 font-medium text-sm dir-ltr text-right inline-block">+971 50 123 4567</span>
                    </div>
                </div>
                <button class="text-emerald-600 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    <span>تعديل</span>
                    <i class="fa-solid fa-pen text-[10px]"></i>
                </button>
            </div>

            <!-- 3. IBAN Card -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between transition hover:border-emerald-200">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block">رقم الحساب المصرفي الدولي (IBAN)</span>
                        <span class="text-slate-800 font-mono font-medium text-xs dir-ltr text-right inline-block">AE07 0331 2345 6789 0123 456</span>
                    </div>
                </div>
                <button class="text-emerald-600 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    <span>تعديل</span>
                    <i class="fa-solid fa-pen text-[10px]"></i>
                </button>
            </div>

            <!-- Additional Security Option -->
            <div class="pt-2">
                <div class="text-xs font-semibold text-slate-400 px-1 mb-3">الأمان والتوثيق</div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div class="flex items-center gap-3.5">
                        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <div>
                            <span class="text-slate-800 font-medium text-sm block">الهوية الإماراتية</span>
                            <span class="text-emerald-600 text-xs">تم التحقق بنجاح</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-slate-300 text-xs"></i>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bg-white border-t border-slate-100 px-6 py-3 flex justify-between items-center text-xs text-slate-400">
            <button class="flex flex-col items-center gap-1 hover:text-emerald-700 transition">
                <i class="fa-solid fa-house text-base"></i>
                <span>الرئيسية</span>
            </button>
            <button class="flex flex-col items-center gap-1 hover:text-emerald-700 transition">
                <i class="fa-solid fa-clock-rotate-left text-base"></i>
                <span>السجل</span>
            </button>
            <button class="flex flex-col items-center gap-1 hover:text-emerald-700 transition">
                <i class="fa-solid fa-qrcode text-base"></i>
                <span>الدفع السريع</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-emerald-700 font-semibold">
                <i class="fa-solid fa-user text-base"></i>
                <span>حسابي</span>
            </button>
        </div>

        <!-- Home Indicator / Bottom Safe Area -->
        <div class="bg-white pb-2 pt-1 flex justify-center">
            <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
        </div>

    </div>

</body>
</html>
