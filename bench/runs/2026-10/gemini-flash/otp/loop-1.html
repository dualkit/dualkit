<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحقق من الهوية | مصرف الأفق</title>
  
  <!-- IBM Plex Sans Arabic & Latin pairing -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-primary: #025940;
      --color-primary-hover: #014330;
      --color-primary-light: #e8f5f0;
      --color-surface: #ffffff;
      --color-bg: #f4f6f8;
      --color-text-main: #111827;
      --color-text-muted: #4b5563;
      --color-border: #d1d5db;
      --color-border-active: #025940;
      --color-warning-bg: #fffbeb;
      --color-warning-border: #fef3c7;
      --color-warning-text: #92400e;
      --color-disabled: #9ca3af;
      --color-disabled-bg: #e5e7eb;
      
      --font-arabic: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-latin: 'IBM Plex Sans', sans-serif;
    }

    /* Arabic Typography Rules */
    :lang(ar) {
      --type-label-size: 14px;
      --type-caption-size: 14px;
      --type-body-size: 16px;
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-arabic);
      font-size: var(--type-body-size);
      background-color: #0b1d16;
      color: var(--color-text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Mobile Frame */
    .mobile-frame {
      width: 100%;
      max-width: 412px;
      min-height: 780px;
      background-color: var(--color-surface);
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-block: 14px 8px;
      padding-inline: 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-main);
      font-variant-numeric: tabular-nums;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 16px;
      padding-block: 10px 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-main);
      background-color: var(--color-bg);
      transition: background-color 0.2s;
    }

    .icon-btn:hover {
      background-color: #e5e7eb;
    }

    /* Mirror directional icon in RTL */
    .icon-directional:dir(rtl) {
      transform: scaleX(-1);
    }

    .brand-mark {
      font-size: 17px;
      font-weight: 700;
      color: var(--color-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Main Content */
    .content {
      padding-inline: 24px;
      padding-block-start: 12px;
      padding-block-end: 28px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .icon-badge {
      width: 64px;
      height: 64px;
      background-color: var(--color-primary-light);
      color: var(--color-primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-block-end: 24px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--color-text-main);
      margin-block-end: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--color-text-muted);
      line-height: 1.7;
      margin-block-end: 32px;
    }

    .phone-number {
      font-weight: 600;
      color: var(--color-text-main);
      font-variant-numeric: tabular-nums;
      padding-inline: 4px;
    }

    /* Code Inputs Container */
    .otp-form {
      margin-block-end: 28px;
    }

    .otp-inputs {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-block-end: 20px;
    }

    .otp-box {
      width: 48px;
      height: 56px;
      border: 1.5px solid var(--color-border);
      border-radius: 12px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      font-family: var(--font-latin);
      font-variant-numeric: tabular-nums;
      color: var(--color-text-main);
      background-color: #fafafa;
      transition: all 0.15s ease-in-out;
      outline: none;
      caret-color: var(--color-primary);
    }

    .otp-box:focus {
      border-color: var(--color-border-active);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 89, 64, 0.12);
    }

    .otp-box.filled {
      border-color: #9ca3af;
      background-color: #ffffff;
    }

    /* Resend Section */
    .resend-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: var(--type-label-size);
      min-height: 38px;
      color: var(--color-text-muted);
    }

    .timer-text {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--color-text-main);
    }

    .resend-btn {
      background: none;
      border: none;
      color: var(--color-primary);
      font-family: inherit;
      font-size: var(--type-label-size);
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background-color 0.15s;
    }

    .resend-btn:hover {
      background-color: var(--color-primary-light);
    }

    .resend-btn:disabled {
      color: var(--color-disabled);
      cursor: not-allowed;
      background: none;
    }

    /* Security Warning Banner */
    .security-notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background-color: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      border-radius: 14px;
      margin-block-start: auto;
      margin-block-end: 24px;
    }

    .security-notice svg {
      width: 20px;
      height: 20px;
      color: var(--color-warning-text);
      flex-shrink: 0;
      margin-block-start: 3px;
    }

    .security-notice p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-warning-text);
    }

    /* Primary Action Button */
    .btn-verify {
      width: 100%;
      height: 54px;
      background-color: var(--color-primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-verify:hover:not(:disabled) {
      background-color: var(--color-primary-hover);
    }

    .btn-verify:disabled {
      background-color: var(--color-disabled-bg);
      color: var(--color-disabled);
      cursor: not-allowed;
    }

    /* Feedback Toast */
    .toast {
      position: absolute;
      inset-inline: 24px;
      top: 16px;
      background-color: #064e3b;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(-80px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }

    .toast.show {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="mobile-frame" role="region" aria-label="شاشة التحقق من الهوية">
    
    <!-- Top notification toast -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
      <span id="toast-message">تم إرسال رمز تحقق جديد بنجاح</span>
    </div>

    <!-- Phone Status Bar -->
    <header class="status-bar" aria-hidden="true">
      <bdi dir="ltr">09:41</bdi>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
          <path d="M1 9h2v3H1V9zm4-3h2v6H5V6zm4-3h2v9H9V3zm4-3h2v12h-2V0z"/>
        </svg>
        <svg width="15" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 2.4c2.8 0 5.3 1.1 7.1 2.9l-7.1 8.7L.9 5.3C2.7 3.5 5.2 2.4 8 2.4z"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 25 12" fill="currentColor">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor"/>
          <rect x="2" y="2" width="16" height="8" rx="1.5"/>
          <path d="M23 4v4h1a1 1 0 001-1V5a1 1 0 00-1-1h-1z"/>
        </svg>
      </div>
    </header>

    <!-- App Bar -->
    <div class="app-header">
      <button class="icon-btn" aria-label="الرجوع إلى الخطوة السابقة">
        <svg class="icon-directional" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <div class="brand-mark">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>مصرف الأفق</span>
      </div>
      <button class="icon-btn" aria-label="المساعدة والدعم">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </button>
    </div>

    <!-- Main View -->
    <main class="content">
      <div class="icon-badge">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1 class="title">أدخل رمز التحقق</h1>
      
      <p class="subtitle">
        أرسلنا رمزًا مكوّنًا من 6 أرقام إلى رقم الجوال
        <bdi dir="ltr" class="phone-number">+966 55 123 4567</bdi>
      </p>

      <form class="otp-form" onsubmit="event.preventDefault();" autocomplete="off">
        <!-- Input boxes pinned in LTR so first entered digit goes to position 1 -->
        <div class="otp-inputs" dir="ltr" role="group" aria-label="حقول إدخال رمز التحقق">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" autocomplete="one-time-code" aria-label="الرقم الأول" autofocus>
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الثاني">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الثالث">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الرابع">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم الخامس">
          <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="otp-box" aria-label="الرقم السادس">
        </div>

        <!-- Countdown & Resend Option -->
        <div class="resend-section">
          <span id="countdown-wrapper">
            إعادة الإرسال خلال
            <bdi dir="ltr" class="timer-text" id="timer-display">0:45</bdi>
          </span>
          <button type="button" class="resend-btn" id="btn-resend" style="display: none;">
            إعادة إرسال الرمز
          </button>
        </div>
      </form>

      <!-- SAMA Mandatory Warning for Banking Security -->
      <div class="security-notice" role="note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4"/>
          <path d="M12 17h.01"/>
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        </svg>
        <p>لا تشارك هذا الرمز مع أي شخص، بما في ذلك موظفي المصرف.</p>
      </div>

      <!-- Action Button -->
      <button type="button" class="btn-verify" id="btn-submit" disabled>
        <span>التحقق</span>
      </button>
    </main>

  </div>

  <script>
    // Utility to normalise Eastern/Persian digits to Western digits
    function toWesternDigits(str) {
      return str
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
        .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    }

    const inputs = Array.from(document.querySelectorAll('.otp-box'));
    const verifyBtn = document.getElementById('btn-submit');
    const timerDisplay = document.getElementById('timer-display');
    const countdownWrapper = document.getElementById('countdown-wrapper');
    const resendBtn = document.getElementById('btn-resend');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toast-message');

    let remainingSeconds = 45;
    let timerInterval = null;

    function updateSubmitState() {
      const code = inputs.map(i => i.value).join('');
      verifyBtn.disabled = code.length !== 6;
    }

    // Input navigation & digit handling
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        let val = toWesternDigits(e.target.value).replace(/\D/g, '');
        
        if (val.length > 1) {
          val = val.slice(-1);
        }
        
        input.value = val;
        input.classList.toggle('filled', val !== '');

        if (val && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        updateSubmitState();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          inputs[index - 1].focus();
        } else if (e.key === 'ArrowRight' && index < inputs.length - 1) {
          inputs[index + 1].focus();
        } else if (e.key === 'ArrowLeft' && index > 0) {
          inputs[index - 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pastedData = (e.clipboardData || window.clipboardData).getData('text');
        const digits = toWesternDigits(pastedData).replace(/\D/g, '').slice(0, 6);

        if (digits) {
          digits.split('').forEach((digit, i) => {
            if (inputs[i]) {
              inputs[i].value = digit;
              inputs[i].classList.add('filled');
            }
          });
          const nextIndex = Math.min(digits.length, inputs.length - 1);
          inputs[nextIndex].focus();
          updateSubmitState();
        }
      });
    });

    // Countdown Timer logic
    function startCountdown(seconds) {
      clearInterval(timerInterval);
      remainingSeconds = seconds;
      countdownWrapper.style.display = 'inline';
      resendBtn.style.display = 'none';

      const updateUI = () => {
        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        timerDisplay.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          countdownWrapper.style.display = 'none';
          resendBtn.style.display = 'inline';
        }
        remainingSeconds--;
      };

      updateUI();
      timerInterval = setInterval(updateUI, 1000);
    }

    // Resend button trigger
    resendBtn.addEventListener('click', () => {
      // Clear inputs
      inputs.forEach(i => {
        i.value = '';
        i.classList.remove('filled');
      });
      inputs[0].focus();
      updateSubmitState();

      // Show toast
      showToast('تم إرسال رمز تحقق جديد بنجاح');
      
      // Restart 45-second timer
      startCountdown(45);
    });

    // Verification button action
    verifyBtn.addEventListener('click', () => {
      const code = inputs.map(i => i.value).join('');
      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span>جاري التحقق...</span>';
      
      setTimeout(() => {
        showToast('تم تأكيد الرمز بنجاح');
        verifyBtn.innerHTML = '<span>تم التحقق</span>';
        verifyBtn.style.backgroundColor = '#059669';
      }, 1000);
    });

    function showToast(msg) {
      toastMessage.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    // Start initial timer
    startCountdown(45);
  </script>
</body>
</html>
