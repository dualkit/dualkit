<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :lang(ar) {
      --type-body-size: 16px;
      --type-label-size: 14px;
      --type-caption-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }
    body {
      font-family: 'IBM Plex Sans', 'IBM Plex Sans Arabic', sans-serif;
      font-size: var(--type-body-size);
      margin: 0;
      padding: 16px;
      background-color: #f5f5f5;
      color: #333;
    }
    .profile-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .profile-header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }
    .profile-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    .profile-item:last-child {
      border-bottom: none;
    }
    .profile-label {
      font-size: var(--type-label-size);
      font-weight: 500;
    }
    .profile-value {
      font-size: var(--type-body-size);
      text-align: right;
    }
    .edit-button {
      background: none;
      border: none;
      color: #007AFF;
      font-size: var(--type-label-size);
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
    }
    .edit-button:hover {
      text-decoration: underline;
    }
    bdi {
      unicode-bidi: isolate;
    }
  </style>
</head>
<body>
  <div class="profile-header">
    <h1>الملف الشخصي</h1>
  </div>

  <div class="profile-item">
    <div class="profile-label">الاسم</div>
    <div class="profile-value">ليلى المنصوري</div>
    <button class="edit-button">تعديل</button>
  </div>

  <div class="profile-item">
    <div class="profile-label">البريد الإلكتروني</div>
    <div class="profile-value"><bdi dir="ltr">layla@example.com</bdi></div>
    <button class="edit-button">تعديل</button>
  </div>

  <div class="profile-item">
    <div class="profile-label">رقم الهاتف</div>
    <div class="profile-value"><bdi dir="ltr">+971 50 123 4567</bdi></div>
    <button class="edit-button">تعديل</button>
  </div>

  <div class="profile-item">
    <div class="profile-label">رقم الحساب البنكي (IBAN)</div>
    <div class="profile-value"><bdi dir="ltr">AE07 0331 2345 6789 0123 456</bdi></div>
    <button class="edit-button">تعديل</button>
  </div>
</body>
</html>
