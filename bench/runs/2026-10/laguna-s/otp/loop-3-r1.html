<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إدخال الرمز</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic&display=swap" rel="stylesheet">
  <style>
    :lang(ar) {
      --type-body-size: 16px;
      --type-label-size: 14px;
      --type-caption-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background-color: #f5f5f5;
      color: #1a1a1a;
      font-size: var(--type-body-size);
      line-height: 1.7;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: var(--type-body-size);
      text-align: center;
      margin-bottom: 24px;
    }

    .code-inputs {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 24px;
    }

    .code-box {
      flex: 1;
      height: 48px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      background-color: #fff;
      box-sizing: border-box;
    }

    .countdown {
      font-size: var(--type-label-size);
      text-align: center;
      margin-bottom: 24px;
    }

    .verify-button {
      width: 100%;
      height: 48px;
      background-color: #0070ba;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: var(--type-label-size);
      font-weight: 600;
      cursor: pointer;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">أدخل الرمز</h1>
    <p class="subtitle">لقد أرسلنا رمزًا مكوّنًا من 6 أرقام إلى <bdi dir="ltr">+966 55 123 4567</bdi></p>

    <div class="code-inputs">
      <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
      <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
      <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
      <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
      <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
      <input type="text" maxlength="1" class="code-box" inputmode="numeric" />
    </div>

    <p class="countdown">إعادة الإرسال خلال <span id="timer">0:45</span></p>

    <button class="verify-button">تحقّق</button>
  </div>

  <script>
    let seconds = 45;
    const timerEl = document.getElementById('timer');

    const interval = setInterval(() => {
      seconds--;
      if (seconds < 0) {
        clearInterval(interval);
        timerEl.textContent = 'انتهى الوقت';
      } else {
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerEl.textContent = `${m}:${s}`;
      }
    }, 1000);
  </script>
</body>
</html>
