<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الإعدادات - تطبيق بنك البحرين</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            direction: rtl;
            text-align: right;
            padding: 20px;
            max-width: 414px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .back-button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #007AFF;
        }

        .settings-group {
            background: #fff;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .group-title {
            background-color: #f9f9fb;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 600;
            color: #555;
            border-bottom: 1px solid #eee;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid #f0f0f0;
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .row-label {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row-label .icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .row-label .label-text {
            font-size: 16px;
            color: #333;
        }

        .row-value {
            font-size: 15px;
            color: #666;
        }

        .chevron {
            font-size: 18px;
            color: #ccc;
            margin-left: 8px;
        }

        .toggle-container {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .toggle-container input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #007AFF;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .row-with-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid #f0f0f0;
        }

        .row-with-toggle:last-child {
            border-bottom: none;
        }

        .row-with-toggle .row-label {
            gap: 12px;
        }

        .row-with-toggle .row-label .icon {
            font-size: 20px;
            width: 24px;
            text-align: center;
        }

        .row-with-toggle .row-label .label-text {
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>الإعدادات</h1>
        <button class="back-button">←</button>
    </div>

    <!-- Account Group -->
    <div class="settings-group">
        <div class="group-title">الحساب</div>
        <div class="settings-row">
            <div class="row-label">
                <span class="icon">👤</span>
                <span class="label-text">الاسم</span>
            </div>
            <span class="row-value">محمد علي أحمد</span>
        </div>
        <div class="settings-row">
            <div class="row-label">
                <span class="icon">📱</span>
                <span class="label-text">رقم الهاتف</span>
            </div>
            <span class="row-value">+973 3600 1234</span>
        </div>
        <div class="settings-row">
            <div class="row-label">
                <span class="icon">🌐</span>
                <span class="label-text">اللغة</span>
            </div>
            <span class="row-value">العربية <span class="chevron">›</span></span>
        </div>
    </div>

    <!-- Security Group -->
    <div class="settings-group">
        <div class="group-title">الأمان</div>
        <div class="row-with-toggle">
            <div class="row-label">
                <span class="icon">👁️</span>
                <span class="label-text">مصادقة الوجه (Face ID)</span>
            </div>
            <label class="toggle-container">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="row-with-toggle">
            <div class="row-label">
                <span class="icon">🔐</span>
                <span class="label-text">تسجيل الدخول ثنائي الخطوات</span>
            </div>
            <label class="toggle-container">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Notifications Group -->
    <div class="settings-group">
        <div class="group-title">الإشعارات</div>
        <div class="row-with-toggle">
            <div class="row-label">
                <span class="icon">💸</span>
                <span class="label-text">التحويلات</span>
            </div>
            <label class="toggle-container">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="row-with-toggle">
            <div class="row-label">
                <span class="icon">🎁</span>
                <span class="label-text">العروض</span>
            </div>
            <label class="toggle-container">
                <input type="checkbox">
                <span class="slider"></span>
            </label>
        </div>
        <div class="row-with-toggle">
            <div class="row-label">
                <span class="icon">🧾</span>
                <span class="label-text">البيانات</span>
            </div>
            <label class="toggle-container">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
</body>
</html>
