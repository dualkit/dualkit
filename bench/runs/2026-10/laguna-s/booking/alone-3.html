<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حجز موعد - عيادة القطرية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            padding: 15px;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 414px;
            margin: 0 auto;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #006a9c, #0087c7);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
        }
        .doctor-section {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .doctor-info h2 {
            font-size: 18px;
            color: #006a9c;
        }
        .doctor-info p {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .month-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-btn {
            background: #006a9c;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: #005a82;
        }
        .month-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .weekday {
            text-align: center;
            padding: 10px 4px;
            font-size: 13px;
            font-weight: 600;
            color: #888;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .day-cell {
            height: 48px;
            padding: 6px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            position: relative;
        }
        .day-cell.other-month {
            background: #fafafa;
            color: #bbb;
        }
        .day-cell.current-day {
            background: #e7f4fb;
            border-radius: 6px;
        }
        ..day-number {
            font-size: 14px;
            font-weight: 500;
        }
        .day-cell.current-day .day-number {
            color: #006a9c;
            font-weight: 700;
        }
        .day-cell.selected {
            background: #006a9c;
            color: #fff;
            border-radius: 6px;
        }
        .day-cell.selected .day-number {
            color: #fff;
            font-weight: 700;
        }
        .time-slots-container {
            padding: 15px 20px;
        }
        .time-slots-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .time-slot {
            padding: 12px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-slot:hover {
            border-color: #006a9c;
            color: #006a9c;
        }
        .time-slot.selected {
            background: #006a9c;
            color: #fff;
            border-color: #006a9c;
        }
        .confirm-btn {
            display: block;
            width: calc(100% - 40px);
            margin: 10px auto;
            padding: 14px;
            background: #006a9c;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover {
            background: #005a82;
        }
        .confirm-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>حجز موعد</h1>
        </div>

        <div class="doctor-section">
            <div class="doctor-info">
                <h2>د. فاطمة المنصوري</h2>
                <p>أخصائية طب الأسرة</p>
            </div>
        </div>

        <div class="calendar-header">
            <div class="month-nav">
                <button class="nav-btn" id="nextMonth">›</button>
                <span class="month-title" id="monthTitle">أكتوبر 2024</span>
                <button class="nav-btn" id="prevMonth">‹</button>
            </div>
        </div>

        <div class="weekdays" id="weekdays"></div>
        <div class="days-grid" id="daysGrid"></div>

        <div class="time-slots-container">
            <div class="time-slots-title">اختر وقت الحجز</div>
            <div class="time-slots" id="timeSlots"></div>
        </div>

        <button class="confirm-btn" id="confirmBtn" disabled>تأكيد الحجز</button>
    </div>

    <script>
        const arabicMonths = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];

        const arabicWeekdays = ["س", "أ", "ح", "ث", "ج", "ب", "أ"];

        let currentDate = new Date();
        let selectedDate = null;
        let selectedTime = null;

        const monthTitle = document.getElementById("monthTitle");
        const weekdaysEl = document.getElementById("weekdays");
        const daysGridEl = document.getElementById("daysGrid");
        const timeSlotsEl = document.getElementById("timeSlots");
        const confirmBtn = document.getElementById("confirmBtn");
        const prevMonthBtn = document.getElementById("prevMonth");
        const nextMonthBtn = document.getElementById("nextMonth");

        function renderWeekdays() {
            weekdaysEl.innerHTML = "";
            arabicWeekdays.forEach(day => {
                const div = document.createElement("div");
                div.className = "weekday";
                div.textContent = day;
                weekdaysEl.appendChild(div);
            });
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const today = new Date();

            monthTitle.textContent = `${arabicMonths[month]} ${year}`;

            daysGridEl.innerHTML = "";

            const firstDay = new Date(year, month, 1);
            const lastDayPrev = new Date(year, month, 0);
            const startDate = firstDay.getDay();

            let startOffset = (startDate - 6 + 7) % 7;

            const daysInMonth = lastDayPrev.getDate();

            const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

            for (let i = 0; i < totalCells; i++) {
                const dayCell = document.createElement("div");
                dayCell.className = "day-cell";

                const dayNumber = i - startOffset + 1;

                if (i < startOffset) {
                    dayCell.classList.add("other-month");
                    dayCell.textContent = "";
                } else if (dayNumber > daysInMonth) {
                    dayCell.classList.add("other-month");
                    dayCell.textContent = "";
                } else {
                    dayCell.textContent = dayNumber;

                    const cellDate = new Date(year, month, dayNumber);

                    if (
                        today.getDate() === dayNumber &&
                        today.getMonth() === month &&
                        today.getFullYear() === year
                    ) {
                        dayCell.classList.add("current-day");
                    }

                    if (
                        selectedDate &&
                        selectedDate.getDate() === dayNumber &&
                        selectedDate.getMonth() === month &&
                        selectedDate.getFullYear() === year
                    ) {
                        dayCell.classList.add("selected");
                    }

                    dayCell.addEventListener("click", () => {
                        document.querySelectorAll(".day-cell").forEach(c => c.classList.remove("selected"));
                        dayCell.classList.add("selected");
                        selectedDate = new Date(year, month, dayNumber);
                        updateConfirmButton();
                    });
                }

                daysGridEl.appendChild(dayCell);
            }
        }

        function renderTimeSlots() {
            timeSlotsEl.innerHTML = "";
            const slots = [
                "09:00", "09:30", "10:00", "10:30",
                "11:00", "11:30", "12:00"
            ];

            slots.forEach(slot => {
                const btn = document.createElement("div");
                btn.className = "time-slot";
                btn.textContent = slot;
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".time-slot").forEach(s => s.classList.remove("selected"));
                    btn.classList.add("selected");
                    selectedTime = slot;
                    updateConfirmButton();
                });
                timeSlotsEl.appendChild(btn);
            });
        }

        function updateConfirmButton() {
            if (selectedDate && selectedTime) {
                confirmBtn.disabled = false;
            } else {
                confirmBtn.disabled = true;
            }
        }

        prevMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextMonthBtn.addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        confirmBtn.addEventListener("click", () => {
            if (selectedDate && selectedTime) {
                alert(`تم حجز موعد مع د. فاطمة المنصوري في تاريخ ${selectedDate.toLocaleDateString('ar-EG')} الساعة ${selectedTime}`);
            }
        });

        renderWeekdays();
        renderCalendar();
        renderTimeSlots();
    </script>
</body>
</html>
