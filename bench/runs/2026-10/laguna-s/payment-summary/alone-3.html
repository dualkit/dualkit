<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص الدفع</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            direction: rtl;
            text-align: right;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            margin-left: 15px;
            color: #007AFF;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .amount-due {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .due-date {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .items-line {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .phone-field {
            margin-bottom: 30px;
        }

        .phone-field label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .phone-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: right;
        }

        .phone-example {
            font-size: 14px;
            color: #999;
            margin-top: 5px;
        }

        .pay-button {
            width: 100%;
            padding: 16px;
            background-color: #007AFF;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .pay-button:hover {
            background-color: #0066e6;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-button">&#8599;</button>
        <h1>ملخص الدفع</h1>
    </div>

    <div class="amount-due">1,234.50 درهم إماراتي</div>

    <div class="due-date">
        تاريخ الاستحقاق: 3 نوفمبر 2026<br>
        الموافق: 14 جمادى الأولى 1448 هـ
    </div>

    <div class="items-line">لديك 3 عناصر في هذا الطلب</div>

    <div class="phone-field">
        <label for="phone">رقم الهاتف لإرسال الإيصال عبر الرسائل النصية القصيرة</label>
        <input type="tel" id="phone" class="phone-input" placeholder="أدخل رقم هاتفك">
        <div class="phone-example">مثال: 050 123 4567</div>
    </div>

    <button class="pay-button">دفع الآن</button>
</body>
</html>
