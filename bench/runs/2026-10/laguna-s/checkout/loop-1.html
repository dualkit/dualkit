<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة التسوق - توكيلات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #16a34a;
      --border: #e5e7eb;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      padding-bottom: 80px;
    }

    :lang(ar) {
      --type-body-size: 16px;
      --type-label-size: 14px;
      --type-caption-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }

    header {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-inline-end: 12px;
    }

    .back-icon {
      width: 24px;
      height: 24px;
      fill: var(--text);
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }

    .spacer {
      width: 40px;
    }

    main {
      padding: 20px;
    }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
    }

    .item-img {
      width: 72px;
      height: 72px;
      background: #e5e7eb;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    .item-price {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text);
    }

    .stepper-qty {
      font-size: 14px;
      font-weight: 500;
      min-width: 20px;
      text-align: center;
    }

    .promo-section {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .promo-label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .promo-field {
      display: flex;
      gap: 8px;
    }

    .promo-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      outline: none;
    }

    .promo-input:focus {
      border-color: var(--accent);
    }

    .promo-input::placeholder {
      text-align: right;
      direction: rtl;
    }

    .promo-btn {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .summary-section {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
    }

    .summary-row:last-child {
      border-bottom: none;
    }

    .summary-label {
      font-size: 14px;
      color: var(--muted);
    }

    .summary-value {
      font-size: 15px;
      font-weight: 500;
    }

    .total-row {
      border-top: 2px solid var(--border);
      padding-top: 12px;
      margin-top: 8px;
    }

    .total-label {
      font-size: 16px;
      font-weight: 600;
    }

    .total-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .place-order-btn {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--accent);
      color: white;
      border: none;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 0;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .money {
      font-variant-numeric: tabular-nums;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" aria-label="رجوع">
      <svg class="back-icon" viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <h1>سلة التسوق</h1>
    <div class="spacer"></div>
  </header>

  <main>
    <section class="cart-items">
      <div class="cart-item">
        <div class="item-img">صورة المنتج</div>
        <div class="item-details">
          <div class="item-name">تفاح أحمر</div>
          <div class="item-meta">
            <div class="item-price money">د.إ 12.50</div>
            <div class="stepper">
              <button class="stepper-btn" aria-label="إضافة">-</button>
              <span class="stepper-qty">2</span>
              <button class="stepper-btn" aria-label="إضافة">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="cart-item">
        <div class="item-img">صورة المنتج</div>
        <div class="item-details">
          <div class="item-name">حليب كامل</div>
          <div class="item-meta">
            <div class="item-price money">د.إ 8.75</div>
            <div class="stepper">
              <button class="stepper-btn" aria-label="إضافة">-</button>
              <span class="stepper-qty">1</span>
              <button class="stepper-btn" aria-label="إضافة">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="cart-item">
        <div class="item-img">صورة المنتج</div>
        <div class="item-details">
          <div class="item-name">خبز برتقالي</div>
          <div class="item-meta">
            <div class="item-price money">د.إ 6.00</div>
            <div class="stepper">
              <button class="stepper-btn" aria-label="إضافة">-</button>
              <span class="stepper-qty">1</span>
              <button class="stepper-btn" aria-label="إضافة">+</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="promo-section">
      <label class="promo-label" for="promo-code">كوبون الخصم</label>
      <div class="promo-field">
        <input type="text" id="promo-code" class="promo-input" placeholder="أدخل كوبونك هنا" dir="ltr">
        <button type="button" class="promo-btn">تطبيق</button>
      </div>
    </section>

    <section class="summary-section">
      <div class="summary-row">
        <span class="summary-label">المجموع الفرعي</span>
        <span class="summary-value money">د.إ 33.75</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">رسوم التوصيل</span>
        <span class="summary-value money">د.إ 15.00</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">ضريبة القيمة المضافة (5%)</span>
        <span class="summary-value money">د.إ 2.44</span>
      </div>
      <div class="summary-row total-row">
        <span class="total-label">المجموع الكلي</span>
        <span class="total-value money">د.إ 51.19</span>
      </div>
    </section>
  </main>

  <button type="submit" class="place-order-btn">إتمام الطلب</button>
</body>
</html>
