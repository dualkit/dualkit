<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات - بنك البحرين</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :lang(ar) {
      letter-spacing: 0;
      line-height: 1.6;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-6">

  <!-- Phone Frame Container -->
  <div class="w-full sm:w-[390px] h-screen sm:h-[844px] bg-slate-100 sm:rounded-[48px] shadow-2xl flex flex-col overflow-hidden border-0 sm:border-8 sm:border-slate-800 relative">

    <!-- Status Bar (Simulated Mobile) -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-slate-800 select-none">
      <span>09:41</span>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px]">5G</span>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h15.3l-.62-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.66-.59 3.18-1.57 4.38L16.2 15h-8.4l-.23 1.38C6.59 15.18 6 13.66 6 12c0-3.87 3.13-7 7-7z"/></svg>
      </div>
    </div>

    <!-- App Header -->
    <header class="bg-white px-6 py-4 border-b border-slate-100 flex items-center justify-between shadow-xs">
      <h1 class="text-xl font-bold text-slate-900">الإعدادات</h1>
      <button aria-label="الرجوع" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition-colors">
        <svg class="w-5 h-5 rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </header>

    <!-- Scrollable Settings Body -->
    <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6">

      <!-- Group 1: Account -->
      <section>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">الحساب</h2>
        <div class="bg-white rounded-2xl shadow-xs divide-y divide-slate-100 overflow-hidden">
          
          <!-- Name Row -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <span class="text-sm font-medium text-slate-700">الاسم الكامل</span>
            <span class="text-sm font-semibold text-slate-900">أحمد محمد الخليفة</span>
          </div>

          <!-- Phone Row -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <span class="text-sm font-medium text-slate-700">رقم الهاتف</span>
            <bdi dir="ltr" class="text-sm font-semibold text-slate-900">+973 3600 1234</bdi>
          </div>

          <!-- Language Row (Navigable with Chevron) -->
          <button class="w-full flex items-center justify-between px-4 py-3.5 hover:bg-slate-50 transition-colors text-start">
            <span class="text-sm font-medium text-slate-700">لغة التطبيق</span>
            <div class="flex items-center gap-2">
              <span class="text-sm text-slate-500">العربية</span>
              <svg class="w-4 h-4 text-slate-400 rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
              </svg>
            </div>
          </button>

        </div>
      </section>

      <!-- Group 2: Security -->
      <section>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">الأمان</h2>
        <div class="bg-white rounded-2xl shadow-xs divide-y divide-slate-100 overflow-hidden">
          
          <!-- Face ID Toggle -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <div class="flex flex-col">
              <span class="text-sm font-medium text-slate-700">بصمة الوجه</span>
              <span class="text-xs text-slate-400">تسجيل الدخول السريع عبر التعرف على الوجه</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] rtl:after:right-auto rtl:after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
          </div>

          <!-- Two-step Login Toggle -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <div class="flex flex-col">
              <span class="text-sm font-medium text-slate-700">تسجيل الدخول بخطوتين</span>
              <span class="text-xs text-slate-400">حماية إضافية عبر رمز التحقق</span>
            </div>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] rtl:after:right-auto rtl:after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
          </div>

        </div>
      </section>

      <!-- Group 3: Notifications -->
      <section>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider px-3 mb-2">الإشعارات</h2>
        <div class="bg-white rounded-2xl shadow-xs divide-y divide-slate-100 overflow-hidden">
          
          <!-- Transfers Toggle -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <span class="text-sm font-medium text-slate-700">تنبيهات التحويلات</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] rtl:after:right-auto rtl:after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
          </div>

          <!-- Offers Toggle -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <span class="text-sm font-medium text-slate-700">العروض والخصومات</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] rtl:after:right-auto rtl:after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
          </div>

          <!-- Statements Toggle -->
          <div class="flex items-center justify-between px-4 py-3.5">
            <span class="text-sm font-medium text-slate-700">كشوفات الحساب الشهرية</span>
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" checked class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] rtl:after:right-auto rtl:after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
            </label>
          </div>

        </div>
      </section>

    </main>

    <!-- Home Indicator (Simulated Mobile) -->
    <div class="bg-white py-2 flex justify-center items-center">
      <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
    </div>

  </div>

</body>
</html>
