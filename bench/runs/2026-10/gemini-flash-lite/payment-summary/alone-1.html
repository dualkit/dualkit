<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملخص الدفع</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef8f6',
                            500: '#0d9488',
                            600: '#0f766e',
                            700: '#115e59',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 font-cairo flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="w-full sm:max-w-[390px] h-screen sm:h-[844px] bg-slate-50 text-slate-800 sm:rounded-[40px] shadow-2xl flex flex-col justify-between overflow-hidden relative border-0 sm:border-8 sm:border-slate-800">
        
        <!-- Header -->
        <div class="bg-white px-6 pt-12 pb-4 flex items-center justify-between border-b border-slate-100">
            <h1 class="text-lg font-bold text-slate-900">ملخص الدفع</h1>
            <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
            
            <!-- Amount Card -->
            <div class="bg-gradient-to-br from-brand-600 to-teal-800 rounded-2xl p-6 text-white shadow-lg text-center">
                <span class="text-xs uppercase tracking-wider text-teal-100 opacity-90 block mb-1">المبلغ المستحق</span>
                <div class="text-3xl font-bold tracking-tight mb-1">
                    1,234.50 <span class="text-lg font-normal">درهم</span>
                </div>
                <div class="inline-block bg-teal-700/60 text-teal-50 text-xs px-3 py-1 rounded-full mt-2">
                    شامل ضريبة القيمة المضافة
                </div>
            </div>

            <!-- Due Date & Order Info -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                <!-- Due Date -->
                <div class="flex items-start justify-between pb-4 border-b border-slate-100">
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400">تاريخ الاستحقاق</p>
                            <p class="text-sm font-semibold text-slate-800">3 نوفمبر 2026</p>
                            <p class="text-xs text-slate-500">22 جمادى الأولى 1448 هـ</p>
                        </div>
                    </div>
                </div>

                <!-- Items Count -->
                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center space-x-3 space-x-reverse">
                        <div class="w-10 h-10 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs text-slate-400">تفاصيل الطلب</p>
                            <p class="text-sm font-semibold text-slate-800">لديك 3 عناصر في هذا الطلب</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SMS Receipt Input -->
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-2">
                <label for="phone" class="block text-xs font-semibold text-slate-700">رقم الهاتف لإرسال الإيصال (اختياري)</label>
                <div class="relative flex items-center">
                    <input type="tel" id="phone" placeholder="050 123 4567" dir="ltr" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-left text-sm text-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                    <div class="absolute right-3 text-xs text-slate-400 pointer-events-none font-medium">🇦🇪 +971</div>
                </div>
            </div>

        </div>

        <!-- Footer / Pay Button -->
        <div class="bg-white p-6 border-t border-slate-100">
            <button class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-brand-600/30 transition transform active:scale-[0.98] flex items-center justify-center space-x-2 space-x-reverse">
                <span>ادفع الآن</span>
                <svg class="w-5 h-5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
            <div class="text-center mt-3">
                <span class="text-[10px] text-slate-400 flex items-center justify-center gap-1">
                    <svg class="w-3 h-3 text-emerald-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
                    دفع آمن ومشفر بالكامل
                </span>
            </div>
        </div>

    </div>

</body>
</html>
