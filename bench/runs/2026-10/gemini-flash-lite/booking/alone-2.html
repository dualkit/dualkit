<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد - عيادات الدوحة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        primary: '#0e7490',
                        primaryDark: '#155e75',
                        accent: '#06b6d4',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-0 m-0">

    <!-- Phone Screen Container -->
    <div class="w-[390px] h-[844px] bg-white rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-[8px] border-slate-800">
        
        <!-- Phone Notch / Status Bar -->
        <div class="bg-primary text-white px-6 pt-4 pb-2 flex justify-between items-center text-sm">
            <span>9:41</span>
            <div class="w-24 h-4 bg-slate-800 rounded-full absolute top-2 left-1/2 transform -translate-x-1/2"></div>
            <div class="flex gap-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- App Header -->
        <div class="bg-primary text-white px-6 py-4 flex items-center justify-between shadow-md">
            <button class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
            <h1 class="text-lg font-bold">حجز موعد</h1>
            <div class="w-9"></div> <!-- Spacer -->
        </div>

        <!-- Main Content (Scrollable) -->
        <div class="flex-1 overflow-y-auto p-5 space-y-6 pb-24">

            <!-- Doctor Profile Card -->
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-sm">
                <img src="https://images.unsplash.com/photo-1594824813587-28d842b429d2?w=150&auto=format&fit=crop&q=80" 
                     alt="د. فاطمة الكعبي" 
                     class="w-16 h-16 rounded-full object-cover border-2 border-primary">
                <div>
                    <span class="text-xs bg-primary/10 text-primary px-2 py-0.5 rounded-full font-semibold">استشاري</span>
                    <h2 class="font-bold text-slate-800 text-base mt-1">د. فاطمة الكعبي</h2>
                    <p class="text-xs text-slate-500">طب الأسرة والمجتمع • مركز الرديفة الطبي</p>
                </div>
            </div>

            <!-- Calendar Section -->
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-4">
                <!-- Month Navigation -->
                <div class="flex items-center justify-between mb-4">
                    <button id="prevMonth" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <h2 id="monthYearDisplay" class="font-bold text-slate-800 text-base">أكتوبر ٢٠٢٣</h2>
                    <button id="nextMonth" class="w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-600 transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                </div>

                <!-- Weekdays Header (Saturday Start) -->
                <div class="grid grid-cols-7 text-center text-xs font-semibold text-slate-400 mb-2">
                    <div>سبت</div>
                    <div>أحد</div>
                    <div>إثنين</div>
                    <div>ثلاثاء</div>
                    <div>أربعاء</div>
                    <div>خميس</div>
                    <div>جمعة</div>
                </div>

                <!-- Days Grid -->
                <div id="daysGrid" class="grid grid-cols-7 gap-y-2 text-center text-sm">
                    <!-- Days will be populated via JS or static markup -->
                    <!-- Padding days for previous month -->
                    <div class="text-slate-300 py-2">30</div>
                    <!-- October Days -->
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">1</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">2</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">3</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">4</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">5</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">6</div>
                    
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">7</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">8</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">9</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">10</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">11</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">12</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">13</div>

                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">14</div>
                    <!-- Today Marked -->
                    <div class="py-2 bg-primary text-white font-bold rounded-full cursor-pointer shadow-md shadow-primary/30">15</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">16</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">17</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">18</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">19</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">20</div>

                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">21</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">22</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">23</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">24</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">25</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">26</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">27</div>

                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">28</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">29</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">30</div>
                    <div class="py-2 text-slate-700 hover:bg-slate-100 rounded-full cursor-pointer">31</div>
                </div>
            </div>

            <!-- Time Slots Section -->
            <div>
                <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                    <i class="fa-regular fa-clock text-primary"></i>
                    الأوقات المتاحة (صباحاً)
                </h3>
                <div class="grid grid-cols-3 gap-2.5">
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:border-primary hover:text-primary transition text-center">
                        ٠٩:٠٠ ص
                    </button>
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:border-primary hover:text-primary transition text-center">
                        ٠٩:٣٠ ص
                    </button>
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:border-primary hover:text-primary transition text-center">
                        ١٠:٠٠ ص
                    </button>
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl bg-primary text-white border border-primary font-bold shadow-sm text-center">
                        ١٠:٣٠ ص
                    </button>
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:border-primary hover:text-primary transition text-center">
                        ١١:٠٠ ص
                    </button>
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:border-primary hover:text-primary transition text-center">
                        ١١:٣٠ ص
                    </button>
                    <button class="time-slot py-2.5 px-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-700 hover:border-primary hover:text-primary transition text-center">
                        ١٢:٠٠ م
                    </button>
                </div>
            </div>

        </div>

        <!-- Bottom Action Bar -->
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 p-4 shadow-lg">
            <button class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-primary/30 transition flex items-center justify-center gap-2">
                <span>تأكيد الحجز</span>
                <i class="fa-solid fa-check"></i>
            </button>
        </div>

    </div>

    <script>
        // Simple interactivity for time slots selection
        const slots = document.querySelectorAll('.time-slot');
        slots.forEach(slot => {
            slot.addEventListener('click', () => {
                slots.forEach(s => {
                    s.classList.remove('bg-primary', 'text-white', 'border-primary', 'font-bold', 'shadow-sm');
                    s.classList.add('border-slate-200', 'text-slate-700');
                });
                slot.classList.remove('border-slate-200', 'text-slate-700');
                slot.classList.add('bg-primary', 'text-white', 'border-primary', 'font-bold', 'shadow-sm');
            });
        });
    </script>
</body>
</html>
