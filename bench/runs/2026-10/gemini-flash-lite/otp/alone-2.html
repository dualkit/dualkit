<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الرمز - تطبيق البنك</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        bankGreen: {
                            DEFAULT: '#006C35', // Saudi Green vibe
                            dark: '#004D25',
                            light: '#E6F4EA'
                        },
                        gold: '#C5A059'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 font-cairo flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="w-full sm:w-[390px] h-screen sm:h-[844px] bg-white sm:rounded-[40px] shadow-2xl overflow-hidden relative flex flex-col justify-between border-0 sm:border-8 sm:border-slate-800">
        
        <!-- Top Status Bar & Header -->
        <div>
            <!-- Status Bar Placeholder -->
            <div class="flex justify-between items-center px-6 pt-4 pb-2 text-slate-800 text-sm font-semibold">
                <span>9:41</span>
                <div class="flex items-center space-x-2 space-x-reverse">
                    <i class="fa-solid fa-signal text-xs"></i>
                    <i class="fa-solid fa-wifi text-xs"></i>
                    <i class="fa-solid fa-battery-full text-sm"></i>
                </div>
            </div>

            <!-- App Navigation Bar -->
            <div class="flex items-center justify-between px-6 py-4">
                <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition">
                    <i class="fa-solid.fa-arrow-right fa-solid fa-chevron-right text-sm"></i>
                </button>
                <div class="text-bankGreen font-bold text-lg">المصرف السعودي</div>
                <div class="w-10"></div> <!-- Spacer for alignment -->
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="px-6 flex-1 flex flex-col justify-start pt-6">
            
            <!-- Icon Illustration -->
            <div class="w-16 h-16 bg-bankGreen-light rounded-2xl flex items-center justify-center text-bankGreen text-2xl mb-6">
                <i class="fa-solid fa-shield-halved"></i>
            </div>

            <!-- Title & Subtitle -->
            <h1 class="text-2xl font-bold text-slate-900 mb-2">أدخل الرمز</h1>
            <p class="text-slate-500 text-sm leading-relaxed mb-8">
                تم إرسال رمز مكون من 6 أرقام إلى <span dir="ltr" class="font-semibold text-slate-800 inline-block">+966 55 123 4567</span>
            </p>

            <!-- 6 Code Input Boxes -->
            <div class="flex justify-between gap-2 mb-8" dir="ltr">
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-bankGreen focus:outline-none focus:bg-white transition" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-bankGreen focus:outline-none focus:bg-white transition" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-bankGreen focus:outline-none focus:bg-white transition" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-bankGreen focus:outline-none focus:bg-white transition" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-bankGreen focus:outline-none focus:bg-white transition" />
                <input type="text" maxlength="1" class="otp-input w-12 h-14 text-center text-xl font-bold bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-bankGreen focus:outline-none focus:bg-white transition" />
            </div>

            <!-- Countdown Timer / Resend -->
            <div class="text-center text-sm text-slate-500 mb-6">
                إعادة الإرسال خلال <span id="countdown" class="font-semibold text-bankGreen">0:45</span>
            </div>

        </div>

        <!-- Bottom Action Area -->
        <div class="p-6 bg-white border-t border-slate-100">
            <button id="verifyBtn" class="w-full bg-bankGreen hover:bg-bankGreen-dark text-white font-bold py-4 rounded-2xl shadow-lg shadow-bankGreen/20 transition duration-200 flex items-center justify-center space-x-2 space-x-reverse">
                <span>تحقق</span>
            </button>
            
            <!-- Home Indicator Bar -->
            <div class="w-32 h-1 bg-slate-200 rounded-full mx-auto mt-6 sm:block hidden"></div>
        </div>

    </div>

    <!-- OTP Input Logic Script -->
    <script>
        const inputs = document.querySelectorAll('.otp-input');

        inputs.forEach((input, index) => {
            // Handle typing
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Simple Countdown Timer Logic
        let timeLeft = 45;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.innerHTML = '<a href="#" class="text-bankGreen underline font-bold">إعادة الإرسال الآن</a>';
            } else {
                timeLeft--;
                let seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
                countdownEl.textContent = `0:${seconds}`;
            }
        }, 1000);
    </script>
</body>
</html>
