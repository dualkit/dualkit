<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - تطبيق المدفوعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0d9488;
      --primary-light: #f0fdfa;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    :lang(ar) {
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.7;
    }

    .phone-container {
      width: 100%;
      max-width: 412px;
      background-color: var(--card-bg);
      border-radius: 2.5rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 844px;
      border: 8px solid #1e293b;
    }

    /* App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background-color: #ffffff;
    }

    .app-header h1 {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Scrollable body */
    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    /* Profile Header Summary */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem;
      background: var(--primary-light);
      border-radius: 1rem;
      margin-bottom: 1.5rem;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .profile-info h2 {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.125rem;
    }

    .profile-info p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Section / List */
    .section-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .info-item {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info-label {
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .edit-btn {
      background: none;
      border: none;
      color: var(--primary);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      transition: background 0.2s;
    }

    .edit-btn:hover {
      background: var(--primary-light);
    }

    .info-value {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* Bidi isolation for LTR strings inside RTL text */
    bdi[dir="ltr"] {
      unicode-bidi: isolate;
      text-align: left;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <!-- Header -->
    <header class="app-header">
      <button class="icon-btn" aria-label="رجوع">
        <svg class="icon-directional" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </button>
      <h1>الملف الشخصي</h1>
      <div style="width: 24px;"></div>
    </header>

    <!-- Content -->
    <main class="app-body">
      <!-- Profile Card Summary -->
      <div class="profile-card">
        <div class="avatar">ل</div>
        <div class="profile-info">
          <h2>ليلى المنصوري</h2>
          <p><bdi dir="ltr">layla@example.com</bdi></p>
        </div>
      </div>

      <div class="section-title">بيانات الحساب</div>

      <div class="info-list">
        <!-- Item 1: Name and Email -->
        <div class="info-item">
          <div class="info-header">
            <span class="info-label">الاسم والبريد الإلكتروني</span>
            <button class="edit-btn" aria-label="تعديل الاسم والبريد الإلكتروني">تعديل</button>
          </div>
          <div class="info-value">
            ليلى المنصوري
            <span style="display: block; font-size: 0.875rem; color: var(--text-muted); margin-top: 0.125rem;">
              <bdi dir="ltr">layla@example.com</bdi>
            </span>
          </div>
        </div>

        <!-- Item 2: Phone Number -->
        <div class="info-item">
          <div class="info-header">
            <span class="info-label">رقم الهاتف المتحرك</span>
            <button class="edit-btn" aria-label="تعديل رقم الهاتف المتحرك">تعديل</button>
          </div>
          <div class="info-value">
            <bdi dir="ltr">+971 50 123 4567</bdi>
          </div>
        </div>

        <!-- Item 3: IBAN -->
        <div class="info-item">
          <div class="info-header">
            <span class="info-label">رقم الحساب المصرفي الدولي (IBAN)</span>
            <button class="edit-btn" aria-label="تعديل رقم الحساب المصرفي الدولي">تعديل</button>
          </div>
          <div class="info-value" style="font-family: monospace; font-size: 0.95rem;">
            <bdi dir="ltr">AE07 0331 2345 6789 0123 456</bdi>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
