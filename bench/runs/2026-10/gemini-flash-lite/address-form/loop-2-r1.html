<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عنوان التوصيل - بقالة دبي</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :lang(ar) {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      letter-spacing: 0;
      text-transform: none;
      line-height: 1.7;
    }
    /* Enforce Dualkit 14px floor for Arabic UI text */
    body {
      font-size: 16px;
      background-color: #f3f4f6;
      color: #1f2937;
    }
    input, select, button {
      font-family: inherit;
    }
    /* Right-align Arabic hints in LTR inputs when placeholder is shown */
    input:placeholder-shown {
      direction: rtl;
    }
    ::placeholder {
      text-align: right;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4">

  <!-- Phone Frame Container -->
  <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[844px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-gray-200">
    
    <!-- Top Header -->
    <header class="flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-white sticky top-0 z-10">
      <button type="button" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-700 transition" aria-label="الرجوع">
        <svg class="w-6 h-6 icon-directional rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>
      <h1 class="text-lg font-bold text-gray-900">إضافة عنوان جديد</h1>
      <div class="w-10"></div> <!-- Spacer for balance -->
    </header>

    <!-- Scrollable Form Body -->
    <main class="flex-1 overflow-y-auto p-6 space-y-5 pb-24">
      
      <!-- Instructions / Context -->
      <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-emerald-900 text-sm">
        <p class="font-medium">أدخل تفاصيل موقعك بدقة لضمان توصيل سريع إلى باب منزلك في دبي.</p>
      </div>

      <form id="address-form" class="space-y-4">

        <!-- Emirate Picker -->
        <div>
          <label for="emirate" class="block text-sm font-semibold text-gray-700 mb-1.5">الإمارة</label>
          <div class="relative">
            <select id="emirate" name="emirate" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none appearance-none transition">
              <option value="Dubai" selected>دبي (Dubai)</option>
              <option value="Abu Dhabi">أبوظبي (Abu Dhabi)</option>
              <option value="Sharjah">الشارقة (Sharjah)</option>
              <option value="Ajman">عجمان (Ajman)</option>
              <option value="Umm Al Quwain">أم القيوين (Umm Al Quwain)</option>
              <option value="Ras Al Khaimah">رأس الخيمة (Ras Al Khaimah)</option>
              <option value="Fujairah">الفجيرة (Fujairah)</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 start-0 flex items-center px-4 text-gray-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>
        </div>

        <!-- Area / Community -->
        <div>
          <label for="area" class="block text-sm font-semibold text-gray-700 mb-1.5">المنطقة أو الحي</label>
          <input type="text" id="area" name="area" placeholder="مثال: دبي مارينا، البرشاء، الخليج التجاري" dir="ltr" required
            class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
        </div>

        <!-- Street -->
        <div>
          <label for="street" class="block text-sm font-semibold text-gray-700 mb-1.5">الشارع</label>
          <input type="text" id="street" name="street" placeholder="مثال: شارع الملك سلمان بن عبد العزيز آل سعود" dir="ltr" required
            class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
        </div>

        <!-- Building / Villa -->
        <div>
          <label for="building" class="block text-sm font-semibold text-gray-700 mb-1.5">رقم المبنى أو الفيلا والشقة</label>
          <input type="text" id="building" name="building" placeholder="مثال: برج الممشى، شقة رقم 402" dir="ltr" required
            class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition">
        </div>

        <!-- Makani Number -->
        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label for="makani" class="block text-sm font-semibold text-gray-700">رقم مكاني (اختياري)</label>
            <span class="text-sm text-gray-500">10 أرقام مميزة للموقع</span>
          </div>
          <input type="text" id="makani" name="makani" placeholder="30002 95831" dir="ltr" inputmode="numeric" maxlength="11"
            class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3.5 text-gray-900 placeholder-gray-400 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-start font-mono">
        </div>

        <!-- Phone Number -->
        <div>
          <label for="phone" class="block text-sm font-semibold text-gray-700 mb-1.5">رقم الهاتف المتحرك للتواصل</label>
          <div class="flex items-center bg-gray-50 border border-gray-300 rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-emerald-500 focus-within:border-emerald-500 transition">
            <span class="bg-gray-100 px-3.5 py-3.5 text-gray-600 font-medium border-e border-gray-300 text-sm select-none" dir="ltr">+971</span>
            <input type="tel" id="phone" name="phone" placeholder="50 123 4567" dir="ltr" inputmode="tel" required
              class="w-full bg-transparent px-4 py-3.5 text-gray-900 placeholder-gray-400 outline-none">
          </div>
          <p class="text-sm text-gray-500 mt-1.5">مثال: <bdi dir="ltr">050 123 4567</bdi></p>
        </div>

      </form>
    </main>

    <!-- Sticky Bottom CTA Footer -->
    <footer class="absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-gray-100 p-4 shadow-lg z-20">
      <button type="submit" form="address-form" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-semibold py-4 rounded-2xl shadow-md transition duration-200 flex items-center justify-center space-x-2 space-x-reverse">
        <span>حفظ العنوان</span>
      </button>
    </footer>

  </div>

</body>
</html>
