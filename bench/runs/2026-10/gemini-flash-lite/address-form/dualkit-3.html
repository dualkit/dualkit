<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق بقالة دبي - إضافة عنوان التوصيل</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            arabic: ['"IBM Plex Sans Arabic"', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    :root {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }
    :lang(ar) {
      letter-spacing: 0;
      text-transform: none;
      font-style: normal;
      line-height: 1.7;
    }
    /* Enforce 14px floor for UI text */
    body, input, select, button, label {
      font-size: 14px;
    }
    .body-text {
      font-size: 16px;
    }
    /* Custom scrollbar for mobile frame */
    .mobile-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .mobile-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-0 sm:p-4 font-arabic">

  <!-- Phone Container Frame -->
  <div class="w-full sm:w-[390px] h-screen sm:h-[844px] bg-slate-50 sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-8 sm:border-slate-800">
    
    <!-- Status Bar (Simulated) -->
    <div class="bg-white px-6 pt-3 pb-2 flex justify-between items-center text-xs text-slate-500 select-none shrink-0">
      <span class="font-semibold text-slate-700">09:41</span>
      <div class="flex items-center gap-1.5">
        <span>5G</span>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h15.3l-.62-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.66-.58 3.18-1.55 4.39L16.5 15.5l-1.42 1.42 1.83 1.83c-1.12.74-2.48 1.25-3.91 1.25s-2.79-.51-3.91-1.25l1.83-1.83L9.5 15.5l-2.95 2.89C5.58 15.18 5 13.66 5 12c0-3.87 3.13-7 7-7z"/></svg>
      </div>
    </div>

    <!-- App Header -->
    <header class="bg-white px-4 py-3 border-b border-slate-100 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <!-- Back button with directional icon -->
        <button type="button" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition-colors" aria-label="الرجوع">
          <svg class="w-5 h-5 rtl:-scale-x-100" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
          </svg>
        </button>
        <h1 class="font-bold text-slate-900 text-base">إضافة عنوان التوصيل</h1>
      </div>
      <!-- Language Switcher badge -->
      <button type="button" class="text-xs font-medium text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-100 hover:bg-emerald-100 transition-colors">
        English
      </button>
    </header>

    <!-- Scrollable Form Area -->
    <main class="flex-1 overflow-y-auto mobile-scroll p-4 space-y-5 pb-8">
      
      <!-- Delivery Illustration / Notice -->
      <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-3.5 flex items-start gap-3 text-emerald-900">
        <svg class="w-5 h-5 text-emerald-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
        <div>
          <p class="text-xs font-semibold leading-relaxed">نصل إليك في أسرع وقت داخل دبي</p>
          <p class="text-[11px] text-emerald-700/80 leading-normal">يرجى التأكد من دقة بيانات العنوان لضمان وصول طلب البقالة بدقة.</p>
        </div>
      </div>

      <form class="space-y-4" onsubmit="event.preventDefault();">
        
        <!-- Emirate Picker -->
        <div class="space-y-1.5">
          <label for="emirate" class="block font-semibold text-slate-700 text-xs uppercase tracking-wider">الإمارة</label>
          <div class="relative">
            <select id="emirate" name="emirate" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-3 text-slate-900 appearance-none focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all cursor-pointer">
              <option value="DU" selected>دبي (Dubai)</option>
              <option value="AUH">أبوظبي (Abu Dhabi)</option>
              <option value="SHJ">الشارقة (Sharjah)</option>
              <option value="AJM">عجمان (Ajman)</option>
              <option value="UAQ">أم القيوين (Umm Al Quwain)</option>
              <option value="RAK">رأس الخيمة (Ras Al Khaimah)</option>
              <option value="FUJ">الفجيرة (Fujairah)</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 start-0 flex items-center px-3 text-slate-500">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>
        </div>

        <!-- Area / District -->
        <div class="space-y-1.5">
          <label for="area" class="block font-semibold text-slate-700 text-xs uppercase tracking-wider">المنطقة</label>
          <input type="text" id="area" name="area" dir="auto" placeholder="مثال: دبي مارينا، البرشاء، ديرة" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all">
        </div>

        <!-- Street -->
        <div class="space-y-1.5">
          <label for="street" class="block font-semibold text-slate-700 text-xs uppercase tracking-wider">الشارع</label>
          <input type="text" id="street" name="street" dir="auto" placeholder="مثال: شارع الملك سلمان، شارع المرقبات" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all">
        </div>

        <!-- Building or Villa -->
        <div class="space-y-1.5">
          <label for="building" class="block font-semibold text-slate-700 text-xs uppercase tracking-wider">رقم المبنى أو الفيلا</label>
          <input type="text" id="building" name="building" dir="auto" placeholder="مثال: برج مارينا ديموند 5، أو فيلا رقم 12" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all">
        </div>

        <!-- Makani Number -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <label for="makani" class="block font-semibold text-slate-700 text-xs uppercase tracking-wider">رقم مكاني (اختياري)</label>
            <span class="text-[11px] text-slate-400">10 أرقام مكانية</span>
          </div>
          <div dir="ltr">
            <input type="text" id="makani" name="makani" inputmode="numeric" placeholder="30492 88123" maxlength="11" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all text-right">
          </div>
          <p class="text-[11px] text-slate-500 leading-normal">رقم مكاني يساعد السائق في الوصول لباب منزلك مباشرة.</p>
        </div>

        <!-- Phone Number Field -->
        <div class="space-y-1.5 pt-2 border-t border-slate-100">
          <label for="phone" class="block font-semibold text-slate-700 text-xs uppercase tracking-wider">رقم الهاتف المحمول للتواصل</label>
          <div class="flex items-center rounded-xl border border-slate-200 bg-white overflow-hidden focus-within:border-emerald-600 focus-within:ring-1 focus-within:ring-emerald-600 transition-all" dir="ltr">
            <span class="px-3 py-3 text-slate-600 bg-slate-50 border-e border-slate-200 select-none font-medium text-sm">+971</span>
            <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="050 123 4567" class="w-full px-3.5 py-3 text-slate-900 placeholder:text-slate-400 focus:outline-none text-right bg-transparent">
          </div>
          <p class="text-[11px] text-slate-500 leading-normal">سنستخدم هذا الرقم لإرسال تحديثات حالة طلب البقالة.</p>
        </div>

      </form>
    </main>

    <!-- Bottom Action Footer -->
    <footer class="bg-white px-4 py-3 border-t border-slate-100 shrink-0">
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
        <span>حفظ العنوان</span>
        <svg class="w-5 h-5 rtl:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </footer>

  </div>

</body>
</html>
