<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب - بقالة الإمارات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4">

    <!-- Phone Container -->
    <div class="w-full sm:max-w-[400px] h-screen sm:h-[844px] bg-white sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border border-gray-100">

        <!-- Top Bar -->
        <div class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-gray-100 bg-white sticky top-0 z-10">
            <button class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-700 hover:bg-gray-100 transition-colors">
                <!-- Back Arrow (RTL oriented) -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
            <h1 class="text-lg font-bold text-gray-800">إتمام الطلب</h1>
            <div class="w-10"></div> <!-- Spacer for alignment -->
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-6">

            <!-- Cart Items Section -->
            <div>
                <h2 class="text-sm font-semibold text-gray-400 mb-3">منتجات السلة (3)</h2>
                <div class="space-y-3">
                    
                    <!-- Item 1 -->
                    <div class="flex items-center gap-4 p-3 rounded-2xl bg-gray-50/80 border border-gray-100">
                        <div class="w-16 h-16 rounded-xl bg-emerald-50 flex items-center justify-center text-2xl shrink-0">
                            🥛
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-gray-800 text-sm truncate">حليب المراعي كامل الدسم</h3>
                            <p class="text-xs text-gray-400 mt-0.5">1 لتر</p>
                            <span class="text-emerald-600 font-bold text-sm mt-1 block">6.75 د.إ</span>
                        </div>
                        <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-lg p-1 shadow-xs">
                            <button class="w-6 h-6 rounded bg-gray-100 text-gray-600 flex items-center justify-center font-bold hover:bg-gray-200">-</button>
                            <span class="text-xs font-bold text-gray-800 w-4 text-center">1</span>
                            <button class="w-6 h-6 rounded bg-emerald-600 text-white flex items-center justify-center font-bold hover:bg-emerald-700">+</button>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="flex items-center gap-4 p-3 rounded-2xl bg-gray-50/80 border border-gray-100">
                        <div class="w-16 h-16 rounded-xl bg-amber-50 flex items-center justify-center text-2xl shrink-0">
                            🍞
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-gray-800 text-sm truncate">خبز عربي طازج</h3>
                            <p class="text-xs text-gray-400 mt-0.5">كيس متوسط</p>
                            <span class="text-emerald-600 font-bold text-sm mt-1 block">3.50 د.إ</span>
                        </div>
                        <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-lg p-1 shadow-xs">
                            <button class="w-6 h-6 rounded bg-gray-100 text-gray-600 flex items-center justify-center font-bold hover:bg-gray-200">-</button>
                            <span class="text-xs font-bold text-gray-800 w-4 text-center">2</span>
                            <button class="w-6 h-6 rounded bg-emerald-600 text-white flex items-center justify-center font-bold hover:bg-emerald-700">+</button>
                        </div>
                    </div>

                    <!-- Item 3 -->
                    <div class="flex items-center gap-4 p-3 rounded-2xl bg-gray-50/80 border border-gray-100">
                        <div class="w-16 h-16 rounded-xl bg-red-50 flex items-center justify-center text-2xl shrink-0">
                            🍅
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-gray-800 text-sm truncate">طماطم طازجة محلية</h3>
                            <p class="text-xs text-gray-400 mt-0.5">1 كيلو</p>
                            <span class="text-emerald-600 font-bold text-sm mt-1 block">8.00 د.إ</span>
                        </div>
                        <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-lg p-1 shadow-xs">
                            <button class="w-6 h-6 rounded bg-gray-100 text-gray-600 flex items-center justify-center font-bold hover:bg-gray-200">-</button>
                            <span class="text-xs font-bold text-gray-800 w-4 text-center">1</span>
                            <button class="w-6 h-6 rounded bg-emerald-600 text-white flex items-center justify-center font-bold hover:bg-emerald-700">+</button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Promo Code Section -->
            <div>
                <div class="flex gap-2">
                    <input type="text" placeholder="أدخل كود الخصم (اختر UAE50)" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-600 transition-colors">
                    <button class="bg-gray-900 text-white px-5 rounded-xl text-sm font-bold hover:bg-gray-800 transition-colors">تطبيق</button>
                </div>
            </div>

            <!-- Cost Breakdown -->
            <div class="bg-gray-50 rounded-2xl p-4 space-y-3 border border-gray-100 text-sm">
                <div class="flex justify-between text-gray-600">
                    <span>المجموع الفرعي</span>
                    <span class="font-semibold text-gray-800">18.25 د.إ</span>
                </div>
                <div class="flex justify-between text-gray-600">
                    <span>رسوم التوصيل</span>
                    <span class="font-semibold text-gray-800">5.00 د.إ</span>
                </div>
                <div class="flex justify-between text-gray-600">
                    <span>ضريبة القيمة المضافة (5%)</span>
                    <span class="font-semibold text-gray-800">1.16 د.إ</span>
                </div>
                <div class="border-t border-gray-200 pt-3 flex justify-between text-base font-bold text-gray-900">
                    <span>المجموع الكلي</span>
                    <span class="text-emerald-600">24.41 د.إ</span>
                </div>
            </div>

        </div>

        <!-- Footer / Place Order Button -->
        <div class="p-6 bg-white border-t border-gray-100">
            <button class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold text-base shadow-lg shadow-emerald-600/30 hover:bg-emerald-700 active:scale-[0.99] transition-all">
                إتمام الطلب
            </button>
        </div>

    </div>

</body>
</html>
