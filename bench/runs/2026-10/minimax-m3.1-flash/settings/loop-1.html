<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <title>الإعدادات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #748094;
      --primary: #176b5b;
      --primary-soft: #e7f4f0;
      --border: #e8ecf1;
      --danger: #c94b50;
      --shadow: 0 10px 35px rgba(29, 44, 65, 0.08);
      --type-label-size: 14px;
      --type-caption-size: 14px;
      --type-body-size: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: #dfe5ec;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: var(--type-body-size);
      line-height: 1.7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
      min-height: 68px;
      padding: 8px 14px;
      border-bottom: 1px solid rgba(232, 236, 241, 0.86);
      background: rgba(246, 248, 251, 0.92);
      backdrop-filter: blur(16px);
    }

    .icon-button {
      display: grid;
      width: 42px;
      height: 42px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
    }

    .icon-button:hover {
      background: #e9edf2;
    }

    .topbar h1 {
      margin: 0;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
    }

    .profile {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 18px 16px 22px;
    }

    .profile-mark {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      box-shadow: 0 8px 18px rgba(23, 107, 91, 0.22);
    }

    .profile-copy {
      min-width: 0;
    }

    .profile-copy h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .profile-copy p {
      margin: 0;
      color: var(--muted);
      font-size: var(--type-caption-size);
    }

    main {
      padding: 0 12px;
    }

    .group {
      margin-bottom: 22px;
    }

    .group-title {
      margin: 0 10px 8px;
      color: var(--muted);
      font-size: var(--type-label-size);
      font-weight: 600;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(226, 231, 237, 0.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .row {
      display: flex;
      min-height: 72px;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-icon {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .row-icon.blue {
      background: #eaf1fb;
      color: #376da8;
    }

    .row-icon.gold {
      background: #fff4d9;
      color: #9b6b08;
    }

    .row-content {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      display: block;
      font-size: 15px;
      font-weight: 600;
    }

    .row-value {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-size: var(--type-caption-size);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chevron {
      flex: 0 0 auto;
      color: #9aa4b2;
    }

    .link-row {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: start;
      cursor: pointer;
    }

    .link-row:active {
      background: #f7f9fb;
    }

    .toggle-row {
      cursor: pointer;
    }

    .toggle-row:active {
      background: #f7f9fb;
    }

    .switch {
      position: relative;
      flex: 0 0 50px;
      width: 50px;
      height: 30px;
    }

    .switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .switch-track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #cfd5dd;
      transition: background 180ms ease;
    }

    .switch-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 6px rgba(20, 32, 47, 0.25);
      content: "";
      transition: transform 180ms ease;
    }

    .switch input:checked + .switch-track {
      background: var(--primary);
    }

    .switch input:checked + .switch-track::after {
      transform: translateX(20px);
    }

    .switch input:focus-visible + .switch-track {
      outline: 3px solid rgba(23, 107, 91, 0.25);
      outline-offset: 2px;
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 10px 8px 0;
      color: var(--muted);
      font-size: var(--type-caption-size);
      line-height: 1.6;
    }

    .security-note svg {
      flex: 0 0 auto;
      margin-top: 2px;
      color: var(--primary);
    }

    @media (min-width: 461px) {
      body {
        padding: 24px 0;
      }

      .app {
        min-height: calc(100vh - 48px);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(34, 48, 65, 0.18);
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="رجوع">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>الإعدادات</h1>
      <span aria-hidden="true"></span>
    </header>

    <section class="profile" aria-label="ملخص الحساب">
      <div class="profile-mark" aria-hidden="true">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none">
          <path d="M4 9.5h16v10H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M7 9.5V7a5 5 0 0110 0v2.5M4 14h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="profile-copy">
        <h2>حساب أحمد خالد</h2>
        <p>العميل المميز</p>
      </div>
    </section>

    <main>
      <section class="group" aria-labelledby="account-heading">
        <h2 class="group-title" id="account-heading">الحساب</h2>
        <div class="card">
          <button class="row link-row" type="button">
            <span class="row-icon" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M4.5 20c.6-4 3.1-6 7.5-6s6.9 2 7.5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">الاسم</span>
              <span class="row-value">أحمد خالد</span>
            </span>
            <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="row link-row" type="button">
            <span class="row-icon blue" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M7.2 3.5l2.1-1 2 3.5-1.6 1.4a14 14 0 005.9 5.9l1.4-1.6 3.5 2-1 2.1c-.6 1.2-1.9 1.8-3.2 1.5C9.9 15.5 5.5 11.1 3.7 4.7c-.3-1.3.3-2.6 1.5-3.2l2-2z" transform="translate(2 3)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">رقم الهاتف</span>
              <span class="row-value" dir="ltr">+973 3600 1234</span>
            </span>
            <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="row link-row" type="button">
            <span class="row-icon gold" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                <path d="M3.5 12h17M12 3c2.3 2.5 3.5 5.5 3.5 9S14.3 18.5 12 21c-2.3-2.5-3.5-5.5-3.5-9S9.7 5.5 12 3z" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">اللغة</span>
              <span class="row-value">العربية</span>
            </span>
            <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>

      <section class="group" aria-labelledby="security-heading">
        <h2 class="group-title" id="security-heading">الأمان</h2>
        <div class="card">
          <label class="row toggle-row">
            <span class="row-icon" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M7 10V8a5 5 0 0110 0v2M5 10h14v10H5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M9.5 10v10M14.5 10v10M5 15h14" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="15" r="1" fill="currentColor"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">بصمة الوجه</span>
              <span class="row-value">تسجيل الدخول باستخدام بصمة الوجه</span>
            </span>
            <span class="switch">
              <input type="checkbox" checked aria-label="تفعيل بصمة الوجه">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="row toggle-row">
            <span class="row-icon blue" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M12 3l7 3v5c0 4.5-2.8 8.2-7 10-4.2-1.8-7-5.5-7-10V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">تسجيل الدخول بخطوتين</span>
              <span class="row-value">رمز إضافي عند تسجيل الدخول</span>
            </span>
            <span class="switch">
              <input type="checkbox" checked aria-label="تفعيل تسجيل الدخول بخطوتين">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
        <div class="security-note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 10v6M12 7.2v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>حافظ على سرية رمز التحقق وعدم مشاركته مع أي شخص.</span>
        </div>
      </section>

      <section class="group" aria-labelledby="notifications-heading">
        <h2 class="group-title" id="notifications-heading">الإشعارات</h2>
        <div class="card">
          <label class="row toggle-row">
            <span class="row-icon" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M4 7h13M14 4l3 3-3 3M20 17H7M10 14l-3 3 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">التحويلات</span>
              <span class="row-value">إشعارات بالتحويلات الصادرة والواردة</span>
            </span>
            <span class="switch">
              <input type="checkbox" checked aria-label="تفعيل إشعارات التحويلات">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="row toggle-row">
            <span class="row-icon gold" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M20 13l-7 1-3 6-2-8-6-2 7-1 3-6 2 8 6 2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">العروض</span>
              <span class="row-value">العروض والمنتجات المتاحة لعملائك</span>
            </span>
            <span class="switch">
              <input type="checkbox" checked aria-label="تفعيل إشعارات العروض">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>

          <label class="row toggle-row">
            <span class="row-icon blue" aria-hidden="true">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M6 3h9l4 4v14H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M15 3v5h4M9 12h6M9 16h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="row-content">
              <span class="row-title">كشوف الحساب</span>
              <span class="row-value">إشعار عند إصدار كشف حساب جديد</span>
            </span>
            <span class="switch">
              <input type="checkbox" checked aria-label="تفعيل إشعارات كشوف الحساب">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
          </label>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
