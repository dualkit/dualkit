<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#075E54">
  <title>الإعدادات</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap');

    :root {
      --primary: #075E54;
      --primary-dark: #044B43;
      --primary-soft: #E7F4F1;
      --gold: #C89B3C;
      --text: #172321;
      --muted: #75807D;
      --line: #E8ECEA;
      --surface: #FFFFFF;
      --background: #F4F7F6;
      --danger: #D84B4B;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: "Noto Kufi Arabic", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--background);
      position: relative;
      overflow: hidden;
    }

    .status-bar {
      height: 32px;
      padding: 8px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 700;
      direction: ltr;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
    }

    .signal i {
      display: block;
      width: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 6px; }
    .signal i:nth-child(3) { height: 8px; }
    .signal i:nth-child(4) { height: 10px; }

    .battery {
      width: 18px;
      height: 9px;
      border: 1.5px solid currentColor;
      border-radius: 2px;
      padding: 1px;
      position: relative;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 3px;
      border-radius: 0 1px 1px 0;
      background: currentColor;
    }

    .battery span {
      display: block;
      width: 75%;
      height: 100%;
      border-radius: 1px;
      background: currentColor;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 8px 20px 25px;
      position: relative;
    }

    .header::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 22px;
      background: var(--background);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      transform: translateY(58%);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      position: relative;
      z-index: 1;
    }

    .back-button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 13px;
      color: white;
      background: rgba(255, 255, 255, 0.12);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .back-button:active {
      transform: scale(0.95);
    }

    .header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .header-spacer {
      width: 40px;
    }

    .main {
      padding: 24px 16px 38px;
      position: relative;
      z-index: 2;
    }

    .group {
      margin-bottom: 18px;
    }

    .group-title {
      margin: 0 4px 9px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(7, 94, 84, 0.07);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(20, 55, 50, 0.055);
      overflow: hidden;
    }

    .row {
      width: 100%;
      min-height: 72px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      text-align: right;
    }

    .row:last-child {
      border-bottom: 0;
    }

    button.row {
      cursor: pointer;
    }

    button.row:active {
      background: #F5F9F8;
    }

    .icon {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .icon.gold {
      color: #9A6B12;
      background: #FFF5DF;
    }

    .icon svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .row-content {
      min-width: 0;
      flex: 1;
    }

    .row-title {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .row-value {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chevron {
      flex: 0 0 auto;
      width: 19px;
      color: #A3ADAA;
    }

    .chevron svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .switch {
      flex: 0 0 auto;
      width: 48px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #D6DEDC;
      position: relative;
      cursor: pointer;
      transition: background 180ms ease;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      right: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 180ms ease;
    }

    .switch[aria-checked="true"] {
      background: var(--primary);
    }

    .switch[aria-checked="true"]::after {
      transform: translateX(-20px);
    }

    .switch:focus-visible,
    button.row:focus-visible {
      outline: 3px solid rgba(200, 155, 60, 0.42);
      outline-offset: -3px;
    }

    .version {
      margin: 24px 0 0;
      text-align: center;
      color: #94A09D;
      font-size: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 20px);
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 11px 18px;
      border-radius: 12px;
      background: #173B36;
      color: white;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      opacity: 0;
      pointer-events: none;
      transition: .2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 360px) {
      .main { padding-inline: 12px; }
      .row { gap: 9px; padding-inline: 12px; }
      .icon { flex-basis: 38px; width: 38px; height: 38px; }
      .row-title { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="status-bar" aria-label="حالة الهاتف">
      <span dir="rtl">٩:٤١ ص</span>
      <div class="status-icons" aria-hidden="true">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M1 5.5a10 10 0 0 1 14 0M3.5 8a6.7 6.7 0 0 1 9 0M6 10.5a3.3 3.3 0 0 1 4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="8" cy="13" r=".8" fill="currentColor"/>
        </svg>
        <span class="battery"><span></span></span>
      </div>
    </div>

    <header class="header">
      <div class="nav">
        <button class="back-button" type="button" aria-label="رجوع" onclick="showToast('العودة إلى الصفحة الرئيسية')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1>الإعدادات</h1>
        <span class="header-spacer"></span>
      </div>
    </header>

    <main class="main">
      <section class="group" aria-labelledby="account-title">
        <h2 class="group-title" id="account-title">الحساب</h2>
        <div class="card">
          <button class="row" type="button" onclick="showToast('الصفحة الشخصية')">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">الاسم</span>
              <span class="row-value">محمد عبدالله.bar</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </span>
          </button>

          <button class="row" type="button" onclick="showToast('تعديل رقم الهاتف')">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8.2 3.5 10 7.2 7.7 9a15.7 15.7 0 0 0 7.3 7.3l1.8-2.3 3.7 1.8-.9 3.3c-.2.8-1 1.4-1.8 1.3C9.7 19.5 4.5 14.3 3.6 6.2 3.5 5.4 4.1 4.6 4.9 4.4l3.3-.9Z"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">رقم الهاتف</span>
              <span class="row-value" dir="ltr">+973 3600 1234</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </span>
          </button>

          <button class="row" type="button" onclick="showToast('اختيار اللغة')">
            <span class="icon gold" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">اللغة</span>
              <span class="row-value">العربية</span>
            </span>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </span>
          </button>
        </div>
      </section>

      <section class="group" aria-labelledby="security-title">
        <h2 class="group-title" id="security-title">الأمان</h2>
        <div class="card">
          <div class="row">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 8V6a8 8 0 0 1 16 0v2"/><rect x="3" y="8" width="18" height="13" rx="3"/><path d="M9 14a3 3 0 0 1 6 0v3H9v-3Z"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">Face ID</span>
              <span class="row-value">فتح سريع وآمن للتطبيق</span>
            </span>
            <button class="switch" type="button" role="switch" aria-checked="true" aria-label="Face ID" onclick="toggleSwitch(this, 'تم تفعيل Face ID')"></button>
          </div>

          <div class="row">
            <span class="icon gold" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2 4.5 5v5.5c0 4.8 3.1 9.1 7.5 11.5 4.4-2.4 7.5-6.7 7.5-11.5V5L12 2Z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">تسجيل الدخول بخطوتين</span>
              <span class="row-value">رمز إضافي عند تسجيل الدخول</span>
            </span>
            <button class="switch" type="button" role="switch" aria-checked="true" aria-label="تسجيل الدخول بخطوتين" onclick="toggleSwitch(this, 'تم تحديث تسجيل الدخول بخطوتين')"></button>
          </div>
        </div>
      </section>

      <section class="group" aria-labelledby="notifications-title">
        <h2 class="group-title" id="notifications-title">الإشعارات</h2>
        <div class="card">
          <div class="row">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 8h13a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H4a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3Z"/><path d="m17 9 4-3v12l-4-3M15 13h3"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">التحويلات</span>
              <span class="row-value">إشعارات التحويلات المالية</span>
            </span>
            <button class="switch" type="button" role="switch" aria-checked="true" aria-label="إشعارات التحويلات" onclick="toggleSwitch(this, 'تم تحديث إشعارات التحويلات')"></button>
          </div>

          <div class="row">
            <span class="icon gold" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 13 10.5 3.5 3 5l1.5 7.5L14 21l6-8Z"/><circle cx="7" cy="9" r="1"/><path d="m13 15 4-4"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">العروض</span>
              <span class="row-value">العروض والوجهات والعروض الخاصة</span>
            </span>
            <button class="switch" type="button" role="switch" aria-checked="false" aria-label="إشعارات العروض" onclick="toggleSwitch(this, 'تم تحديث إشعارات العروض')"></button>
          </div>

          <div class="row">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M8 12h7M8 16h7"/></svg>
            </span>
            <span class="row-content">
              <span class="row-title">كشوف الحساب</span>
              <span class="row-value">إشعارات كشوف الحساب الجديدة</span>
            </span>
            <button class="switch" type="button" role="switch" aria-checked="true" aria-label="إشعارات كشوف الحساب" onclick="toggleSwitch(this, 'تم تحديث إشعارات كشوف الحساب')"></button>
          </div>
        </div>
      </section>

      <p class="version">البنك الوطني Bahrain National Bank · الإصدار 3.2.1</p>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    let toastTimer;

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function toggleSwitch(button, message) {
      const enabled = button.getAttribute('aria-checked') === 'true';
      button.setAttribute('aria-checked', String(!enabled));
      showToast(message);
    }
  </script>
</body>
</html>
