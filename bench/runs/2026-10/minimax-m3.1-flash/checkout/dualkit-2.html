<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إتمام الطلب</title>
  <style>
    :root {
      --green: #087f5b;
      --green-dark: #066347;
      --green-soft: #eaf7f1;
      --orange: #f59f00;
      --ink: #17221e;
      --muted: #68746f;
      --line: #e5ebe8;
      --surface: #ffffff;
      --background: #f5f7f6;
      --danger: #c92a2a;
      --label-size: 14px;
      --body-size: 16px;
      font-family: "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--background);
      font-size: var(--body-size);
      line-height: 1.7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin-inline: auto;
      background: var(--background);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: 68px;
      padding: max(10px, env(safe-area-inset-top)) 16px 10px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.4;
      text-align: center;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 14px;
    }

    .icon-button:active {
      background: var(--green-soft);
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
    }

    .back-button {
      justify-self: start;
    }

    .content {
      padding: 18px 16px calc(132px + env(safe-area-inset-bottom));
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.5;
    }

    .items {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(30, 67, 52, 0.05);
    }

    .item {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
    }

    .item + .item {
      border-top: 1px solid var(--line);
    }

    .photo {
      position: relative;
      display: grid;
      width: 76px;
      height: 76px;
      overflow: hidden;
      place-items: center;
      background:
        radial-gradient(circle at 72% 24%, rgba(255, 255, 255, 0.72) 0 9%, transparent 10%),
        linear-gradient(145deg, #f2d9a8, #d99a55 52%, #6f8d56);
      border-radius: 16px;
    }

    .photo.milk {
      background:
        linear-gradient(90deg, transparent 39%, rgba(255,255,255,.6) 40% 60%, transparent 61%),
        linear-gradient(145deg, #edf5ff, #a9c9e8);
    }

    .photo.apples {
      background:
        radial-gradient(circle at 34% 60%, #a72e2e 0 17%, transparent 18%),
        radial-gradient(circle at 58% 46%, #cc3830 0 19%, transparent 20%),
        radial-gradient(circle at 70% 68%, #8d201f 0 16%, transparent 17%),
        linear-gradient(145deg, #e7f2d3, #91b56b);
    }

    .photo.bread {
      background:
        repeating-linear-gradient(35deg, rgba(107,61,23,.18) 0 5px, transparent 5px 12px),
        linear-gradient(145deg, #f2cf91, #bf813b);
    }

    .photo-icon {
      width: 38px;
      height: 38px;
      color: rgba(40, 52, 44, 0.72);
      filter: drop-shadow(0 2px 2px rgba(255,255,255,.3));
    }

    .item-details {
      min-width: 0;
    }

    .item-name {
      margin: 0 0 7px;
      overflow: hidden;
      font-size: 16px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-unit {
      margin: 0;
      color: var(--muted);
      font-size: var(--label-size);
    }

    .stepper {
      display: grid;
      grid-template-columns: 34px 34px 34px;
      align-items: center;
      width: max-content;
      margin-top: 9px;
      overflow: hidden;
      background: var(--background);
      border: 1px solid var(--line);
      border-radius: 11px;
    }

    .stepper button {
      display: grid;
      width: 34px;
      height: 32px;
      padding: 0;
      place-items: center;
      color: var(--green-dark);
      background: transparent;
      border: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1;
    }

    .stepper button:active {
      background: var(--green-soft);
    }

    .quantity {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .price {
      align-self: start;
      padding-top: 3px;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .panel {
      margin-top: 16px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(30, 67, 52, 0.04);
    }

    .promo-label {
      display: block;
      margin-bottom: 9px;
      font-size: var(--label-size);
      font-weight: 700;
    }

    .promo-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .promo-input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 0 14px;
      color: var(--ink);
      background: #fafbfa;
      border: 1px solid #dce3df;
      border-radius: 12px;
      outline: none;
    }

    .promo-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.12);
    }

    .apply-button {
      min-width: 78px;
      padding: 0 16px;
      color: var(--green-dark);
      background: var(--green-soft);
      border: 0;
      border-radius: 12px;
      font-weight: 700;
    }

    .promo-message {
      min-height: 24px;
      margin: 7px 2px 0;
      color: var(--green-dark);
      font-size: var(--label-size);
    }

    .summary {
      margin-top: 16px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 8px 0;
      color: #4e5d56;
      font-size: 15px;
    }

    .summary-row span:last-child {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .summary-divider {
      height: 1px;
      margin: 8px 0;
      background: var(--line);
    }

    .summary-row.total {
      align-items: baseline;
      padding-top: 14px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 800;
    }

    .total-value {
      color: var(--green-dark);
      font-size: 20px;
      font-variant-numeric: tabular-nums;
    }

    .order-bar {
      position: fixed;
      z-index: 20;
      inset-inline: 0;
      bottom: 0;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(255, 255, 255, 0.97);
      border-top: 1px solid var(--line);
      box-shadow: 0 -8px 24px rgba(28, 54, 43, 0.06);
      backdrop-filter: blur(12px);
    }

    .order-bar-inner {
      width: 100%;
      max-width: 448px;
      margin-inline: auto;
    }

    .order-button {
      display: flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #fff;
      background: var(--green);
      border: 0;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(8, 127, 91, 0.22);
      font-size: 17px;
      font-weight: 800;
    }

    .order-button:active {
      background: var(--green-dark);
      transform: translateY(1px);
    }

    .order-button svg {
      width: 20px;
      height: 20px;
    }

    .secure-note {
      margin: 7px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: var(--label-size);
    }

    .toast {
      position: fixed;
      z-index: 30;
      inset-inline: 24px;
      bottom: calc(110px + env(safe-area-inset-bottom));
      max-width: 420px;
      margin-inline: auto;
      padding: 12px 16px;
      color: #fff;
      background: #17221e;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 480px) {
      body {
        padding: 18px 0;
      }

      .app {
        min-height: calc(100vh - 36px);
        overflow: hidden;
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(30, 67, 52, 0.12);
      }

      .order-bar {
        inset-inline: 50%;
        width: 480px;
        transform: translateX(-50%);
      }
    }

    @media (max-width: 360px) {
      .item {
        grid-template-columns: 64px minmax(0, 1fr);
      }

      .photo {
        width: 64px;
        height: 64px;
      }

      .price {
        grid-column: 2;
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <button class="icon-button back-button" type="button" aria-label="العودة إلى السلة">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>إتمام الطلب</h1>
      <span aria-hidden="true"></span>
    </header>

    <section class="content" aria-labelledby="cart-title">
      <h2 class="section-title" id="cart-title">المنتجات</h2>

      <div class="items">
        <article class="item" data-price="8.50">
          <div class="photo milk" aria-label="صورة توضيحية لحليب طويل الأجل">
            <svg class="photo-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M16 11h16v4l4 6v20H12V21l4-6v-4Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M12 25h24M19 11h10M20 31h8v7h-8z" stroke="currentColor" stroke-width="2.5"/>
            </svg>
          </div>
          <div class="item-details">
            <h3 class="item-name">حليب طويل الأجل</h3>
            <p class="item-unit">عبوة 2.25 لتر</p>
            <div class="stepper" aria-label="كمية حليب طويل الأجل">
              <button type="button" data-action="increase" aria-label="زيادة الكمية">+</button>
              <span class="quantity" aria-live="polite">1</span>
              <button type="button" data-action="decrease" aria-label="تقليل الكمية">−</button>
            </div>
          </div>
          <div class="price"><bdi>8.50 د.إ</bdi></div>
        </article>

        <article class="item" data-price="12.75">
          <div class="photo apples" aria-label="صورة توضيحية لتفاح أحمر">
            <svg class="photo-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M24 15c-7-6-14 1-12 10 1 7 7 13 12 13s11-6 12-13c2-9-5-16-12-10Z" stroke="currentColor" stroke-width="2.5"/>
              <path d="M24 16c0-4 2-7 6-8-1 4-3 7-6 8Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="item-details">
            <h3 class="item-name">تفاح أحمر</h3>
            <p class="item-unit">1千克</p>
            <div class="stepper" aria-label="كمية التفاح الأحمر">
              <button type="button" data-action="increase" aria-label="زيادة الكمية">+</button>
              <span class="quantity" aria-live="polite">2</span>
              <button type="button" data-action="decrease" aria-label="تقليل الكمية">−</button>
            </div>
          </div>
          <div class="price"><bdi>25.50 د.إ</bdi></div>
        </article>

        <article class="item" data-price="6.25">
          <div class="photo bread" aria-label="صورة توضيحية لخبز عربي">
            <svg class="photo-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
              <path d="M8 27c0-9 7-16 16-16s16 7 16 16v10H8V27Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M15 28c3-3 6 3 9 0s6 3 9 0M13 33h22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="item-details">
            <h3 class="item-name">خبز عربي</h3>
            <p class="item-unit">5 أرغفة</p>
            <div class="stepper" aria-label="كمية الخبز العربي">
              <button type="button" data-action="increase" aria-label="زيادة الكمية">+</button>
              <span class="quantity" aria-live="polite">1</span>
              <button type="button" data-action="decrease" aria-label="تقليل الكمية">−</button>
            </div>
          </div>
          <div class="price"><bdi>6.25 د.إ</bdi></div>
        </article>
      </div>

      <div class="panel">
        <label class="promo-label" for="promo">رمز الخصم</label>
        <div class="promo-row">
          <input class="promo-input" id="promo" type="text" placeholder="أدخل الرمز" autocomplete="off" dir="auto">
          <button class="apply-button" id="apply-promo" type="button">تطبيق</button>
        </div>
        <p class="promo-message" id="promo-message" aria-live="polite"></p>
      </div>

      <section class="summary" aria-labelledby="summary-title">
        <h2 class="section-title" id="summary-title">ملخص الطلب</h2>
        <div class="summary-row">
          <span>المجموع الفرعي</span>
          <span id="subtotal">40.25 د.إ</span>
        </div>
        <div class="summary-row">
          <span>التوصيل</span>
          <span>12.00 د.إ</span>
        </div>
        <div class="summary-row">
          <span>ضريبة القيمة المضافة (5%)</span>
          <span id="vat">2.01 د.إ</span>
        </div>
        <div class="summary-divider"></div>
        <div class="summary-row total">
          <span>الإجمالي</span>
          <span class="total-value" id="total">54.26 د.إ</span>
        </div>
      </section>
    </section>

    <div class="order-bar">
      <div class="order-bar-inner">
        <button class="order-button" id="place-order" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M8 6h8l1 3h3l-2 10H6L4 9h3l1-3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="9" cy="20" r="1" fill="currentColor"/>
            <circle cx="16" cy="20" r="1" fill="currentColor"/>
          </svg>
          إتمام الطلب
        </button>
        <p class="secure-note">يتم الدفع بأمان عند التوصيل</p>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    const items = Array.from(document.querySelectorAll('.item'));
    const subtotalEl = document.getElementById('subtotal');
    const vatEl = document.getElementById('vat');
    const totalEl = document.getElementById('total');
    const toast = document.getElementById('toast');
    const delivery = 12;
    let discount = 0;
    let toastTimer;

    function formatMoney(value) {
      return value.toLocaleString('en-AE', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' د.إ';
    }

    function calculateSubtotal() {
      return items.reduce((sum, item) => {
        const quantity = Number(item.querySelector('.quantity').textContent);
        return sum + Number(item.dataset.price) * quantity;
      }, 0);
    }

    function updateSummary() {
      const subtotal = calculateSubtotal();
      const taxable = Math.max(0, subtotal - discount);
      const vat = taxable * 0.05;
      const total = taxable + delivery + vat;

      subtotalEl.textContent = formatMoney(subtotal);
      vatEl.textContent = formatMoney(vat);
      totalEl.textContent = formatMoney(total);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    items.forEach(item => {
      const quantityEl = item.querySelector('.quantity');
      const priceEl = item.querySelector('.price');
      const unitPrice = Number(item.dataset.price);

      item.querySelectorAll('.stepper button').forEach(button => {
        button.addEventListener('click', () => {
          let quantity = Number(quantityEl.textContent);
          quantity += button.dataset.action === 'increase' ? 1 : -1;
          quantity = Math.max(1, Math.min(99, quantity));
          quantityEl.textContent = quantity;
          priceEl.innerHTML = '<bdi>' + formatMoney(unitPrice * quantity) + '</bdi>';
          updateSummary();
        });
      });
    });

    document.getElementById('apply-promo').addEventListener('click', () => {
      const promo = document.getElementById('promo').value.trim().toUpperCase();
      const message = document.getElementById('promo-message');

      if (!promo) {
        discount = 0;
        message.textContent = 'أدخل رمز خصم أولًا.';
        updateSummary();
        return;
      }

      if (promo === 'GROCERY10') {
        discount = calculateSubtotal() * 0.10;
        message.textContent = 'تم تطبيق خصم 10%.';
      } else {
        discount = 0;
        message.textContent = 'رمز الخصم غير صالح.';
      }

      updateSummary();
    });

    document.getElementById('place-order').addEventListener('click', () => {
      showToast('تم إرسال طلبك للتأكيد.');
    });

    document.querySelector('.back-button').addEventListener('click', () => {
      showToast('تم الرجوع إلى السلة.');
    });
  </script>
</body>
</html>
