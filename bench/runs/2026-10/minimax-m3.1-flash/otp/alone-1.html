<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>التحقق من الرمز</title>
  <style>
    :root {
      --primary: #087f5b;
      --primary-dark: #066849;
      --text: #17211d;
      --muted: #66736e;
      --border: #d9e1de;
      --background: #f5f8f7;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      color: var(--text);
      font-family: "Tahoma", "Arial", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: var(--white);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
    }

    .back-button,
    .help-button {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 14px;
      background: #f1f5f4;
      color: var(--primary);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .help-button {
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 0 24px;
    }

    .bank-mark {
      width: 58px;
      height: 58px;
      margin-bottom: 22px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #0c956d, #057052);
      color: white;
      font-size: 29px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(8, 127, 91, 0.2);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.35;
      letter-spacing: -0.5px;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .phone-number {
      direction: ltr;
      display: inline-block;
      color: var(--text);
      font-weight: 700;
      unicode-bidi: isolate;
    }

    .code-form {
      margin-top: 34px;
    }

    .code-inputs {
      direction: ltr;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .code-inputs input {
      width: 100%;
      min-width: 0;
      aspect-ratio: 1 / 1.12;
      border: 1.5px solid var(--border);
      border-radius: 13px;
      background: #fbfcfc;
      color: var(--text);
      text-align: center;
      font: inherit;
      font-size: 24px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .code-inputs input:focus {
      border-color: var(--primary);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.12);
    }

    .countdown {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .countdown button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--primary);
      font: inherit;
      font-weight: 700;
      cursor: default;
    }

    .verify-button {
      width: 100%;
      min-height: 54px;
      margin-top: 30px;
      border: 0;
      border-radius: 15px;
      background: var(--primary);
      color: var(--white);
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(8, 127, 91, 0.18);
      transition: background 0.2s, transform 0.1s;
    }

    .verify-button:hover {
      background: var(--primary-dark);
    }

    .verify-button:active {
      transform: translateY(1px);
    }

    .verify-button:disabled {
      background: #aab8b3;
      box-shadow: none;
      cursor: not-allowed;
    }

    .security-note {
      margin: 18px 0 0;
      color: #83908b;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 360px) {
      .screen {
        padding-right: 18px;
        padding-left: 18px;
      }

      .code-inputs {
        gap: 6px;
      }

      .code-inputs input {
        border-radius: 10px;
        font-size: 21px;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="header">
      <button class="back-button" type="button" aria-label="رجوع">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="help-button" type="button" aria-label="المساعدة">؟</button>
    </header>

    <section class="content">
      <div class="bank-mark" aria-hidden="true">س</div>
      <h1>أدخل الرمز</h1>
      <p class="description">
        أرسلنا رمزًا مكونًا من 6 أرقام إلى
        <span class="phone-number">+966 55 123 4567</span>
      </p>

      <form class="code-form" id="codeForm" novalidate>
        <div class="code-inputs" id="codeInputs" dir="ltr">
          <input inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 1">
          <input inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 2">
          <input inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 3">
          <input inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 4">
          <input inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 5">
          <input inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 6">
        </div>

        <p class="countdown">
          إعادة الإرسال خلال <button type="button" id="countdown" aria-live="polite">0:45</button>
        </p>

        <button class="verify-button" id="verifyButton" type="submit" disabled>تحقق</button>
      </form>

      <p class="security-note">لا تشارك رمز التحقق مع أي شخص.</p>
    </section>
  </main>

  <script>
    const inputs = [...document.querySelectorAll("#codeInputs input")];
    const verifyButton = document.getElementById("verifyButton");
    const countdownButton = document.getElementById("countdown");
    let seconds = 45;
    let timer;

    function updateButton() {
      verifyButton.disabled = inputs.some(input => !input.value);
    }

    function moveFocus(index, direction = 1) {
      if (index < 0 || index >= inputs.length) return;
      inputs[index].focus();
      inputs[index].select();
    }

    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(-1);
        if (input.value && index < inputs.length - 1) {
          moveFocus(index + 1);
        }
        updateButton();
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          moveFocus(index - 1, -1);
        } else if (event.key === "ArrowLeft" && index < inputs.length - 1) {
          moveFocus(index + 1);
        } else if (event.key === "ArrowRight" && index > 0) {
          moveFocus(index - 1, -1);
        }
      });

      input.addEventListener("paste", event => {
        const digits = event.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
        if (digits) {
          event.preventDefault();
          inputs.forEach((field, fieldIndex) => {
            field.value = digits[fieldIndex] || "";
          });
          moveFocus(Math.min(digits.length, inputs.length - 1));
          updateButton();
        }
      });
    });

    function startCountdown() {
      clearInterval(timer);
      seconds = 45;
      countdownButton.textContent = "0:45";

      timer = setInterval(() => {
        seconds--;
        countdownButton.textContent = `0:${String(seconds).padStart(2, "0")}`;

        if (seconds <= 0) {
          clearInterval(timer);
          countdownButton.textContent = "إعادة الإرسال الآن";
          countdownButton.style.cursor = "pointer";
        }
      }, 1000);
    }

    countdownButton.addEventListener("click", () => {
      if (seconds <= 0) startCountdown();
    });

    document.getElementById("codeForm").addEventListener("submit", event => {
      event.preventDefault();
      if (!verifyButton.disabled) {
        verifyButton.textContent = "جارٍ التحقق...";
        verifyButton.disabled = true;
      }
    });

    updateButton();
    startCountdown();
    inputs[0].focus();
  </script>
</body>
</html>
