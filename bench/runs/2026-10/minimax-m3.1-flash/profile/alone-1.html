<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: #17251f;
      background: #f4f7f5;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    .header {
      padding: 22px 20px 30px;
      color: #fff;
      background: linear-gradient(135deg, #0a725d, #0b8b70);
      border-radius: 0 0 28px 28px;
      box-shadow: 0 8px 22px rgba(10, 114, 93, 0.2);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 13px;
      font-size: 23px;
      cursor: pointer;
    }

    .page-title {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      display: grid;
      width: 76px;
      height: 76px;
      place-items: center;
      color: #08745f;
      background: #e4f5ef;
      border: 4px solid rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      font-size: 27px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    .name {
      margin: 13px 0 2px;
      font-size: 22px;
      font-weight: 700;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #568277;
      font-size: 12px;
    }

    .verified::before {
      content: "✓";
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      color: #fff;
      background: #35a88d;
      border-radius: 50%;
      font-size: 10px;
    }

    .content {
      padding: 24px 18px 36px;
    }

    .section-title {
      margin: 0 4px 12px;
      color: #53645e;
      font-size: 14px;
      font-weight: 700;
    }

    .card {
      overflow: hidden;
      background: #fff;
      border: 1px solid #e5ebe8;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(24, 54, 45, 0.07);
    }

    .row {
      display: flex;
      min-height: 88px;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }

    .row + .row {
      border-top: 1px solid #edf1ef;
    }

    .icon {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      color: #08745f;
      background: #eaf6f2;
      border-radius: 13px;
    }

    .icon svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .details {
      min-width: 0;
      flex: 1;
    }

    .label {
      margin-bottom: 5px;
      color: #708079;
      font-size: 12px;
    }

    .value {
      overflow-wrap: anywhere;
      color: #17251f;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
      direction: ltr;
      text-align: right;
    }

    .value.rtl {
      direction: rtl;
      text-align: right;
    }

    .edit {
      flex: 0 0 auto;
      padding: 7px 11px;
      color: #08745f;
      background: #f0f8f5;
      border: 0;
      border-radius: 9px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .edit:active {
      transform: scale(0.96);
      background: #dff1ea;
    }

    .security-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 18px 4px 0;
      padding: 13px 14px;
      color: #5c7068;
      background: #f7faf8;
      border-radius: 13px;
      font-size: 12px;
      line-height: 1.7;
    }

    .lock {
      flex: 0 0 auto;
      margin-top: 2px;
      color: #16816a;
      font-size: 15px;
    }

    @media (min-width: 431px) {
      body {
        padding: 24px 0;
      }

      .app {
        min-height: auto;
        overflow: hidden;
        border-radius: 28px;
        box-shadow: 0 18px 55px rgba(23, 50, 41, 0.14);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="top-bar">
        <h1 class="page-title">الملف الشخصي</h1>
        <button class="back-button" type="button" aria-label="رجوع">‹</button>
      </div>

      <section class="profile" aria-label="بيانات المستخدم">
        <div class="avatar" aria-hidden="true">ل</div>
        <h2 class="name">ليلى المنصوري</h2>
        <span class="verified">حساب موثّق</span>
      </section>
    </header>

    <section class="content">
      <h3 class="section-title">معلومات الحساب</h3>

      <div class="card">
        <article class="row">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
          </div>
          <div class="details">
            <div class="label">البريد الإلكتروني</div>
            <div class="value">layla@example.com</div>
          </div>
          <button class="edit" type="button" aria-label="تعديل البريد الإلكتروني">تعديل</button>
        </article>

        <article class="row">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M7.5 3.5 10 8l-2.2 1.8a14 14 0 0 0 6.4 6.4L16 14l4.5 2.5-.8 3.2c-.3 1.2-1.4 2-2.6 2C9.2 21.7 2.3 14.8 2.3 6.9c0-1.2.8-2.3 2-2.6z"></path>
            </svg>
          </div>
          <div class="details">
            <div class="label">رقم الهاتف</div>
            <div class="value">+971 50 123 4567</div>
          </div>
          <button class="edit" type="button" aria-label="تعديل رقم الهاتف">تعديل</button>
        </article>

        <article class="row">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3"></rect>
              <path d="M3 10h18M7 15h4"></path>
            </svg>
          </div>
          <div class="details">
            <div class="label">رقم الآيبان</div>
            <div class="value">AE07 0331 2345 6789 0123 456</div>
          </div>
          <button class="edit" type="button" aria-label="تعديل رقم الآيبان">تعديل</button>
        </article>
      </div>

      <div class="security-note">
        <span class="lock" aria-hidden="true">🔒</span>
        <span>تتم حماية بياناتك وتشفيرها لضمان خصوصيتك أثناء جميع المدفوعات.</span>
      </div>
    </section>
  </main>
</body>
</html>
