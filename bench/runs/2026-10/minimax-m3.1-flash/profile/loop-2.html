<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <title>الملف الشخصي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');

    :root {
      --brand: #5b4cf0;
      --brand-dark: #4436d6;
      --brand-soft: #eeecff;
      --text: #17172b;
      --muted: #747486;
      --line: #e8e8f0;
      --surface: #ffffff;
      --background: #f6f7fb;
      --danger: #d92d4b;
      --type-label-size: 14px;
      --type-caption-size: 14px;
      --type-body-size: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font-family: "Noto Sans Arabic", sans-serif;
      font-size: var(--type-body-size);
      line-height: 1.6;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--background);
    }

    .status-bar {
      height: 34px;
      padding: 8px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .header {
      padding: 10px 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(29, 28, 55, 0.05);
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
    }

    .page-title {
      margin: 0;
      font-size: 21px;
      line-height: 1.4;
      font-weight: 700;
    }

    .profile-card {
      margin: 0 16px 18px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.22), transparent 26%),
        linear-gradient(135deg, #6557f4 0%, #4d3bdc 100%);
      box-shadow: 0 14px 30px rgba(75, 59, 211, 0.22);
    }

    .profile-card::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      inset-inline-end: -65px;
      bottom: -85px;
      border-radius: 50%;
      border: 25px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 15px;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 66px;
      height: 66px;
      flex: 0 0 66px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(8px);
    }

    .avatar svg {
      width: 38px;
      height: 38px;
    }

    .name-wrap {
      min-width: 0;
      flex: 1;
    }

    .name {
      margin: 0 0 3px;
      font-family: Arial, sans-serif;
      font-size: 20px;
      line-height: 1.4;
      font-weight: 700;
      direction: ltr;
      text-align: right;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      color: rgba(255, 255, 255, 0.84);
      font-size: 14px;
    }

    .verified svg {
      width: 15px;
      height: 15px;
    }

    .profile-email {
      margin: 18px 0 0;
      color: rgba(255, 255, 255, 0.9);
      font-family: Arial, sans-serif;
      font-size: 15px;
      direction: ltr;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .section {
      margin: 0 16px;
      padding: 6px 18px;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgba(29, 28, 55, 0.045);
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 18px 0;
    }

    .detail-row + .detail-row {
      border-top: 1px solid var(--line);
    }

    .detail-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--brand);
      background: var(--brand-soft);
    }

    .detail-icon svg {
      width: 21px;
      height: 21px;
    }

    .detail-content {
      min-width: 0;
      flex: 1;
    }

    .detail-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .detail-value {
      display: block;
      margin: 0;
      color: var(--text);
      font-size: 16px;
      line-height: 1.55;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .latin-value {
      direction: ltr;
      text-align: right;
      font-family: Arial, sans-serif;
    }

    .edit-button {
      min-width: 54px;
      padding: 7px 9px;
      border-radius: 10px;
      color: var(--brand);
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .edit-button:active {
      background: var(--brand-soft);
    }

    .account-section {
      margin-top: 18px;
    }

    .account-link {
      width: 100%;
      padding: 18px 0;
      display: flex;
      align-items: center;
      gap: 13px;
      color: var(--text);
      background: transparent;
      text-align: start;
      cursor: pointer;
    }

    .account-link + .account-link {
      border-top: 1px solid var(--line);
    }

    .account-link .detail-icon {
      color: #3171c7;
      background: #eaf3ff;
    }

    .account-link .chevron {
      width: 18px;
      height: 18px;
      margin-inline-start: auto;
      color: #aaaabb;
    }

    .account-link .chevron:dir(rtl) {
      transform: scaleX(-1);
    }

    .logout {
      width: calc(100% - 32px);
      margin: 18px 16px 0;
      padding: 13px 18px;
      border-radius: 14px;
      color: var(--danger);
      background: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .version {
      padding: 20px 0 calc(22px + env(safe-area-inset-bottom));
      color: #9a9aaa;
      font-size: 14px;
      text-align: center;
    }

    .toast {
      position: fixed;
      z-index: 10;
      inset-inline: 24px;
      bottom: 24px;
      padding: 12px 16px;
      border-radius: 13px;
      color: #fff;
      background: rgba(23, 23, 43, 0.94);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 480px) {
      .app-shell {
        box-shadow: 0 0 40px rgba(27, 27, 48, 0.08);
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="status-bar" aria-hidden="true">
      <span>9:41</span>
      <span class="status-icons">
        <svg width="15" height="12" viewBox="0 0 15 12" fill="currentColor">
          <rect x="0" y="8" width="3" height="4" rx=".7"/>
          <rect x="4" y="5" width="3" height="7" rx=".7"/>
          <rect x="8" y="2" width="3" height="10" rx=".7"/>
          <rect x="12" y="0" width="3" height="12" rx=".7"/>
        </svg>
        <svg width="14" height="11" viewBox="0 0 14 11" fill="currentColor">
          <path d="M7 9.5 1 3.7a9 9 0 0 1 12 0L7 9.5Zm-4.3-6.8A7 7 0 0 1 11.3 2.7L7 7 2.7 2.7Z"/>
        </svg>
        <svg width="22" height="10" viewBox="0 0 22 10" fill="none">
          <rect x=".5" y=".5" width="18" height="9" rx="2.5" stroke="currentColor"/>
          <rect x="2" y="2" width="14" height="6" rx="1" fill="currentColor"/>
          <path d="M20 3v4" stroke="currentColor" stroke-width="2"/>
        </svg>
      </span>
    </div>

    <header class="header">
      <button class="icon-button" type="button" aria-label="رجوع">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="page-title">الملف الشخصي</h1>
      <span style="width:42px" aria-hidden="true"></span>
    </header>

    <section class="profile-card" aria-labelledby="profile-name">
      <div class="profile-top">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="17" r="8" fill="#fff"/>
            <path d="M8.5 42c1.7-9.1 7.2-13.5 15.5-13.5S37.8 32.9 39.5 42" fill="#fff"/>
          </svg>
        </div>
        <div class="name-wrap">
          <h2 class="name" id="profile-name" dir="ltr">Layla Al Mansouri</h2>
          <p class="verified">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="m12 2 2.2 2 3-.1.7 2.9 2.6 1.4-1 2.8 1 2.8-2.6 1.4-.7 2.9-3-.1-2.2 2-2.2-2-3 .1-.7-2.9L5.5 14l1-2.8-1-2.8 2.6-1.4.7-2.9 3 .1L12 2Z" fill="currentColor"/>
              <path d="m9 12 2 2 4-4" stroke="#6557F4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>حساب موثّق</span>
          </p>
        </div>
        <button class="edit-button" type="button" data-edit="الاسم" style="color:#fff">تعديل</button>
      </div>
      <p class="profile-email" dir="ltr">layla@example.com</p>
    </section>

    <section class="section" aria-label="بيانات الحساب">
      <div class="detail-row">
        <div class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="m4.5 7 7.5 5 7.5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="detail-content">
          <span class="detail-label">البريد الإلكتروني</span>
          <bdi class="detail-value latin-value">layla@example.com</bdi>
        </div>
        <button class="edit-button" type="button" data-edit="البريد الإلكتروني">تعديل</button>
      </div>

      <div class="detail-row">
        <div class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M8.1 3.6 10 7.4 7.8 9.2a15.1 15.1 0 0 0 7 7l1.8-2.2 3.8 1.9-.9 3.1c-.2.7-.9 1.2-1.7 1.1C9.6 19.1 4.9 14.4 3.9 6.2c-.1-.8.4-1.5 1.1-1.7l3.1-.9Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="detail-content">
          <span class="detail-label">رقم الهاتف</span>
          <bdi class="detail-value latin-value">+971 50 123 4567</bdi>
        </div>
        <button class="edit-button" type="button" data-edit="رقم الهاتف">تعديل</button>
      </div>

      <div class="detail-row">
        <div class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M3 9h18M7 15h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="detail-content">
          <span class="detail-label">رقم الآيبان</span>
          <bdi class="detail-value latin-value">AE07 0331 2345 6789 0123 456</bdi>
        </div>
        <button class="edit-button" type="button" data-edit="رقم الآيبان">تعديل</button>
      </div>
    </section>

    <section class="section account-section" aria-label="إعدادات الحساب">
      <button class="account-link" type="button" data-action="إدارة الحساب">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4.5 20c.8-4.4 3.2-6.5 7.5-6.5s6.7 2.1 7.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span>إدارة الحساب</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="account-link" type="button" data-action="الأمان والخصوصية">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3 5 6v5c0 4.6 2.9 8.3 7 10 4.1-1.7 7-5.4 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>الأمان والخصوصية</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="account-link" type="button" data-action="الدعم والمساعدة">
        <span class="detail-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9.7 9a2.4 2.4 0 0 1 4.6 1c0 1.8-2.3 2-2.3 3.6M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span>الدعم والمساعدة</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <button class="logout" type="button" data-action="تسجيل الخروج">تسجيل الخروج</button>
    <p class="version">الإصدار 2.4.0</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    document.querySelectorAll("[data-edit]").forEach(button => {
      button.addEventListener("click", () => {
        showToast(`يمكنك تعديل ${button.dataset.edit}.`);
      });
    });

    document.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => {
        showToast(button.dataset.action);
      });
    });
  </script>
</body>
</html>
