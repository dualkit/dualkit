<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>الملف الشخصي</title>
  <style>
    :root {
      --background: #f7f9fc;
      --surface: #ffffff;
      --text: #172033;
      --muted: #778196;
      --primary: #2765db;
      --primary-soft: #edf4ff;
      --border: #e7ebf2;
      --success: #15956a;
      --shadow: 0 12px 35px rgba(27, 50, 90, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 90% 0%, rgba(39, 101, 219, 0.09), transparent 31rem),
        var(--background);
      font-family: "SF Arabic", "Noto Sans Arabic", Tahoma, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    button {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin-inline: auto;
      padding:
        max(18px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-button {
      display: grid;
      width: 42px;
      height: 42px;
      padding: 0;
      place-items: center;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(27, 50, 90, 0.05);
      cursor: pointer;
    }

    .back-button svg {
      width: 21px;
      height: 21px;
    }

    .back-button:dir(rtl) svg {
      transform: scaleX(-1);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .profile-summary {
      position: relative;
      overflow: hidden;
      padding: 26px 22px;
      text-align: center;
      background: linear-gradient(135deg, #2765db 0%, #1749b2 100%);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(39, 101, 219, 0.2);
    }

    .profile-summary::after {
      position: absolute;
      inset: -80px -60px auto auto;
      width: 190px;
      height: 190px;
      content: "";
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }

    .avatar {
      position: relative;
      z-index: 1;
      display: grid;
      width: 76px;
      height: 76px;
      margin: 0 auto 13px;
      place-items: center;
      color: #245fce;
      background: #ffffff;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      box-shadow: 0 10px 25px rgba(7, 31, 81, 0.2);
      font-size: 27px;
      font-weight: 700;
    }

    .profile-summary h2 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #ffffff;
      font-size: 21px;
      font-weight: 700;
    }

    .profile-summary p {
      position: relative;
      z-index: 1;
      margin: 3px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 15px;
    }

    .verification {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 5px 12px;
      color: #e9fff7;
      background: rgba(11, 125, 86, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }

    .verification svg {
      width: 17px;
      height: 17px;
    }

    .section {
      margin-top: 24px;
    }

    .section h3 {
      margin: 0 0 10px 3px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .row {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-height: 88px;
      padding: 16px;
    }

    .row + .row {
      border-top: 1px solid var(--border);
    }

    .row-icon {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 14px;
    }

    .row-icon svg {
      width: 23px;
      height: 23px;
    }

    .row-content {
      min-width: 0;
    }

    .row-label {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .row-value {
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.6;
    }

    .edit-button {
      min-width: 54px;
      min-height: 40px;
      padding: 6px 10px;
      color: var(--primary);
      background: transparent;
      border: 1px solid #cfe0ff;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .edit-button:hover {
      background: var(--primary-soft);
    }

    .edit-button:active {
      transform: scale(0.97);
    }

    .security-note {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 18px;
      padding: 14px 16px;
      color: #5e6a7d;
      background: #eef2f7;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.7;
    }

    .security-note svg {
      flex: 0 0 auto;
      width: 20px;
      height: 20px;
      margin-top: 2px;
      color: var(--success);
    }

    [dir="ltr"] {
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 360px) {
      .page {
        padding-inline: 14px;
      }

      .row {
        grid-template-columns: 42px minmax(0, 1fr) auto;
        gap: 9px;
        padding: 14px 12px;
      }

      .row-icon {
        width: 42px;
        height: 42px;
      }

      .edit-button {
        min-width: 48px;
        padding-inline: 8px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="العودة إلى الصفحة السابقة">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>الملف الشخصي</h1>
      <span aria-hidden="true" style="width:42px"></span>
    </header>

    <section class="profile-summary" aria-labelledby="profile-name">
      <div class="avatar" aria-hidden="true">ل</div>
      <h2 id="profile-name">ليلى المنصوري</h2>
      <p><bdi dir="ltr">layla@example.com</bdi></p>
      <span class="verification">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3l7 3v5c0 4.5-2.9 8.2-7 10-4.1-1.8-7-5.5-7-10V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M8.7 12l2.1 2.1 4.5-4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        الحساب موثّق
      </span>
    </section>

    <section class="section" aria-labelledby="personal-details-title">
      <h3 id="personal-details-title">البيانات الشخصية</h3>
      <div class="card">
        <article class="row">
          <div class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="row-content">
            <div class="row-label">الاسم والبريد الإلكتروني</div>
            <div class="row-value">ليلى المنصوري</div>
            <div class="row-value" style="font-weight:400;color:#5f6b7d">
              <bdi dir="ltr">layla@example.com</bdi>
            </div>
          </div>
          <button class="edit-button" type="button" aria-label="تعديل الاسم والبريد الإلكتروني">تعديل</button>
        </article>

        <article class="row">
          <div class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M7.2 3.5l2.1 4.2-2 1.6a15.2 15.2 0 0 0 7.4 7.4l1.6-2 4.2 2.1-.7 3.2c-.2 1-1.1 1.7-2.1 1.7C9.7 20.7 3.3 14.3 3.3 6.3c0-1 .7-1.9 1.7-2.1l2.2-.7z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="row-content">
            <div class="row-label">رقم الهاتف</div>
            <div class="row-value"><bdi dir="ltr">+971 50 123 4567</bdi></div>
          </div>
          <button class="edit-button" type="button" aria-label="تعديل رقم الهاتف">تعديل</button>
        </article>

        <article class="row">
          <div class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 9h18M7 15h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="row-content">
            <div class="row-label">رقم الآيبان</div>
            <div class="row-value"><bdi dir="ltr">AE07 0331 2345 6789 0123 456</bdi></div>
          </div>
          <button class="edit-button" type="button" aria-label="تعديل رقم الآيبان">تعديل</button>
        </article>
      </div>
    </section>

    <aside class="security-note">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7 10V8a5 5 0 0 1 10 0v2M6 10h12v10H6V10z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>تُحفظ بياناتك بشكل آمن، ويمكنك تحديثها في أي وقت.</span>
    </aside>
  </main>
</body>
</html>
