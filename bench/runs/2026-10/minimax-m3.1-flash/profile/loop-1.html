<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fc">
  <title>الملف الشخصي</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');

    :root {
      --brand: #4f46e5;
      --brand-dark: #3730a3;
      --brand-soft: #eef2ff;
      --text: #172033;
      --muted: #697386;
      --line: #e7e9f1;
      --surface: #ffffff;
      --background: #f7f8fc;
      --danger: #dc2626;
      --label-size: 14px;
      --body-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(79, 70, 229, 0.1), transparent 30rem),
        var(--background);
      font-family: "Noto Sans Arabic", Arial, sans-serif;
      font-size: var(--body-size);
      line-height: 1.7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin-inline: auto;
      background: var(--background);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: max(20px, env(safe-area-inset-top)) 20px 14px;
      background: rgba(247, 248, 252, 0.9);
      border-bottom: 1px solid rgba(231, 233, 241, 0.8);
      backdrop-filter: blur(16px);
    }

    .back-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(23, 32, 51, 0.05);
    }

    .back-button svg {
      width: 21px;
      height: 21px;
    }

    .topbar h1 {
      flex: 1;
      margin: 0;
      font-size: 21px;
      font-weight: 700;
      text-align: center;
    }

    .help-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      color: var(--brand);
      background: var(--brand-soft);
      border: 0;
      border-radius: 14px;
      cursor: pointer;
    }

    .help-button svg {
      width: 21px;
      height: 21px;
    }

    main {
      padding: 24px 18px calc(32px + env(safe-area-inset-bottom));
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      margin-bottom: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 14px 36px rgba(23, 32, 51, 0.07);
    }

    .avatar {
      position: relative;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      color: white;
      background: linear-gradient(145deg, #6366f1, #4338ca);
      border-radius: 21px;
      box-shadow: 0 9px 20px rgba(79, 70, 229, 0.25);
      font-size: 24px;
      font-weight: 700;
    }

    .avatar::after {
      content: "";
      position: absolute;
      inset-inline-end: -2px;
      inset-block-end: -2px;
      width: 17px;
      height: 17px;
      background: #22c55e;
      border: 3px solid white;
      border-radius: 50%;
    }

    .profile-info {
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      margin: 0 0 3px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.45;
    }

    .profile-email {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .section-title {
      margin: 0 4px 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .details-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(23, 32, 51, 0.05);
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 82px;
      padding: 14px 16px;
    }

    .detail-row + .detail-row {
      border-top: 1px solid var(--line);
    }

    .row-icon {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 14px;
    }

    .row-icon svg {
      width: 20px;
      height: 20px;
    }

    .row-content {
      flex: 1;
      min-width: 0;
    }

    .row-label {
      display: block;
      margin-bottom: 1px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .row-value {
      display: block;
      overflow-wrap: anywhere;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.65;
    }

    .row-value.ltr {
      direction: ltr;
      text-align: right;
      unicode-bidi: isolate;
      font-variant-numeric: tabular-nums;
    }

    .edit-button {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 7px 14px;
      color: var(--brand);
      background: transparent;
      border: 1px solid #d9ddfb;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .edit-button:hover,
    .edit-button:focus-visible {
      background: var(--brand-soft);
      border-color: #bcc2f7;
      outline: none;
    }

    .edit-button:active {
      transform: scale(0.97);
    }

    .security-note {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin-top: 18px;
      padding: 15px 16px;
      color: #465168;
      background: #eef7f4;
      border: 1px solid #d6ebe4;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.7;
    }

    .security-note svg {
      flex: 0 0 auto;
      width: 21px;
      height: 21px;
      margin-top: 2px;
      color: #15805d;
    }

    .security-note p {
      margin: 0;
    }

    .logout-button {
      width: 100%;
      min-height: 50px;
      margin-top: 24px;
      color: var(--danger);
      background: transparent;
      border: 1px solid #f0cccc;
      border-radius: 15px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .logout-button:hover,
    .logout-button:focus-visible {
      background: #fff4f4;
      outline: none;
    }

    .dialog-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      background: rgba(15, 23, 42, 0.44);
      backdrop-filter: blur(3px);
    }

    .dialog-backdrop.open {
      display: flex;
    }

    .dialog {
      width: min(100%, 394px);
      padding: 22px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.25);
      animation: rise 0.2s ease-out;
    }

    .dialog h2 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .dialog p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .dialog input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      color: var(--text);
      background: #f8f9fc;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
    }

    .dialog input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.11);
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog-actions button {
      flex: 1;
      min-height: 46px;
      border-radius: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .cancel-button {
      color: var(--text);
      background: white;
      border: 1px solid var(--line);
    }

    .save-button {
      color: white;
      background: var(--brand);
      border: 1px solid var(--brand);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 360px) {
      main {
        padding-inline: 12px;
      }

      .profile-card {
        padding: 16px;
      }

      .detail-row {
        padding-inline: 12px;
      }

      .row-icon {
        width: 38px;
        height: 38px;
      }

      .edit-button {
        padding-inline: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="back-button" type="button" aria-label="رجوع">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>الملف الشخصي</h1>
      <button class="help-button" type="button" aria-label="مركز المساعدة">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M9.8 9a2.3 2.3 0 1 1 3.5 2c-.8.45-1.3.95-1.3 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="17" r="1" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="profile-card" aria-label="بيانات الملف الشخصي">
        <div class="avatar" aria-hidden="true">ل</div>
        <div class="profile-info">
          <h2 class="profile-name" dir="auto">Layla Al Mansouri</h2>
          <p class="profile-email" dir="ltr">layla@example.com</p>
        </div>
        <button class="edit-button" type="button" data-edit="profile" aria-label="تعديل الاسم والبريد الإلكتروني">تعديل</button>
      </section>

      <h2 class="section-title">بيانات الحساب</h2>

      <section class="details-card" aria-label="بيانات الاتصال والحساب البنكي">
        <div class="detail-row">
          <div class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M7.4 3.5 9.7 8 7.8 9.9c1.2 2.6 3.7 5.1 6.3 6.3l1.9-1.9 4.5 2.3-.4 4.2c-.1.7-.7 1.2-1.4 1.2C10.6 22 2 13.4 2 4.9c0-.7.5-1.3 1.2-1.4l4.2-.4Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="row-content">
            <span class="row-label">رقم الهاتف</span>
            <span class="row-value ltr">+971 50 123 4567</span>
          </div>
          <button class="edit-button" type="button" data-edit="phone" aria-label="تعديل رقم الهاتف">تعديل</button>
        </div>

        <div class="detail-row">
          <div class="row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.7"/>
              <path d="M3 9h18M7 15h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="row-content">
            <span class="row-label">رقم الآيبان</span>
            <span class="row-value ltr">AE07 0331 2345 6789 0123 456</span>
          </div>
          <button class="edit-button" type="button" data-edit="iban" aria-label="تعديل رقم الآيبان">تعديل</button>
        </div>
      </section>

      <aside class="security-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.6 2.8 8.2 7 10 4.2-1.8 7-5.4 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>تُحفظ بياناتك المالية بتشفير آمن. تأكد دائمًا من صحة التفاصيل قبل إجراء أي عملية تحويل.</p>
      </aside>

      <button class="logout-button" type="button">تسجيل الخروج</button>
    </main>
  </div>

  <div class="dialog-backdrop" id="dialogBackdrop" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <h2 id="dialogTitle">تعديل البيانات</h2>
      <p id="dialogDescription">أدخل القيمة الجديدة.</p>
      <input id="editInput" type="text" autocomplete="off">
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelButton" type="button">إلغاء</button>
        <button class="save-button" id="saveButton" type="button">حفظ التغييرات</button>
      </div>
    </section>
  </div>

  <script>
    const messages = {
      profile: {
        title: "تعديل بيانات الملف الشخصي",
        description: "أدخل اسمك أو بريدك الإلكتروني الجديد.",
        value: "Layla Al Mansouri"
      },
      phone: {
        title: "تعديل رقم الهاتف",
        description: "أدخل رقم الهاتف مرتبطًا برمز الدولة.",
        value: "+971 50 123 4567"
      },
      iban: {
        title: "تعديل رقم الآيبان",
        description: "أدخل رقم الآيبان الجديد المكوّن من 23 رقمًا.",
        value: "AE07 0331 2345 6789 0123 456"
      }
    };

    const backdrop = document.getElementById("dialogBackdrop");
    const title = document.getElementById("dialogTitle");
    const description = document.getElementById("dialogDescription");
    const input = document.getElementById("editInput");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");
    let activeType = "";

    document.querySelectorAll("[data-edit]").forEach(button => {
      button.addEventListener("click", () => {
        activeType = button.dataset.edit;
        const copy = messages[activeType];
        title.textContent = copy.title;
        description.textContent = copy.description;
        input.value = copy.value;
        input.dir = activeType === "profile" ? "auto" : "ltr";
        input.type = activeType === "phone" ? "tel" : "text";
        if (activeType === "phone") input.inputMode = "tel";
        else if (activeType === "iban") input.inputMode = "numeric";
        else input.inputMode = "text";
        backdrop.classList.add("open");
        requestAnimationFrame(() => input.focus());
      });
    });

    function closeDialog() {
      backdrop.classList.remove("open");
      activeType = "";
    }

    cancelButton.addEventListener("click", closeDialog);

    backdrop.addEventListener("click", event => {
      if (event.target === backdrop) closeDialog();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && backdrop.classList.contains("open")) closeDialog();
    });

    saveButton.addEventListener("click", () => {
      const value = input.value.trim();
      if (!value) {
        input.focus();
        return;
      }

      if (activeType === "profile") {
        const parts = value.split(/[,\n،]/);
        if (parts[0]) {
          document.querySelector(".profile-name").textContent = parts[0].trim();
        }
        if (parts[1]) {
          document.querySelector(".profile-email").textContent = parts[1].trim();
        }
      } else if (activeType === "phone") {
        document.querySelectorAll(".row-value")[0].textContent = value;
        messages.phone.value = value;
      } else if (activeType === "iban") {
        document.querySelectorAll(".row-value")[1].textContent = value;
        messages.iban.value = value;
      }

      closeDialog();
    });
  </script>
</body>
</html>
