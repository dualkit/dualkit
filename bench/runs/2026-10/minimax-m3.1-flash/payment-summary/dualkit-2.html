<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>ملخص الدفع</title>
  <style>
    :root {
      --primary: #146c5a;
      --primary-dark: #0d5144;
      --primary-soft: #e8f5f1;
      --text: #17211f;
      --muted: #687471;
      --border: #dfe6e3;
      --surface: #ffffff;
      --background: #f5f7fb;
      --danger: #b42318;
      --radius: 18px;
      --font-ar: "Noto Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      --font-latin: "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--background);
      font-family: var(--font-ar);
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      background: var(--background);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: 72px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid rgba(223, 230, 227, 0.85);
      backdrop-filter: blur(14px);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }

    .icon-button:focus-visible,
    .pay-button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(20, 108, 90, 0.22);
      outline-offset: 2px;
    }

    .back-icon {
      width: 23px;
      height: 23px;
      transform: scaleX(-1);
    }

    .content {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    .summary-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(18, 43, 37, 0.06);
    }

    .amount-section {
      padding: 28px 22px 26px;
      text-align: center;
      background:
        radial-gradient(circle at 15% 10%, rgba(20, 108, 90, 0.08), transparent 35%),
        var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .amount {
      margin: 0;
      color: var(--primary-dark);
      font-family: var(--font-latin), var(--font-ar);
      font-size: clamp(32px, 9vw, 42px);
      font-weight: 700;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }

    .currency {
      margin-inline-start: 6px;
      font-size: 0.68em;
      font-weight: 700;
    }

    .details {
      padding: 6px 22px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
      gap: 16px;
      align-items: start;
      padding: 19px 0;
      border-bottom: 1px solid var(--border);
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-label {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .detail-value {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      text-align: end;
    }

    .date-gregorian {
      display: block;
      direction: rtl;
    }

    .date-hijri {
      display: block;
      margin-top: 3px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
    }

    .items-note {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 18px 0;
      padding: 14px 16px;
      color: #24443d;
      background: var(--primary-soft);
      border: 1px solid #d0e9e1;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
    }

    .items-note svg {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      color: var(--primary);
    }

    .receipt-section {
      margin-top: 16px;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 12px 30px rgba(18, 43, 37, 0.05);
    }

    .receipt-section h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .receipt-section p {
      margin: 4px 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .phone-control {
      display: flex;
      align-items: stretch;
      direction: ltr;
    }

    .country-code {
      display: flex;
      align-items: center;
      min-width: 76px;
      padding: 0 12px;
      color: var(--text);
      background: #f1f4f3;
      border: 1px solid #aab8b4;
      border-inline-end: 0;
      border-radius: 10px 0 0 10px;
      font-family: var(--font-latin);
      font-size: 15px;
      font-weight: 600;
    }

    .phone-input {
      width: 100%;
      min-width: 0;
      height: 50px;
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      border: 1px solid #aab8b4;
      border-radius: 0 10px 10px 0;
      direction: ltr;
      text-align: left;
      font-family: var(--font-latin);
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .phone-input::placeholder {
      color: #8a9693;
    }

    .phone-input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(20, 108, 90, 0.1);
    }

    .helper-text {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .helper-text bdi {
      direction: ltr;
      unicode-bidi: isolate;
    }

    .pay-button {
      width: 100%;
      min-height: 54px;
      margin-top: 22px;
      padding: 13px 20px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(20, 108, 90, 0.2);
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .pay-button:hover {
      background: var(--primary-dark);
    }

    .pay-button:active {
      transform: scale(0.985);
    }

    .secure-note {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .secure-note svg {
      width: 17px;
      height: 17px;
    }

    @media (min-width: 600px) {
      body {
        padding: 24px 0;
      }

      .app-shell {
        max-width: 480px;
        min-height: calc(100vh - 48px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(20, 43, 37, 0.12);
      }

      .topbar {
        position: static;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="الرجوع إلى الصفحة السابقة">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>ملخص الدفع</h1>
      <span aria-hidden="true"></span>
    </header>

    <div class="content">
      <section class="summary-card" aria-labelledby="amount-label">
        <div class="amount-section">
          <p class="eyebrow" id="amount-label">المبلغ المستحق</p>
          <p class="amount" aria-label="1,234.50 درهم إماراتي">
            1,234.50 <span class="currency">AED</span>
          </p>
        </div>

        <div class="details">
          <div class="detail-row">
            <p class="detail-label">تاريخ الاستحقاق</p>
            <div class="detail-value">
              <span class="date-gregorian">3 نوفمبر 2026</span>
              <span class="date-hijri">21 جمادى الآخرة 1448 هـ</span>
            </div>
          </div>

          <div class="detail-row">
            <p class="detail-label">محتوى الطلب</p>
            <p class="detail-value">3 عناصر</p>
          </div>
        </div>
      </section>

      <div class="items-note" role="note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M7 7V5.5A1.5 1.5 0 0 1 8.5 4h7A1.5 1.5 0 0 1 17 5.5V7m-9 0 1 13h8l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>لديك 3 عناصر في هذا الطلب</span>
      </div>

      <section class="receipt-section" aria-labelledby="receipt-title">
        <h2 id="receipt-title">إرسال الإيصال</h2>
        <p>أدخل رقم الهاتف لإرسال الإيصال عبر رسالة نصية.</p>

        <form id="payment-form">
          <label for="phone">رقم الهاتف</label>
          <div class="phone-control">
            <span class="country-code" aria-label="رمز دولة الإمارات">+971</span>
            <input
              class="phone-input"
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              dir="ltr"
              placeholder="50 123 4567"
              aria-describedby="phone-helper"
              required
            >
          </div>
          <p class="helper-text" id="phone-helper">
            مثال: <bdi>050 123 4567</bdi>
          </p>

          <button class="pay-button" type="submit">الدفع الآن</button>

          <p class="secure-note">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M7.5 10V7.8a4.5 4.5 0 0 1 9 0V10m-10 0h11a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>ستتم عملية الدفع بأمان</span>
          </p>
        </form>
      </section>
    </div>
  </main>

  <script>
    document.getElementById("payment-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const phone = document.getElementById("phone");
      const digits = phone.value.replace(/\D/g, "");

      if (digits.length < 9) {
        phone.setCustomValidity("أدخل رقم هاتف إماراتي صحيحًا.");
        phone.reportValidity();
        return;
      }

      phone.setCustomValidity("");
      alert("تم التحقق من البيانات. يمكنك متابعة الدفع.");
    });

    document.getElementById("phone").addEventListener("input", function () {
      this.setCustomValidity("");
    });
  </script>
</body>
</html>
