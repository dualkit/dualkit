<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <title>ملخص الدفع</title>
  <style>
    :root {
      --primary: #0c775f;
      --primary-dark: #075a49;
      --primary-soft: #e9f5f1;
      --text: #17231f;
      --muted: #69746f;
      --line: #e4e9e7;
      --surface: #ffffff;
      --background: #f6f8fb;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--background);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: calc(18px + env(safe-area-inset-top)) 20px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .back-button {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 0;
      border-radius: 13px;
      background: #f2f5f4;
      color: var(--text);
      cursor: pointer;
    }

    .back-button svg {
      width: 22px;
      height: 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    main {
      padding: 20px 18px calc(28px + env(safe-area-inset-bottom));
    }

    .summary-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 8px 28px rgba(23, 35, 31, 0.05);
    }

    .amount-section {
      padding: 28px 22px 24px;
      text-align: center;
      background:
        radial-gradient(circle at 15% 10%, rgba(12, 119, 95, 0.1), transparent 35%),
        linear-gradient(180deg, #f1faf7 0%, #ffffff 100%);
    }

    .label {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .amount {
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(34px, 10vw, 44px);
      font-weight: 800;
      letter-spacing: -1px;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .currency {
      margin-right: 7px;
      font-size: 0.52em;
      font-weight: 700;
      letter-spacing: 0;
    }

    .due-date {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 8px 12px;
      border: 1px solid #cfe4dd;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.8);
      color: #43514c;
      font-size: 12px;
      line-height: 1.5;
    }

    .due-date svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      color: var(--primary);
    }

    .details {
      padding: 4px 22px 8px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      border-bottom: 1px solid var(--line);
    }

    .detail-row:last-child {
      border-bottom: 0;
    }

    .detail-title {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .detail-value {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      text-align: left;
    }

    .items-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .items-icon svg {
      width: 20px;
      height: 20px;
    }

    .form-section {
      margin-top: 18px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
    }

    .form-section h2 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .helper {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .phone-wrap {
      position: relative;
    }

    .phone-wrap input {
      width: 100%;
      height: 54px;
      padding: 0 46px 0 15px;
      border: 1px solid #cfd8d5;
      border-radius: 13px;
      outline: none;
      background: #fbfcfc;
      color: var(--text);
      direction: ltr;
      text-align: left;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .phone-wrap input::placeholder {
      color: #9aa39f;
    }

    .phone-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(12, 119, 95, 0.12);
    }

    .phone-wrap input.invalid {
      border-color: var(--danger);
    }

    .phone-icon {
      position: absolute;
      top: 50%;
      right: 15px;
      width: 19px;
      height: 19px;
      transform: translateY(-50%);
      color: var(--primary);
      pointer-events: none;
    }

    .error {
      min-height: 18px;
      margin: 7px 2px 0;
      color: var(--danger);
      font-size: 12px;
    }

    .pay-button {
      width: 100%;
      min-height: 56px;
      margin-top: 18px;
      border: 0;
      border-radius: 15px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(12, 119, 95, 0.22);
      transition: transform 0.15s, background 0.15s;
    }

    .pay-button:hover {
      background: var(--primary-dark);
    }

    .pay-button:active {
      transform: scale(0.985);
    }

    .pay-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      box-shadow: none;
    }

    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .secure-note svg {
      width: 15px;
      height: 15px;
      color: var(--primary);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 20px;
      z-index: 10;
      max-width: 420px;
      margin: auto;
      padding: 14px 18px;
      border-radius: 13px;
      background: #17231f;
      color: #fff;
      text-align: center;
      font-size: 14px;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 360px) {
      main {
        padding-right: 14px;
        padding-left: 14px;
      }

      .details,
      .form-section {
        padding-right: 17px;
        padding-left: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="back-button" type="button" aria-label="رجوع" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>ملخص الدفع</h1>
    </header>

    <main>
      <section class="summary-card" aria-label="بيانات الفاتورة">
        <div class="amount-section">
          <p class="label">المبلغ المستحق</p>
          <p class="amount"><span>1,234.50</span><span class="currency">درهم</span></p>

          <div class="due-date">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>تاريخ الاستحقاق: 3 نوفمبر 2026م — 22 جمادى الآخرة 1448هـ</span>
          </div>
        </div>

        <div class="details">
          <div class="detail-row">
            <div class="items-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 7h16l-1.2 11.2a2 2 0 01-2 1.8H7.2a2 2 0 01-2-1.8L4 7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M9 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <p class="detail-title">العناصر في هذا الطلب</p>
            <p class="detail-value">3 منتجات</p>
          </div>
        </div>
      </section>

      <section class="form-section" aria-labelledby="receipt-title">
        <h2 id="receipt-title">إرسال الإيصال</h2>
        <p class="helper">أدخل رقم جوالك لإرسال تفاصيل الدفع والإيصال عبر رسالة نصية.</p>

        <form id="paymentForm" novalidate>
          <label class="field-label" for="phone">رقم الجوال</label>
          <div class="phone-wrap">
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="050 123 4567"
              aria-describedby="phoneError"
              required
            >
            <svg class="phone-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="7" y="2" width="10" height="20" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
              <path d="M10 5h4M11 18h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="error" id="phoneError" role="alert"></p>

          <button class="pay-button" type="submit">ادفع الآن</button>
        </form>

        <p class="secure-note">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 10V7a4 4 0 018 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          تتم حماية بيانات الدفع باستخدام التشفير
        </p>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const form = document.getElementById('paymentForm');
    const phoneInput = document.getElementById('phone');
    const phoneError = document.getElementById('phoneError');
    const toast = document.getElementById('toast');

    phoneInput.addEventListener('input', () => {
      phoneInput.classList.remove('invalid');
      phoneError.textContent = '';
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const phone = phoneInput.value.trim();
      const digits = phone.replace(/\D/g, '');
      const validUaePhone = /^(?:\+971|00971|0)?5\d{8}$/.test(digits);

      if (!phone) {
        phoneInput.classList.add('invalid');
        phoneError.textContent = 'يرجى إدخال رقم الجوال.';
        phoneInput.focus();
        return;
      }

      if (!validUaePhone) {
        phoneInput.classList.add('invalid');
        phoneError.textContent = 'يرجى إدخال رقم جوال إماراتي صحيح.';
        phoneInput.focus();
        return;
      }

      showToast('تم تسجيل طلب الدفع بنجاح. سيتم إرسال الإيصال عبر رسالة نصية.');
      form.reset();
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 4000);
    }
  </script>
</body>
</html>
