<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b27">
  <title>ملخص الدفع</title>
  <style>
    :root {
      --primary: #146c5b;
      --primary-dark: #0d4f43;
      --accent: #d8a94a;
      --text: #172522;
      --muted: #71807d;
      --line: #e6ecea;
      --surface: #ffffff;
      --background: #f4f7f6;
      --danger: #c94b4b;
      --shadow: 0 14px 35px rgba(24, 54, 48, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: 0 0 45px rgba(20, 48, 43, 0.06);
    }

    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 14px 20px;
      background: var(--primary);
      color: #fff;
    }

    .header::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      content: "";
      opacity: 0.9;
    }

    .back-button {
      position: absolute;
      right: 18px;
      top: 50%;
      display: grid;
      width: 40px;
      height: 40px;
      padding: 0;
      transform: translateY(-50%);
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
    }

    .back-button:active {
      transform: translateY(-50%) scale(0.95);
    }

    .back-button svg {
      width: 20px;
      height: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    main {
      padding: 26px 20px 30px;
    }

    .amount-section {
      padding: 8px 0 25px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .amount {
      margin: 0;
      color: var(--primary-dark);
      font-size: clamp(35px, 10vw, 46px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1px;
    }

    .amount span {
      margin-right: 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .due-date {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 13px 0 0;
      padding: 8px 12px;
      border-radius: 999px;
      background: #f1f6f4;
      color: #48635d;
      font-size: 13px;
      line-height: 1.5;
    }

    .due-date svg {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .items-row {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 24px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fbfcfc;
      color: #3f514e;
      font-size: 14px;
      font-weight: 600;
    }

    .items-icon {
      display: grid;
      flex: 0 0 auto;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 10px;
      background: #e8f3f0;
      color: var(--primary);
    }

    .items-icon svg {
      width: 19px;
      height: 19px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #344743;
      font-size: 14px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap svg {
      position: absolute;
      right: 14px;
      width: 20px;
      height: 20px;
      color: #78908b;
      pointer-events: none;
    }

    input {
      width: 100%;
      height: 54px;
      padding: 0 45px 0 15px;
      border: 1px solid #dce5e2;
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      direction: rtl;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #a6b2af;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 108, 91, 0.11);
    }

    .hint {
      margin: 8px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .pay-button {
      display: flex;
      width: 100%;
      height: 56px;
      margin-top: 28px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 10px 20px rgba(20, 108, 91, 0.2);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    .pay-button:active {
      transform: scale(0.985);
      opacity: 0.92;
    }

    .pay-button svg {
      width: 19px;
      height: 19px;
    }

    .security {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 16px 0 0;
      color: #87938f;
      font-size: 12px;
    }

    .security svg {
      width: 14px;
      height: 14px;
      color: var(--primary);
    }

    @media (min-width: 481px) {
      .app {
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <button class="back-button" type="button" aria-label="رجوع">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1>ملخص الدفع</h1>
    </header>

    <main>
      <section class="amount-section" aria-labelledby="amount-label">
        <p class="eyebrow" id="amount-label">المبلغ المستحق</p>
        <p class="amount" dir="ltr">1,234.50 <span>AED</span></p>
        <div class="due-date">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/>
            <path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <span>تاريخ الاستحقاق: 3 نوفمبر 2026م — 22 شوال 1448هـ</span>
        </div>
      </section>

      <div class="items-row">
        <span class="items-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 8h14l-1 12H6L5 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 9V6a3 3 0 0 1 6 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span>يحتوي طلبك على 3 عناصر</span>
      </div>

      <form id="payment-form" novalidate>
        <div class="form-group">
          <label for="phone">رقم الهاتف لإرسال الإيصال عبر رسالة نصية</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="6" y="2" width="12" height="20" rx="3" stroke="currentColor" stroke-width="1.8"/>
              <path d="M10 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input
              id="phone"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              placeholder="050 123 4567"
              aria-describedby="phone-hint"
              required
            >
          </div>
          <p class="hint" id="phone-hint">سنرسل تفاصيل الدفع والإيصال إلى هذا الرقم.</p>
        </div>

        <button class="pay-button" type="submit">
          <span>ادفع الآن</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>

      <p class="security">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>جميع المعاملات مشفرة ومحمية</span>
      </p>
    </main>
  </div>

  <script>
    document.getElementById("payment-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const phone = document.getElementById("phone");
      const value = phone.value.replace(/\D/g, "");

      if (value.length < 9) {
        phone.setCustomValidity("يرجى إدخال رقم هاتف صحيح.");
        phone.reportValidity();
        return;
      }

      phone.setCustomValidity("");
      const button = event.currentTarget.querySelector(".pay-button");
      const originalText = button.querySelector("span").textContent;
      button.querySelector("span").textContent = "جارٍ المتابعة...";
      button.disabled = true;

      setTimeout(() => {
        button.querySelector("span").textContent = originalText;
        button.disabled = false;
      }, 1800);
    });

    document.getElementById("phone").addEventListener("input", function () {
      this.setCustomValidity("");
    });
  </script>
</body>
</html>
