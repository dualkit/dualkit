<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f5">
  <title>ملخص الدفع</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap');

    :root {
      --primary: #087f5b;
      --primary-dark: #066649;
      --primary-soft: #e7f5ef;
      --text: #14231d;
      --muted: #66736d;
      --border: #dce5e0;
      --surface: #ffffff;
      --background: #f4f7f5;
      --danger: #c92a2a;
      --shadow: 0 8px 28px rgba(20, 48, 36, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: "Noto Sans Arabic", Tahoma, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin-inline: auto;
      background: var(--background);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      min-height: 68px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(220, 229, 224, 0.8);
      background: rgba(244, 247, 245, 0.94);
      backdrop-filter: blur(14px);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
    }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .icon-button:hover {
      background: #e8eeeb;
    }

    .icon-button:focus-visible,
    .pay-button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(8, 127, 91, 0.25);
      outline-offset: 2px;
    }

    .icon-button svg {
      width: 24px;
      height: 24px;
    }

    .icon-button:dir(rtl) svg {
      transform: scaleX(-1);
    }

    main {
      padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    }

    .summary-card {
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .amount-section {
      padding: 28px 22px 24px;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(8, 127, 91, 0.08), transparent 62%),
        var(--surface);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .amount {
      margin: 4px 0 6px;
      color: var(--primary-dark);
      font-size: clamp(34px, 10vw, 44px);
      font-weight: 700;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }

    .currency-code {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .details {
      margin: 0;
      padding: 0 22px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;
      align-items: start;
      padding: 18px 0;
      border-top: 1px solid #edf1ef;
    }

    .detail-icon {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .detail-icon svg {
      width: 21px;
      height: 21px;
    }

    .detail-label {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .detail-value {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .date-value {
      display: block;
      line-height: 1.6;
    }

    .date-separator {
      margin-inline: 6px;
      color: #a1ada7;
    }

    .items-count {
      margin: 0 0 24px;
      padding: 14px 18px;
      border: 1px solid #cce7da;
      border-radius: 14px;
      background: #f1faf6;
      color: #185d48;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }

    .form-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .form-card h2 {
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 700;
    }

    .form-intro {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 600;
    }

    .phone-field {
      display: flex;
      direction: ltr;
      overflow: hidden;
      border: 1px solid #cdd9d3;
      border-radius: 14px;
      background: #fbfcfc;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .phone-field:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8, 127, 91, 0.12);
    }

    .country-code {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border-inline-end: 1px solid var(--border);
      background: #f1f5f3;
      color: #36443e;
      font-size: 15px;
      font-weight: 600;
    }

    .phone-field input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      direction: ltr;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }

    .phone-field input::placeholder {
      color: #97a39d;
    }

    .helper {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .error {
      min-height: 23px;
      margin: 5px 0 0;
      color: var(--danger);
      font-size: 14px;
      font-weight: 500;
    }

    .pay-button {
      width: 100%;
      min-height: 54px;
      margin-top: 14px;
      padding: 13px 20px;
      border: 0;
      border-radius: 15px;
      background: var(--primary);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(8, 127, 91, 0.2);
      transition: background 160ms ease, transform 100ms ease;
    }

    .pay-button:hover {
      background: var(--primary-dark);
    }

    .pay-button:active {
      transform: translateY(1px);
    }

    .pay-button:disabled {
      background: #8ab9a9;
      cursor: wait;
      box-shadow: none;
    }

    .secure-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .secure-note svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .toast {
      position: fixed;
      z-index: 30;
      inset-inline: 20px;
      bottom: calc(22px + env(safe-area-inset-bottom));
      margin: 0 auto;
      max-width: 430px;
      padding: 13px 18px;
      border-radius: 14px;
      background: #14231d;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 481px) {
      body {
        padding: 24px 0;
      }

      .app-shell {
        min-height: calc(100vh - 48px);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 18px 60px rgba(20, 48, 36, 0.12);
      }

      .topbar {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" id="backButton" aria-label="الرجوع">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      </button>
      <h1>ملخص الدفع</h1>
      <span aria-hidden="true"></span>
    </header>

    <main>
      <section class="summary-card" aria-labelledby="dueAmountLabel">
        <div class="amount-section">
          <p class="eyebrow" id="dueAmountLabel">المبلغ المستحق</p>
          <div class="amount" aria-label="1,234.50 درهم إماراتي">
            <bdi dir="ltr">1,234.50 د.إ</bdi>
          </div>
          <span class="currency-code" dir="ltr">AED</span>
        </div>

        <div class="details">
          <div class="detail-row">
            <div class="detail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                <path d="M16 3v4M8 3v4M3 10h18"></path>
              </svg>
            </div>
            <div>
              <p class="detail-label">تاريخ الاستحقاق</p>
              <p class="detail-value">
                <span class="date-value">3 نوفمبر 2026</span>
                <span class="date-separator" aria-hidden="true">•</span>
                <span class="date-value">3 جمادى الأولى 1448 هـ</span>
              </p>
            </div>
          </div>

          <div class="detail-row">
            <div class="detail-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 7h12l-1 14H7L6 7Z"></path>
                <path d="M9 9V5a3 3 0 0 1 6 0v4"></path>
              </svg>
            </div>
            <div>
              <p class="detail-label">محتويات الطلب</p>
              <p class="detail-value">لديك 3 عناصر في هذا الطلب</p>
            </div>
          </div>
        </div>
      </section>

      <section class="form-card" aria-labelledby="receiptHeading">
        <h2 id="receiptHeading">إرسال الإيصال</h2>
        <p class="form-intro">أدخل رقم الهاتف لإرسال الإيصال عبر رسالة نصية.</p>

        <form id="paymentForm" novalidate>
          <label for="phoneNumber">رقم الهاتف</label>
          <div class="phone-field">
            <span class="country-code" dir="ltr">+971</span>
            <input
              id="phoneNumber"
              name="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              dir="ltr"
              maxlength="16"
              placeholder="050 123 4567"
              aria-describedby="phoneHelp phoneError"
            >
          </div>
          <p class="helper" id="phoneHelp">مثال: <bdi dir="ltr">050 123 4567</bdi></p>
          <p class="error" id="phoneError" role="alert" aria-live="polite"></p>

          <button class="pay-button" type="submit" id="payButton">ادفع الآن</button>
          <p class="secure-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="10" width="14" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            يتم الدفع عبر اتصال مشفر وآمن
          </p>
        </form>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const form = document.getElementById('paymentForm');
    const phoneInput = document.getElementById('phoneNumber');
    const phoneError = document.getElementById('phoneError');
    const payButton = document.getElementById('payButton');
    const toast = document.getElementById('toast');
    const backButton = document.getElementById('backButton');

    function toWesternDigits(value) {
      return value
        .replace(/[٠-٩]/g, digit => String(digit.charCodeAt(0) - 0x0660))
        .replace(/[۰-۹]/g, digit => String(digit.charCodeAt(0) - 0x06F0));
    }

    function normalizePhone(value) {
      return toWesternDigits(value).replace(/[^\d+]/g, '');
    }

    function isValidUaePhone(value) {
      const phone = normalizePhone(value);
      return /^(?:\+971|00971|971)?0?5[0-9]{8}$/.test(phone);
    }

    phoneInput.addEventListener('input', () => {
      phoneError.textContent = '';
      const position = phoneInput.selectionStart;
      phoneInput.value = toWesternDigits(phoneInput.value);
      if (position !== null) {
        phoneInput.setSelectionRange(position, position);
      }
    });

    form.addEventListener('submit', event => {
      event.preventDefault();

      if (!isValidUaePhone(phoneInput.value)) {
        phoneError.textContent = 'أدخل رقم هاتف إماراتي صحيحًا، مثل 050 123 4567.';
        phoneInput.focus();
        return;
      }

      phoneError.textContent = '';
      payButton.disabled = true;
      payButton.textContent = 'جارٍ تنفيذ الدفع…';

      setTimeout(() => {
        payButton.disabled = false;
        payButton.textContent = 'ادفع الآن';
        toast.textContent = 'تم تنفيذ الدفع بنجاح، وسيصلك الإيصال عبر رسالة نصية.';
        toast.classList.add('show');

        setTimeout(() => toast.classList.remove('show'), 3500);
      }, 900);
    });

    backButton.addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        toast.textContent = 'لا توجد صفحة سابقة.';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }
    });
  </script>
</body>
</html>
