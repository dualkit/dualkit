<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    direction: rtl;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .phone {
    width: 375px;
    height: 812px;
    background: #fff;
    border-radius: 44px;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    position: relative;
    border: 10px solid #1a1a1a;
  }

  /* ── status bar ── */
  .status-bar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    padding: 14px 28px 6px;
    font-size: 15px;
    font-weight: 600;
    color: #000;
    gap: 6px;
  }

  .status-bar .time {
    font-weight: 700;
    margin-inline-start: 12px;
  }

  /* ── header ── */
  .header {
    padding: 10px 28px 20px;
    text-align: center;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #000;
    letter-spacing: -0.5px;
  }

  /* ── scroll area ── */
  .scroll {
    padding: 0 28px;
    overflow-y: auto;
    height: calc(812px - 140px);
  }

  /* ── group ── */
  .group { margin-bottom: 28px; }

  .group-title {
    font-size: 13px;
    font-weight: 600;
    color: #8e8e93;
    text-align: start;
    margin-bottom: 8px;
    padding-inline-start: 4px;
  }

  .group-body {
    background: #f9f9f9;
    border-radius: 14px;
    overflow: hidden;
  }

  /* ── navigation row (chevron) ── */
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 16px;
    border-bottom: 1px solid #ececec;
    cursor: pointer;
    transition: background 0.15s;
  }

  .nav-row:last-child { border-bottom: none; }
  .nav-row:active { background: #f0f0f0; }

  .nav-row .nav-label {
    font-size: 16px;
    font-weight: 500;
    color: #000;
  }

  .nav-row .nav-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-row .nav-value {
    font-size: 15px;
    color: #8e8e93;
  }

  .chevron {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
  }

  .chevron:dir(rtl) { transform: scaleX(-1); }

  /* ── toggle row ── */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 16px;
    border-bottom: 1px solid #ececec;
  }

  .toggle-row:last-child { border-bottom: none; }

  .toggle-row .toggle-label {
    font-size: 16px;
    font-weight: 500;
    color: #000;
  }

  .toggle {
    width: 52px;
    height: 31px;
    background: #d1d1d6;
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    transition: background 0.25s;
    flex-shrink: 0;
  }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    inset-inline-start: 2px;
    width: 27px;
    height: 27px;
    background: #fff;
    border-radius: 50%;
    transition: inset-inline-start 0.25s;
  }

  .toggle.on {
    background: #007aff;
  }

  .toggle.on::after {
    inset-inline-start: auto;
    inset-inline-end: 2px;
  }

  /* ── bottom navigation ── */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 24px;
    border-top: 1px solid #ececec;
    background: #fff;
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: #8e8e93;
    cursor: pointer;
    font-weight: 500;
    transition: color 0.2s;
  }

  .nav-item.active { color: #007aff; }

  .nav-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: #e0e0e5;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .nav-item.active .nav-icon { background: #007aff; }

  .nav-icon svg {
    width: 16px;
    height: 16px;
    fill: #8e8e93;
    transition: fill 0.2s;
  }

  .nav-item.active .nav-icon svg { fill: #fff; }

  /* ── home indicator ── */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #000;
    border-radius: 3px;
    opacity: 0.3;
  }
</style>
</head>
<body>
  <div class="phone">

    <!-- Status bar -->
    <div class="status-bar">
      <span class="time">9:41 ص</span>
      <span>●●●</span>
      <span>100%</span>
    </div>

    <!-- Header -->
    <div class="header">
      <h1>الإعدادات</h1>
    </div>

    <!-- Content -->
    <div class="scroll">

      <!-- ═══════════════════════  ACCOUNT  ═══════════════════════ -->
      <div class="group">
        <div class="group-title">الحساب</div>
        <div class="group-body">

          <div class="nav-row" onclick="alert('فتح شاشة تعديل الاسم')">
            <span class="nav-label">الاسم</span>
            <div class="nav-right">
              <span class="nav-value">أحمد حسن</span>
              <svg class="chevron" viewBox="0 0 8 8">
                <path d="M7 1l-3 3 3 3" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

          <div class="nav-row" onclick="alert('فتح شاشة تعديل رقم الهاتف')">
            <span class="nav-label">رقم الهاتف</span>
            <div class="nav-right">
              <span class="nav-value"><bdi dir="ltr">+973 3600 1234</bdi></span>
              <svg class="chevron" viewBox="0 0 8 8">
                <path d="M7 1l-3 3 3 3" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

          <div class="nav-row" onclick="alert('فتح شاشة اختيار اللغة')">
            <span class="nav-label">اللغة</span>
            <div class="nav-right">
              <span class="nav-value">العربية</span>
              <svg class="chevron" viewBox="0 0 8 8">
                <path d="M7 1l-3 3 3 3" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>

        </div>
      </div>

      <!-- ═══════════════════════  SECURITY  ═══════════════════════ -->
      <div class="group">
        <div class="group-title">الأمان</div>
        <div class="group-body">

          <div class="toggle-row">
            <span class="toggle-label">Face ID</span>
            <div class="toggle on" onclick="this.classList.toggle('on')"></div>
          </div>

          <div class="toggle-row">
            <span class="toggle-label">تسجيل الدخول بخطوتين</span>
            <div class="toggle on" onclick="this.classList.toggle('on')"></div>
          </div>

        </div>
      </div>

      <!-- ═══════════════════════  NOTIFICATIONS  ═══════════════════════ -->
      <div class="group">
        <div class="group-title">الإخطارات</div>
        <div class="group-body">

          <div class="toggle-row">
            <span class="toggle-label">التحويلات</span>
            <div class="toggle on" onclick="this.classList.toggle('on')"></div>
          </div>

          <div class="toggle-row">
            <span class="toggle-label">العرض</span>
            <div class="toggle on" onclick="this.classList.toggle('on')"></div>
          </div>

          <div class="toggle-row">
            <span class="toggle-label">الكشوف</span>
            <div class="toggle on" onclick="this.classList.toggle('on')"></div>
          </div>

        </div>
      </div>

    </div>

    <!-- Bottom navigation -->
    <div class="bottom-nav">
      <div class="nav-item" onclick="this.parentElement.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8.5l-7-5-7 5V20h5z"/></svg>
        </div>
        <span>الصفحة الرئيسية</span>
      </div>
      <div class="nav-item" onclick="this.parentElement.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M21 12v5h-5"/></svg>
        </div>
        <span>التحويلات</span>
      </div>
      <div class="nav-item active" onclick="this.parentElement.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));this.classList.add('active')">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.42-.48-.42h-3.84c-.24 0-.44.18-.48.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.2-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.42.48.42h3.84c.24 0 .44-.18.48-.42l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.2.08-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </div>
        <span>الإعدادات</span>
      </div>
    </div>

    <!-- Home indicator -->
    <div class="home-indicator"></div>

  </div>
</body>
</html>
