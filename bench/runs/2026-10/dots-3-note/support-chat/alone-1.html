<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الدعم</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    direction: rtl;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
  }
  .chat {
    max-width: 400px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: #0084ff;
    color: #fff;
    padding: 12px;
    text-align: center;
    font-size: 1.2rem;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .msg {
    margin: 8px;
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 80%;
    word-wrap: break-word;
    position: relative;
  }
  .customer {
    background: #e4e6eb;
    align-self: flex-start;
  }
  .agent {
    background: #0084ff;
    color: #fff;
    align-self: flex-end;
  }
  .time {
    display: block;
    font-size: 0.7rem;
    opacity: 0.7;
    margin-top: 4px;
  }
  .input-row {
    display: flex;
    padding: 10px;
    background: #fff;
    border-top: 1px solid #ccc;
  }
  input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
  }
  button {
    margin-right: 8px;
    padding: 10px 16px;
    background: #0084ff;
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="chat">
    <div class="header">الدعم</div>
    <div class="messages">
      <div class="msg customer">
        السلام عليكم، أود معرفة تفاصيل خدمة 5G.
        <span class="time">10:00</span>
      </div>
      <div class="msg agent">
        مرحباً بك، هذا سارة من الدعم. كيف يمكنني مساعدتك؟
        <span class="time">10:01</span>
      </div>
      <div class="msg customer">
        أنا أستخدم eSIM وأريد تفعيلها.
        <span class="time">10:02</span>
      </div>
      <div class="msg agent">
        نحن ندعم eSIM. من فضلك أخبرني برقم الطلب TX-48213.
        <span class="time">10:03</span>
      </div>
      <div class="msg customer">
        رقم الطلب هو TX-48213.
        <span class="time">10:04</span>
      </div>
      <div class="msg agent">
        شكرًا، سأقوم بتفعيل eSIM لك.
        <span class="time">10:05</span>
      </div>
    </div>
    <div class="input-row">
      <input type="text" placeholder="اكتب رسالتك...">
      <button>أرسل</button>
    </div>
  </div>
</body>
</html>
