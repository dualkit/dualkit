<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Chat</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    direction: rtl;
    background: #f5f5f5;
  }
  .chat-container {
    max-width: 375px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }
  .header {
    background: #005a9c;
    color: #fff;
    padding: 12px;
    text-align: center;
    font-size: 1.2em;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .message {
    margin: 6px 0;
    padding: 8px 12px;
    border-radius: 18px;
    max-width: 80%;
    word-wrap: break-word;
    position: relative;
  }
  .customer {
    align-self: flex-start;
    background: #e0e0e0;
  }
  .agent {
    align-self: flex-end;
    background: #005a9c;
    color: #fff;
  }
  .name {
    font-weight: bold;
    margin-right: 4px;
  }
  .time {
    display: block;
    font-size: 0.7em;
    opacity: 0.7;
    margin-top: 4px;
  }
  .input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ccc;
    background: #fff;
  }
  .input-area input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
    font-size: 1em;
  }
  .input-area button {
    margin-left: 8px;
    padding: 10px 15px;
    background: #005a9c;
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 1em;
  }
</style>
</head>
<body>
<div class="chat-container">
  <div class="header">الدعم - زين كوا</div>
  <div class="messages">
    <!-- Message 1 -->
    <div class="message customer">
      <span class="text">مرحباً، أود تفعيل خدمة 5G على خطّي.</span>
      <span class="time">10:05</span>
    </div>
    <!-- Message 2 -->
    <div class="message agent">
      <span class="name">Sara:</span>
      <span class="text">مرحباً، سأساعدك. يرجى تزويدي برقم الطلب TX-48213.</span>
      <span class="time">10:06</span>
    </div>
    <!-- Message 3 -->
    <div class="message customer">
      <span class="text">الطلب هو TX-48213، ما هي الخطوات التالية؟</span>
      <span class="time">10:07</span>
    </div>
    <!-- Message 4 -->
    <div class="message agent">
      <span class="name">Sara:</span>
      <span class="text">يمكنك تثبيت بطاقة eSIM من خلال تطبيقنا.</span>
      <span class="time">10:08</span>
    </div>
    <!-- Message 5 -->
    <div class="message customer">
      <span class="text">أين أجد رمز التفعيل لـ eSIM؟</span>
      <span class="time">10:09</span>
    </div>
    <!-- Message 6 -->
    <div class="message agent">
      <span class="name">Sara:</span>
      <span class="text">الرمز هو 123456، ي Expedition.</span>
      <span class="time">10:10</span>
    </div>
  </div>
  <div class="input-area">
    <input type="text" placeholder="اكتب رسالتك...">
    <button>أرسل</button>
  </div>
</div>
</body>
</html>
