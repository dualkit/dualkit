<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدعم</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background-color: #f5f5f5;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .msg {
    max-width: 80%;
    padding: 10px 15px;
    margin: 5px 0;
    border-radius: 18px;
    position: relative;
    word-wrap: break-word;
  }
  .customer {
    align-self: flex-end;
    background-color: #dcf8c6;
  }
  .agent {
    align-self: flex-start;
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
  }
  .time {
    font-size: 0.7rem;
    color: #888;
    margin-top: 5px;
    display: block;
  }
  .input-area {
    display: flex;
    padding: 10px;
    background-color: #ffffff;
    border-top: 1px solid #ccc;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 24px;
    outline: none;
    font-size: 1rem;
  }
  button {
    margin-left: 10px;
    padding: 12px 20px;
    border: none;
    background-color: #007bff;
    color: white;
    border-radius: 24px;
    cursor: pointer;
    font-size: 1rem;
  }
</style>
</head>
<body>
  <div class="messages">
    <div class="msg customer">
      أود تفعيل خدمة 5G على بطاقة SIM الخاصة بي
      <span class="time">10:20</span>
    </div>
    <div class="msg agent">
      Sara: مرحباً، يرجى تزويدي برقم الطلب
      <span class="time">10:21</span>
    </div>
    <div class="msg customer">
      رقم الطلب هو TX-48213
      <span class="time">10:22</span>
    </div>
    <div class="msg agent">
      Sara: سأقوم بتفعيل eSIM لك
      <span class="time">10:23</span>
    </div>
    <div class="msg customer">
      كم دقيقةستغرق عملية التفعيل؟
      <span class="time">10:24</span>
    </div>
    <div class="msg agent">
      Sara: ستستغرق حوالي 5 minutes
      <span class="time">10:25</span>
    </div>
  </div>
  <div class="input-area">
    <input type="text" placeholder="اكتب رسالتك...">
    <button>أرسل</button>
  </div>
</body>
</html>
