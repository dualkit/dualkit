<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>axis الطلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :lang(ar) {
    --type-label-size: 14px;
    --type-caption-size: 14px;
    --type-body-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    font-style: normal;
    line-height: 1.7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans Arabic', sans-serif;
    background: #f0f2f5;
    direction: rtl;
    text-align: right;
    font-size: var(--type-body-size);
    line-height: 1.7;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }

  .screen {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid #ececec;
    background: #fff;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header .back {
    background: #f0f0f0;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a1a1a;
    margin-inline-start: 12px;
    flex-shrink: 0;
  }

  .header h1 {
    font-size: 17px;
    font-weight: 600;
    flex: 1;
    text-align: center;
  }

  /* ── Items ── */
  .section { padding: 18px 16px 0; }

  .section-label {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .section-label .count {
    font-size: 14px; /* fixed from 13px */
    color: #888;
    font-weight: 400;
  }

  .item {
    display: flex;
    align-items: center;
    padding: 12px;
    background: #fafafa;
    border-radius: 14px;
    margin-bottom: 10px;
    border: 1px solid #f0f0f0;
  }

  .item .photo {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    margin-inline-end: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }

  .photo.tomato  { background: #ffe8e8; }
  .photo.water   { background: #e0f0ff; }
  .photo.rice    { background: #fff3e0; }

  .item .info { flex: 1; min-width: 0; }

  .item .name {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 3px;
  }

  .item .price {
    font-size: 14px; /* fixed from 13px */
    color: #888;
    font-weight: 400;
  }

  .stepper { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .stepper button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid #e0e0e0;
    background: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
    transition: background .15s, border-color .15s;
  }

  .stepper button:active { background: #f5f5f5; border-color: #ccc; }

  .stepper .val {
    font-size: 15px;
    font-weight: 600;
    min-width: 22px;
    text-align: center;
  }

  /* ── Promo ── */
  .promo-block { padding: 18px 16px 0; }

  .promo-row { display: flex; gap: 8px; }

  .promo-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #e2e2e2;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    text-align: right;
    background: #fafafa;
    transition: border-color .15s, background .15s;
  }

  .promo-input:focus {
    outline: none;
    border-color: #4CAF50;
    background: #fff;
  }

  .promo-btn {
    padding: 0 18px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }

  .promo-btn:active { background: #388E3C; }

  /* ── Summary ── */
  .summary-block {
    padding: 20px 16px 0;
    margin-top: 8px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    font-size: 15px;
  }

  .summary-row .label { color: #555; }
  .summary-row .value { font-weight: 600; }

  .summary-divider {
    height: 1px;
    background: #f0f0f0;
    margin: 8px 0;
  }

  .summary-row.total {
    font-size: 17px;
    font-weight: 700;
    padding-top: 14px;
  }

  .summary-row.total .label { color: #1a1a1a; }
  .summary-row.total .value { color: #1a1a1a; }

  /* ── Button ── */
  .order-btn {
    margin: 24px 16px 28px;
    padding: 16px;
    background: #4CAF50;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    width: calc(100% - 32px);
    transition: background .15s, transform .05s;
  }

  .order-btn:active { background: #388E3C; transform: scale(.99); }

  .bottom-spacer { height: 16px; }
</style>
</head>
<body>
<div class="screen">

  <!-- Header -->
  <header class="header">
    <button class="back" aria-label="axis">←</button>
    <h1>axis الطلب</h1>
  </header>

  <!-- Cart items -->
  <div class="section">
    <div class="section-label">
      <span>السلة</span>
      <span class="count">3 عناصر</span>
    </div>

    <!-- Item 1 -->
    <div class="item">
      <div class="photo tomato">🍅</div>
      <div class="info">
        <div class="name">طماطم بندورة</div>
        <div class="price">2.50 د.إ</div>
      </div>
      <div class="stepper">
        <button data-minus>−</button>
        <span class="val">2</span>
        <button data-plus>+</button>
      </div>
    </div>

    <!-- Item 2 -->
    <div class="item">
      <div class="photo water">💧</div>
      <div class="info">
        <div class="name">ماء معدني</div>
        <div class="price">1.20 د.إ</div>
      </div>
      <div class="stepper">
        <button data-minus>−</button>
        <span class="val">1</span>
        <button data-plus>+</button>
      </div>
    </div>

    <!-- Item 3 -->
    <div class="item">
      <div class="photo rice">🌾</div>
      <div class="info">
        <div class="name">أرز أبيض</div>
        <div class="price">4.00 د.إ</div>
      </div>
      <div class="stepper">
        <button data-minus>−</button>
        <span class="val">3</span>
        <button data-plus>+</button>
      </div>
    </div>
  </div>

  <!-- Promo code -->
  <div class="promo-block">
    <div class="promo-row">
      <input type="text" class="promo-input" placeholder="رمز الخصم">
      <button class="promo-btn">axis</button>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-block">
    <div class="summary-row">
      <span class="label">الإجمالي الفرعي</span>
      <span class="value">18.20 د.إ</span>
    </div>
    <div class="summary-row">
      <span class="label">الINAية</span>
      <span class="value">5.00 د.إ</span>
    </div>
    <div class="summary-row">
      <span class="label">VAT 5%</span>
      <span class="value">0.91 د.إ</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-row total">
      <span class="label">الإجمالي الكلي</span>
      <span class="value">24.11 د.إ</span>
    </div>
  </div>

  <!-- Place order -->
  <button class="order-btn">axis الطلب</button>

  <div class="bottom-spacer"></div>
</div>

<script>
  // Stepper interactivity
  document.querySelectorAll('.stepper').forEach(function (stepper) {
    const minus = stepper.querySelector('[data-minus]');
    const plus  = stepper.querySelector('[data-plus]');
    const val   = stepper.querySelector('.val');

    minus.addEventListener('click', function () {
      let n = parseInt(val.textContent, 10);
      if (n > 1) { n--; val.textContent = n; }
    });

    plus.addEventListener('click', function () {
      let n = parseInt(val.textContent, 10);
      n++; val.textContent = n;
    });
  });
</script>
</body>
</html>
