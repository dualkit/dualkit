<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عنوان التسليم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :lang(ar) {
    --type-label-size: 14px;
    --type-caption-size: 14px;
    --type-body-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    font-style: normal;
    line-height: 1.7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    padding: 24px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  .form-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
    text-align: start;
  }

  .subtitle {
    font-size: var(--type-caption-size);
    color: #6b7280;
    margin-bottom: 24px;
    text-align: start;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: var(--type-label-size);
    font-weight: 500;
    color: #374151;
    margin-bottom: 8px;
    text-align: start;
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    font-size: var(--type-body-size);
    font-family: inherit;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fff;
    color: #1a1a1a;
    transition: border-color 0.2s;
  }

  input:focus, select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }

  input::placeholder {
    color: #9ca3af;
  }

  /* Fix Arabic placeholder in LTR fields */
  #makani::placeholder {
    direction: rtl;
    text-align: right;
  }

  .hint {
    font-size: var(--type-caption-size);
    color: #6b7280;
    margin-top: 6px;
    text-align: start;
  }

  .phone-wrap {
    display: flex;
    gap: 0;
    direction: ltr;
  }

  .phone-wrap .prefix {
    display: flex;
    align-items: center;
    padding-inline: 14px;
    background: #f3f4f6;
    border: 1px solid #d1d5db;
    border-inline-end: none;
    border-radius: 10px 0 0 10px;
    font-size: var(--type-body-size);
    color: #374151;
    white-space: nowrap;
  }

  .phone-wrap input {
    border-radius: 0 10px 10px 0;
    border-inline-start: none;
  }

  .submit-btn {
    width: 100%;
    padding: 16px;
    font-size: var(--type-body-size);
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
  }

  .submit-btn:hover {
    background: #1d4ed8;
  }

  .submit-btn:active {
    background: #1e40af;
  }
</style>
</head>
<body>
  <div class="form-card">
    <h1>عنوان التسليم</h1>
    <p class="subtitle">أضف عنوانك لتسريع عملية الطلب</p>

    <form>
      <div class="field">
        <label for="building">مبنى أو فيلا</label>
        <input type="text" id="building" placeholder="رقم المبنى أو اسم الفilla" dir="rtl">
      </div>

      <div class="field">
        <label for="street">الشارع</label>
        <input type="text" id="street" placeholder="اسم الشارع" dir="rtl">
      </div>

      <div class="field">
        <label for="area">المنطقة</label>
        <input type="text" id="area" placeholder="المنطقة" dir="rtl">
      </div>

      <div class="field">
        <label for="makani">رقم مكاني</label>
        <input type="text" id="makani" placeholder="رقم المكان" dir="ltr" inputmode="numeric">
      </div>

      <div class="field">
        <label for="emirate">الإمارة</label>
        <select id="emirate">
          <option value="Dubai">الدبي</option>
          <option value="Abu Dhabi">أبوظبي</option>
          <option value="Sharjah">الشارقة</option>
          <option value="Ajman">عجمان</option>
          <option value="Ras Al Khaimah">拉斯阿尔凯马</option>
          <option value="Fujairah">الفجيرة</option>
          <option value="Umm Al Quwain">أم القيوين</option>
        </select>
      </div>

      <div class="field">
        <label for="phone">رقم الهاتف</label>
        <div class="phone-wrap">
          <span class="prefix">+971</span>
          <input type="tel" id="phone" placeholder="050 123 4567" dir="ltr" inputmode="tel" autocomplete="tel">
        </div>
        <p class="hint">
          مثال: <bdi dir="ltr">050 123 4567</bdi>
        </p>
      </div>

      <button type="submit" class="submit-btn">حفظ عنوان</button>
    </form>
  </div>
</body>
</html>
