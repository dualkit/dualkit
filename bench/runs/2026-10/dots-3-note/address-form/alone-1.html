<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عنوان التسليم</title>
<style>
  body { font-family: 'Arial', sans-serif; padding: 16px; background-color: #f9f9f9; }
  .form-group { margin-bottom: 16px; }
  label { display: block; margin-bottom: 4px; font-weight: bold; }
  input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
  button:hover { background-color: #0056b3; }
</style>
</head>
<body>
  <form>
    <div class="form-group">
      <label for="building">مبنى أو فيلا</label>
      <input type="text" id="building" name="building" required>
    </div>
    <div class="form-group">
      <label for="street">شارع</label>
      <input type="text" id="street" name="street" required>
    </div>
    <div class="form-group">
      <label for="area">منطقة</label>
      <input type="text" id="area" name="area" required>
    </div>
    <div class="form-group">
      <label for="makani">رقم مكاني</label>
      <input type="text" id="makani" name="makani" required>
    </div>
    <div class="form-group">
      <label for="emirate">الإمارة</label>
      <select id="emirate" name="emirate">
        <option value="Dubai" selected>دبي</option>
        <option value="Abu Dhabi">أبو ظبي</option>
        <option value="Sharjah">الشارقة</option>
        <option value="Ajman">عجمان</option>
        <option value="Ras Al Khaimah">拉斯 الخيمة</option>
        <option value="Fujairah">الفجيرة</option>
        <option value="Umm Al Quwain">أم القيوين</option>
      </select>
    </div>
    <div class="form-group">
      <label for="phone">رقم الهاتف</label>
      <input type="tel" id="phone" name="phone" placeholder="050 123 4567" required>
    </div>
    <button type="submit">حفظ_about</button>
  </form>
</body>
</html>
