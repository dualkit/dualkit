<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواعيد العيادة</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    width: 100%;
    max-width: 480px;
    background: #fff;
    padding: 16px;
    box-sizing: border-box;
    direction: rtl;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .header button {
    background: none;
    border: none;
    font-size: 24px;
    color: #333;
    cursor: pointer;
  }
  #monthName {
    font-size: 20px;
    margin: 0 8px;
  }
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 16px;
  }
  .day-header {
    text-align: center;
    font-weight: bold;
    padding: 8px 0;
    background: #eee;
    border-radius: 4px;
  }
  .day-cell {
    text-align: center;
    padding: 8px 0;
    border: 1px solid #ddd;
    border-radius: 4px;
    cursor: pointer;
  }
  .day-cell:hover {
    background: #f0f0f0;
  }
  .today {
    background: #007bff;
    color: #fff;
  }
  .selected {
    background: #28a745;
    color: #fff;
  }
  .time-slots {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .time-slot {
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f9f9f9;
    cursor: pointer;
  }
  .time-slot:hover {
    background: #e9e9e9;
  }
  .time-slot.selected {
    background: #007bff;
    color: #fff;
  }
  .doctor {
    margin-bottom: 16px;
    font-size: 16px;
    text-align: center;
  }
  .confirm-btn {
    width: 100%;
    padding: 12px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
  .confirm-btn:hover {
    background: #218838;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button id="prevMonth">‹</button>
    <h2 id="monthName"></h2>
    <button id="nextMonth">›</button>
  </div>
  <div class="calendar" id="calendar">
    <!-- Day headers will be added by JS -->
  </div>
  <div class="time-slots" id="timeSlots">
    <!-- Time slots will be added by JS -->
  </div>
  <div class="doctor">
    <p>الدكتور: د. أحمد محمد</p>
  </div>
  <button class="confirm-btn" id="confirmBtn">تأكيد الحجز</button>
</div>

<script>
  // Arabic month names
  const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  // Day names starting Saturday
  const dayNames = ["سبت", "أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة"];

  let currentDate = new Date();
  let currentMonth = currentDate.getMonth();
  let currentYear = currentDate.getFullYear();

  const calendarEl = document.getElementById('calendar');
  const monthNameEl = document.getElementById('monthName');
  const prevBtn = document.getElementById('prevMonth');
  const nextBtn = document.getElementById('nextMonth');
  const timeSlotsEl = document.getElementById('timeSlots');
  const confirmBtn = document.getElementById('confirmBtn');

  // Generate time slots
  function generateTimeSlots() {
    timeSlotsEl.innerHTML = '';
    for (let h = 9; h <= 12; h++) {
      for (let m = 0; m < 60; m += 30) {
        if (h === 12 && m > 0) break; // only 12:00
        const time = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        slot.textContent = time;
        slot.addEventListener('click', () => {
          document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
          slot.classList.add('selected');
        });
        timeSlotsEl.appendChild(slot);
      }
    }
  }

  // Generate calendar
  function generateCalendar() {
    calendarEl.innerHTML = '';
    // Add day headers
    const headerRow = document.createElement('div');
    headerRow.style.display = 'contents';
    dayNames.forEach(day => {
      const header = document.createElement('div');
      header.className = 'day-header';
      header.textContent = day;
      headerRow.appendChild(header);
    });
    calendarEl.appendChild(headerRow);

    // Get first day of month and number of days
    const firstDay = new Date(currentYear, currentMonth, 1);
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const startDayIndex = (firstDay.getDay() + 1) % 7; // Saturday=0

    // Create grid
    const grid = document.createElement('div');
    grid.style.display = 'contents';

    // Empty cells
    for (let i = 0; i < startDayIndex; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell';
      empty.style.visibility = 'hidden';
      grid.appendChild(empty);
    }

    // Day cells
    const today = new Date();
    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.textContent = day;
      // Check if today
      if (today.getDate() === day && today.getMonth() === currentMonth && today.getFullYear() === currentYear) {
        cell.classList.add('today');
      }
      cell.addEventListener('click', () => {
        document.querySelectorAll('.day-cell').forEach(c => c.classList.remove('selected'));
        cell.classList.add('selected');
      });
      grid.appendChild(cell);
    }

    calendarEl.appendChild(grid);

    // Update month name
    monthNameEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
  }

  // Event listeners for navigation
  prevBtn.addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }
    generateCalendar();
  });

  nextBtn.addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    generateCalendar();
  });

  // Confirm button
  confirmBtn.addEventListener('click', () => {
    const selectedDate = document.querySelector('.day-cell.selected');
    const selectedTime = document.querySelector('.time-slot.selected');
    if (selectedDate && selectedTime) {
      alert(`تم تأكيد الحجز في ${selectedDate.textContent} ${monthNameEl.textContent} ${currentYer} الساعة ${selectedTime.textContent}`);
    } else {
      alert('يرجى اختيار اليوم والوقت');
    }
  });

  // Initialize
  generateTimeSlots();
  generateCalendar();
</script>
</body>
</html>
