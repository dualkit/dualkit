<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز موعد - العيادة</title>
<style>
  :root {
    --primary: #0f766e;
    --primary-dark: #0d4f4c;
    --primary-light: #ccfbf1;
    --bg: #f0fdfa;
    --surface: #ffffff;
    --text: #134e4a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --today: #0f766e;
    --today-text: #ffffff;
    --selected: #0d4f4c;
    --weekend: #fee2e2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: min-height: 100vh;
    padding: 20px;
    direction: rtl;
  }
  .phone {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden;
    min-height: 850px;
    display: flex;
    flex-direction: column;
  }
  /* Header */
  .app-bar {
    background: var(--primary);
    color: #fff;
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .app-bar .title { font-size: 20px; font-weight: 700; }
  .app-bar .subtitle { font-size: 13px; opacity: 0.9; margin-top: 2px; }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.25); }

  /* Month navigator */
  .month-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 20px 8px;
  }
  .month-bar .month-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    min-width: 140px;
    text-align: center;
  }
  .month-bar .year { font-size: 14px; color: var(--text-muted); font-weight: 500; }

  /* Weekday headers */
  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 8px 16px 4px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }
  .weekdays div { text-align: center; }

  /* Calendar grid */
  .calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    padding: 4px 16px 12px;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 500;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text);
    position: relative;
    transition: background 0.12s, color 0.12s;
  }
  .day:hover:not(.empty):not(.selected) { background: var(--primary-light); color: var(--primary-dark); }
  .day.empty { cursor: default; }
  .day.weekend { color: #ef4444; }
  .day.today {
    background: var(--today);
    color: var(--today-text);
    font-weight: 700;
  }
  .day.selected {
    background: var(--selected);
    color: #fff;
    font-weight: 700;
  }
  .day.other-month { color: #cbd5e1; }

  /* Divider */
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 0 20px;
  }
  .section-label {
    padding: 14px 20px 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--primary);
  }

  /* Doctor card */
  .doctor-card {
    margin: 0 20px;
    background: var(--bg);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border);
  }
  .doctor-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .doctor-info { flex: 1; }
  .doctor-name { font-size: 16px; font-weight: 700; }
  .doctor-specialty { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .doctor-rating { font-size: 13px; color: var(--primary); font-weight: 600; }

  /* Time slots */
  .time-slots {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 20px 16px;
  }
  .time-slot {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 4px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
    color: var(--text);
  }
  .time-slot:hover:not(.taken) { border-color: var(--primary); background: var(--primary-light); }
  .time-slot.taken { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; border-color: transparent; }
  .time-slot.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Bottom bar */
  .bottom-bar {
    margin-top: auto;
    padding: 12px 20px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  .selected-summary {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 10px;
    min-height: 20px;
  }
  .selected-summary strong { color: var(--text); }
  .confirm-btn {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
    font-family: inherit;
  }
  .confirm-btn:hover { background: var(--primary-dark); }
  .confirm-btn:disabled { background: #cbd5e1; cursor: not-allowed; }

  /* Arabic digits via font-variant */
  .arabic-digits { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="phone">
  <!-- App Bar -->
  <div class="app-bar">
    <div>
      <div class="title">حجز موعد</div>
      <div class="subtitle">العيادة-multispeciality</div>
    </div>
    <button class="icon-btn" aria-label="النباهة">🔔</button>
  </div>

  <!-- Month Navigator -->
  <div class="month-bar">
    <button class="icon-btn" id="prevMonth" aria-label="الشهر_previous">‹</button>
    <div>
      <div class="month-name" id="monthName">ديسمبر ٢٠٢٥</div>
    </div>
    <button class="icon-btn" id="nextMonth" aria-label="الشهر_next">›</button>
  </div>

  <!-- Weekday headers: Sat Sun Mon Tue Wed Thu Fri -->
  <div class="weekdays">
    <div>س</div>
    <div>د</div>
    <div>أ</div>
    <div>ث</div>
    <div>خ</div>
    <div>ج</div>
    <div>ح</div>
  </div>

  <!-- Calendar grid -->
  <div class="calendar" id="calendar"></div>

  <div class="section-divider"></div>

  <!-- Doctor -->
  <div class="section-label"><span class="dot"></span>الطبيب</div>
  <div class="doctor-card">
    <div class="doctor-avatar">د</div>
    <div class="doctor-info">
      <div class="doctor-name">د. فهد العتيبي</div>
      <div class="doctor-specialty">طبيب أسرة • قسم الداخلية</div>
    </div>
    <div class="doctor-rating">★★★★★ ٤.٩</div>
  </div>

  <!-- Time slots -->
  <div class="section-label"><span class="dot"></span>الوقت المتاح</div>
  <div class="time-slots" id="timeSlots"></div>

  <!-- Bottom -->
  <div class="bottom-bar">
    <div class="selected-summary" id="selectedSummary">اختر موعدًا</div>
    <button class="confirm-btn" id="confirmBtn" disabled>تأكيد الحجز</button>
  </div>
</div>

<script>
(function () {
  const monthNames = [
    'يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو',
    'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'
  ];
  const weekdayNames = ['س', 'د', 'أ', 'ث', 'خ', 'ج', 'ح'];
  const timeSlots = [];
  for (let h = 9; h <= 12; h++) {
    for (let m = 0; m < 60; m += 30) {
      if (h === 12 && m > 0) continue;
      const hh = h.toString().padStart(2, '0');
      const mm = m.toString().padStart(2, '0');
      timeSlots.push(hh + ':' + mm);
    }
  }

  // Convert Western digits to Arabic-Indic for display
  function toArabic(n) {
    const digits = '٠١٢٣٤٥٦٧٨٩';
    return n.toString().split('').map(c => {
      if (c >= '0' && c <= '9') return digits.charCodeAt(c.charCodeAt(0) - 48) - 48 + 1632;
      return c;
    }).join('');
  }

  function formatTime(t) {
    const [h, m] = t.split(':');
    const hour = parseInt(h, 10);
    const min = parseInt(m, 10);
    let hDisplay = hour > 12 ? hour - 12 : hour;
    if (hDisplay === 0) hDisplay = 12;
    const period = hour >= 12 ? 'م' : 'ص';
    return toArabic(hDisplay) + ':' + toArabic(min) + ' ' + period;
  }

  let currentDate = new Date();
  let viewYear = currentDate.getFullYear();
  let viewMonth = currentDate.getMonth();
  let selectedDate = null;
  let selectedTime = null;

  const calendarEl = document.getElementById('calendar');
  const monthNameEl = document.getElementById('monthName');
  const timeSlotsEl = document.getElementById('timeSlots');
  const selectedSummaryEl = document.getElementById('selectedSummary');
  const confirmBtn = document.getElementById('confirmBtn');

  function isToday(d) {
    const t = new Date();
    return d.getFullYear() === t.getFullYear() &&
           d.getMonth() === t.getMonth() &&
           d.getDate() === t.getDate();
  }

  function renderCalendar() {
    monthNameEl.textContent = monthNames[viewMonth] + ' ' + toArabic(viewYear);
    calendarEl.innerHTML = '';

    const firstDay = new Date(viewYear, viewMonth, 1);
    // 0 = Sunday, we want Saturday as first column
    // Map: Sat=0, Sun=1, Mon=2, Tue=3, Wed=4, Thu=5, Fri=6
    let startOffset = (firstDay.getDay() + 2) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

    const today = new Date();
    const isCurrentView = viewYear === today.getFullYear() && viewMonth === today.getMonth();

    // Empty cells before first day
    for (let i = 0; i < startOffset; i++) {
      const empty = document.createElement('div');
      empty.className = 'day empty';
      calendarEl.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dayEl = document.createElement('div');
      dayEl.className = 'day';
      dayEl.textContent = toArabic(d);
      const date = new Date(viewYear, viewMonth, d);

      const dow = date.getDay(); // 0 Sun ... 6 Sat
      if (dow === 5 || dow === 6) dayEl.classList.add('weekend'); // Fri, Sat

      if (isToday(date)) dayEl.classList.add('today');

      if (selectedDate &&
          selectedDate.getFullYear() === date.getFullYear() &&
          selectedDate.getMonth() === date.getMonth() &&
          selectedDate.getDate() === date.getDate()) {
        dayEl.classList.add('selected');
      }

      dayEl.addEventListener('click', () => selectDate(date, dayEl));
      calendarEl.appendChild(dayEl);
    }
  }

  function selectDate(date, el) {
    // Remove previous selection
    document.querySelectorAll('.day.selected').forEach(d => d.classList.remove('selected'));
    selectedDate = date;
    selectedTime = null;
    el.classList.add('selected');
    renderTimeSlots();
    updateSummary();
  }

  function renderTimeSlots() {
    timeSlotsEl.innerHTML = '';
    timeSlots.forEach(t => {
      const slot = document.createElement('div');
      slot.className = 'time-slot';
      slot.textContent = formatTime(t);
      slot.dataset.time = t;

      // Mark some as taken randomly-ish for realism
      const taken = (t === '09:30' || t === '11:00');
      if (taken) slot.classList.add('taken');

      if (selectedDate && selectedTime === t) slot.classList.add('selected');

      slot.addEventListener('click', () => {
        if (slot.classList.contains('taken')) return;
        document.querySelectorAll('.time-slot.selected').forEach(s => s.classList.remove('selected'));
        selectedTime = t;
        slot.classList.add('selected');
        updateSummary();
      });
      timeSlotsEl.appendChild(slot);
    });
  }

  function updateSummary() {
    if (!selectedDate) {
      selectedSummaryEl.textContent = 'اختر موعدًا';
      confirmBtn.disabled = true;
      return;
    }
    const dateStr = toArabic(selectedDate.getDate()) + ' ' + monthNames[selectedDate.getMonth()] + ' ' + toArabic(selectedDate.getFullYear());
    if (!selectedTime) {
      selectedSummaryEl.innerHTML = 'الموعد المختار: <strong>' + dateStr + '</strong> — اختر وقتًا';
      confirmBtn.disabled = true;
    } else {
      selectedSummaryEl.innerHTML = 'الموعد المختار: <strong>' + dateStr + ' ' + formatTime(selectedTime) + '</strong>';
      confirmBtn.disabled = false;
    }
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
  });

  confirmBtn.addEventListener('click', () => {
    if (!selectedDate || !selectedTime) return;
    const dateStr = toArabic(selectedDate.getDate()) + ' ' + monthNames[selectedDate.getMonth()] + ' ' + toArabic(selectedDate.getFullYear());
    alert('تم تأكيد الحجز!\nالطبيب: د. فهد العتيبي\nالتاريخ: ' + dateStr + '\nالوقت: ' + formatTime(selectedTime));
  });

  renderCalendar();
  renderTimeSlots();
})();
</script>
</body>
</html>
