<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --type-body-size: 16px;
    --type-label-size: 14px;
    --type-caption-size: 14px;
    --color-bg: #f5f5f5;
    --color-surface: #ffffff;
    --color-text: #1a1a1a;
    --color-text-secondary: #6b7280;
    --color-border: #e5e7eb;
    --color-primary: #0052b4;
    --color-primary-light: #e8f0fe;
    --spacing-xs: 4px;
    --spacing-sm: 8px;
    --spacing-md: 16px;
    --spacing-lg: 24px;
    --spacing-xl: 32px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  :lang(ar) {
    --type-label-size: 14px;
    --type-caption-size: 14px;
    --type-body-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    font-style: normal;
  }

  .screen {
    max-width: 414px;
    margin: 0 auto;
    background-color: var(--color-bg);
    min-height: 100vh;
  }

  /* Header */
  .header {
    background-color: var(--color-surface);
    padding: var(--spacing-md) var(--spacing-lg);
    display: flex;
    align-items: center;
    gap: var(--spacing-sm);
    border-bottom: 1px solid var(--color-border);
  }

  .header-title {
    font-size: var(--type-body-size);
    font-weight: 600;
    flex: 1;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text);
    padding: var(--spacing-xs);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-btn:active {
    background-color: var(--color-border);
  }

  /* Directional icon mirroring */
  .icon-directional:dir(rtl) {
    transform: scaleX(-1);
  }

  /* Avatar section */
  .avatar-section {
    background-color: var(--color-surface);
    padding: var(--spacing-xl) var(--spacing-lg);
    display: flex;
    align-items: center;
    gap: var(--spacing-md);
    border-bottom: 1px solid var(--color-border);
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background-color: var(--color-primary-light);
    color: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .avatar-name {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
  }

  /* Info list */
  .info-list {
    background-color: var(--color-surface);
    margin-top: var(--spacing-md);
    padding: 0 var(--spacing-lg);
    border-bottom: 1px solid var(--color-border);
  }

  .info-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: var(--spacing-md) 0;
    border-bottom: 1px solid var(--color-border);
    gap: var(--spacing-sm);
  }

  .info-item:last-child {
    border-bottom: none;
  }

  .info-label {
    font-size: var(--type-label-size);
    color: var(--color-text-secondary);
    flex-shrink: 0;
  }

  .info-value {
    font-size: var(--type-body-size);
    font-weight: 500;
    text-align: start;
    flex: 1;
    word-break: break-all;
  }

  .edit-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-primary);
    font-size: var(--type-label-size);
    font-weight: 600;
    padding: var(--spacing-xs) var(--spacing-sm);
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .edit-btn:active {
    background-color: var(--color-primary-light);
  }

  /* Logout */
  .logout-section {
    padding: var(--spacing-xl) var(--spacing-lg);
  }

  .logout-btn {
    width: 100%;
    background-color: var(--color-surface);
    border: 1px solid var(--color-border);
    color: #dc2626;
    font-size: var(--type-body-size);
    font-weight: 600;
    padding: var(--spacing-md);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-sm);
  }

  .logout-btn:active {
    background-color: #fef2f2;
  }

  /* bdi isolation for Latin runs */
  bdi {
    display: inline;
  }

  /* Responsive */
  @media (max-width: 414px) {
    .screen { width: 100%; }
  }
</style>
</head>
<body>
  <div class="screen">
    <!-- Header -->
    <header class="header">
      <button class="icon-btn" aria-label="الAmericas Back">
        <svg class="icon-directional" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <h1 class="header-title">الملف الشخصي</h1>
      <button class="icon-btn" aria-label="الAmericas Options">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="1"/>
          <circle cx="12" cy="5" r="1"/>
          <circle cx="12" cy="19" r="1"/>
        </svg>
      </button>
    </header>

    <!-- Avatar & Name -->
    <section class="avatar-section">
      <div class="avatar">ل</div>
      <div class="avatar-name">ليلا المنصوري</div>
    </section>

    <!-- Info List -->
    <section class="info-list">
      <div class="info-item">
        <span class="info-label">الاسم</span>
        <span class="info-value">ليلا المنصوري</span>
        <button class="edit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          تعديل
        </button>
      </div>

      <div class="info-item">
        <span class="info-label">البريد الإلكتروني</span>
        <span class="info-value"><bdi>layla@example.com</bdi></span>
        <button class="edit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          تعديل
        </button>
      </div>

      <div class="info-item">
        <span class="info-label">رقم الهاتف</span>
        <span class="info-value"><bdi>+971 50 123 4567</bdi></span>
        <button class="edit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          تعديل
        </button>
      </div>

      <div class="info-item">
        <span class="info-label">IBAN</span>
        <span class="info-value"><bdi>AE07 0331 2345 6789 0123 456</bdi></span>
        <button class="edit-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
          تعديل
        </button>
      </div>
    </section>

    <!-- Logout -->
    <section class="logout-section">
      <button class="logout-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        تسجيل الخروج
      </button>
    </section>
  </div>
</body>
</html>
