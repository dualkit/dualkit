<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملخص الدفع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :lang(ar) {
    --type-label-size: 14px;
    --type-caption-size: 14px;
    --type-body-size: 16px;
    letter-spacing: 0;
    text-transform: none;
    font-style: normal;
    line-height: 1.7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: var(--type-body-size, 16px);
    background: #0a1628;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    -webkit-font-smoothing: antialiased;
  }

  .phone-frame {
    width: 100%;
    max-width: 390px;
    background: #1a2d4a;
    border-radius: 44px;
    padding: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }

  .phone-frame::before {
    content: '';
    width: 150px;
    height: 5px;
    background: #3a4d6e;
    border-radius: 3px;
    margin: 0 auto 14px;
    display: block;
  }

  .screen {
    background: #fff;
    border-radius: 36px;
    overflow: hidden;
    min-height: 88vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem;
    border-bottom: 1px solid #f0f0f0;
    background: #fff;
  }

  .back-btn {
    background: #f5f5f5;
    border: none;
    cursor: pointer;
    padding: 0.65rem;
    border-radius: 50%;
    color: #1a1a1a;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .back-btn:active {
    background: #e5e5e5;
  }

  .header-title {
    font-size: 1.15rem;
    font-weight: 600;
    flex: 1;
    text-align: start;
  }

  .content {
    padding: 1.5rem;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .amount-section {
    text-align: center;
    padding: 0.5rem 0 1rem;
  }

  .amount-label {
    font-size: var(--type-label-size, 14px);
    color: #888;
    margin-bottom: 1rem;
  }

  .amount-value {
    font-size: 2.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #0a1628;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .details-section {
    background: #f8f9fa;
    border-radius: 14px;
    overflow: hidden;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid #eee;
  }

  .detail-row:last-child {
    border-bottom: none;
  }

  .detail-label {
    font-size: var(--type-label-size, 14px);
    color: #888;
    flex-shrink: 0;
  }

  .detail-value {
    font-size: var(--type-body-size, 16px);
    font-weight: 500;
    text-align: end;
    line-height: 1.5;
    flex-shrink: 0;
    margin-inline-start: 1rem;
  }

  .items-section {
    text-align: center;
  }

  .items-text {
    font-size: var(--type-body-size, 16px);
    color: #333;
    line-height: 1.6;
  }

  .field-section {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .field-label {
    font-size: var(--type-label-size, 14px);
    font-weight: 500;
    color: #555;
    text-align: start;
  }

  .field-input {
    width: 100%;
    padding: 0.85rem 1rem;
    border: 1.5px solid #e5e5e5;
    border-radius: 12px;
    font-size: var(--type-body-size, 16px);
    font-family: inherit;
    direction: ltr;
    text-align: start;
    background: #fafafa;
    transition: border-color 0.15s, background 0.15s;
  }

  .field-input:focus {
    outline: none;
    border-color: #0a1628;
    background: #fff;
  }

  .field-hint {
    font-size: var(--type-caption-size, 14px);
    color: #aaa;
    text-align: start;
    line-height: 1.5;
  }

  .pay-btn {
    width: 100%;
    padding: 1rem;
    background: #0a1628;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    margin-top: auto;
  }

  .pay-btn:active {
    background: #1a2d4a;
  }

  .icon-directional:dir(rtl) {
    transform: scaleX(-1);
  }
</style>
</head>
<body>
  <div class="phone-frame">
    <div class="screen">
      <header class="header">
        <button class="back-btn" aria-label="رجوع">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="icon-directional">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
        <h1 class="header-title">ملخص الدفع</h1>
      </header>

      <div class="content">
        <section class="amount-section">
          <p class="amount-label">مبلغ المستحق</p>
          <p class="amount-value"><bdi dir="ltr">AED 1,234.50</bdi></p>
        </section>

        <section class="details-section">
          <div class="detail-row">
            <span class="detail-label">التاريخ الميلادي</span>
            <span class="detail-value">3 نوفمبر 2026</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">التاريخ الهجري</span>
            <span class="detail-value">12 جمادى الأولى 1448 هـ</span>
          </div>
        </section>

        <section class="items-section">
          <p class="items-text">لديك 3 عناصر في هذا الطلب</p>
        </section>

        <section class="field-section">
          <label class="field-label" for="phone">رقم الهاتف</label>
          <input class="field-input" type="tel" id="phone" inputmode="tel" autocomplete="tel" placeholder="050 123 4567" dir="ltr">
          <p class="field-hint">أرسل الإيصال إلى <bdi dir="ltr">050 123 4567</bdi></p>
        </section>

        <button class="pay-btn">ادفع الآن</button>
      </div>
    </div>
  </div>
</body>
</html>
