<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملخص الدفع</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone {
    width: 100%;
    max-width: 375px;
    background-color: #fff;
    min-height: 100vh;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    padding: 1rem;
    border-bottom: 1px solid #ddd;
    background-color: #fff;
  }
  .back {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    margin-left: 1rem;
  }
  header h1 {
    font-size: 1.2rem;
    margin: 0;
    flex: 1;
    text-align: center;
  }
  main {
    padding: 1rem;
    flex: 1;
  }
  .section {
    margin-bottom: 1.5rem;
  }
  .label {
    display: block;
    font-size: 0.9rem;
    color: #555;
    margin-bottom: 0.25rem;
  }
  .value {
    display: block;
    font-size: 1.2rem;
    font-weight: bold;
  }
  .items {
    font-size: 1rem;
    color: #333;
    margin-bottom: 1.5rem;
  }
  .phone-field {
    margin-bottom: 1.5rem;
  }
  .phone-field label {
    display: block;
    font-size: 0.9rem;
    color: #555;
    margin-bottom: 0.5rem;
  }
  .phone-field input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1rem;
    direction: ltr;
    box-sizing: border-box;
  }
  .pay-now {
    width: 100%;
    padding: 0.75rem;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s;
  }
  .pay-now:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <button class="back" aria-label="رجوع">←</button>
      <h1>ملخص الدفع</h1>
    </header>
    <main>
      <div class="section">
        <span class="label">مبلغ مستحق</span>
        <span class="value">1,234.50 AED</span>
      </div>
      <div class="section">
        <span class="label">التاريخ المستحق</span>
        <span class="value">3 نوفمبر 2026 (10 جمادى الأولى 1448)</span>
      </div>
      <div class="section items">
        <p>لديك 3 عناصر في هذا الطلب</p>
      </div>
      <div class="section phone-field">
        <label for="phone">رقم الهاتف لاستلام الإيصال عبر SMS</label>
        <input type="tel" id="phone" placeholder="050 123 4567">
      </div>
      <button class="pay-now">ادفع الآن</button>
    </main>
  </div>
</body>
</html>
