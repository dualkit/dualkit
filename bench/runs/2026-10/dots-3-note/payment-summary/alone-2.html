<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Summary</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f5f5;
    color: #333;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
  }
  .back {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    margin-left: 8px;
  }
  .title {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }
  .amount {
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    margin: 24px 0;
  }
  .due-date {
    text-align: center;
    margin-bottom: 16px;
  }
  .items {
    text-align: center;
    margin: 16px 0;
    font-size: 16px;
  }
  .phone-field {
    margin: 16px 0;
  }
  .phone-field label {
    display: block;
    margin-bottom: 6px;
    font-size: 16px;
  }
  .phone-field input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
    box-sizing: border-box;
  }
  .pay-button {
    width: 100%;
    padding: 16px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 18px;
    cursor: pointer;
    margin-top: auto;
  }
  .pay-button:hover {
    background-color: #0056b3;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <button class="back" onclick="history.back()">&#8592;</button>
    <div class="title">ملخص الدفع</div>
  </div>

  <div class="amount">1,234.50 AED</div>

  <div class="due-date">
    <div>3 نوفمبر 2026</div>
    <div>12 ربيع الأول 1448</div>
  </div>

  <div class="items">لديك 3 عناصر في هذا الطلب</div>

  <div class="phone-field">
    <label for="phone">رقم الهاتف</label>
    <input type="tel" id="phone" placeholder="050 123 4567">
  </div>

  <button class="pay-button" onclick="alert('Processing payment')">ادفع الآن</button>
</div>
</body>
</html>
